extension_triceps_sobrecabeza_polea:{name:"Extensión de tríceps sobre la cabeza en polea",tag:"carga",type:"reps",sets:3,reps:12,rest:60,load:true,unit:"kg",coach:"Deja que los codos se vayan bien atrás de la cabeza al bajar: ese estiramiento es todo el punto del ejercicio.",
  steps:["Pon la polea a la altura baja, toma la cuerda, gírate de espaldas a la máquina y da un paso al frente con los brazos flexionados detrás de la nuca.","Estira los codos hacia adelante y arriba hasta bloquear los brazos, separando las manos al final.","Regresa lento hasta que las manos queden detrás de la cabeza, sin abrir los codos hacia los lados."]},
face_yoga:{name:"Face yoga (facial)",tag:"opcional",type:"reps",sets:1,reps:10,rest:0,
  steps:["Sonríe con labios cerrados y sube las mejillas.","Coloca los dedos suave sobre las mejillas como resistencia.","Mantén 5 s y relaja. Movimientos suaves."]},
flexiones:{name:"Flexiones de pecho",tag:"carga",type:"reps",sets:2,reps:12,rest:40,load:false,unit:"kg",coach:"Calentamiento suave, sin llegar al fallo. Si sustituye al press: 4 series duras con pies elevados.",
  steps:["Apoya las manos bajo los hombros","Baja el pecho con los codos cerca","Empuja hasta extender sin arquear"]},
flexiones_inclinadas:{name:"Flexiones inclinadas en barra",tag:"calent",type:"reps",sets:1,reps:12,rest:20,load:false,unit:"kg",coach:"Cuanto más alta la barra, más fácil. No busques fallar.",
  steps:["Manos en la barra a la altura de la cadera.","Cuerpo recto, baja el pecho hasta rozar la barra.","Codos a cuarenta y cinco grados; empuja alejando la barra."]},
flexiones_pared:{name:"Flexiones en la pared",tag:"carga",type:"reps",sets:2,reps:12,rest:45,load:false,unit:"kg",coach:"Cuanto más lejos pongas los pies, más pesa. Ahí está la progresión.",
  steps:["Manos en la pared a la altura del pecho, un paso y medio de distancia.","Baja el pecho hacia la pared en tres segundos, cuerpo en línea recta.","Empuja hasta estirar los brazos, exhalando al subir."]},
flexor_cadera:{name:"Estiramiento del flexor de cadera",tag:"diario",type:"hold_side",sets:2,holdSec:30,rest:30,coach:"Calentamiento: abre la cadera, 10 respiraciones por lado.",
  steps:["Media rodilla al piso; la otra pierna al frente a 90°.","Mete la pelvis (retroversión) y aprieta el glúteo de atrás.","Empuja la cadera al frente. Mantén sin arquear la lumbar."]},
fondos_banco:{name:"Fondos en banco",tag:"carga",type:"reps",sets:3,reps:12,rest:75,load:false,unit:"kg",coach:"Codos hacia atrás; no bajes tanto que el hombro se vaya al frente.",
  steps:["Apoya las manos en el borde del banco","Baja la cadera flexionando los codos atrás","Empuja con los tríceps hasta extender"]},
fondos_paralelas:{name:"Fondos en paralelas",tag:"carga",type:"reps",sets:3,reps:9,rest:120,load:true,unit:"kg",coach:"Inclina el torso al frente para cargar más pecho. Si te sobran reps, añade lastre.",
  steps:["Sube el cuerpo con brazos extendidos en paralelas","Baja controlado inclinándote ligeramente al frente","Empuja hacia arriba contrayendo pecho y tríceps"]},
gato_camello:{name:"Gato–camello",tag:"calent",type:"reps",sets:1,reps:10,rest:0,coach:"Calentamiento: movilidad lenta de columna, respirando.",
  steps:["Ponte en cuatro apoyos: manos bajo los hombros, rodillas bajo las caderas.","Redondea la espalda hacia arriba (gato) metiendo el ombligo, mira al abdomen.","Invierte: hunde la espalda y sube la mirada (camello). Alterna lento con la respiración."]},
gato_camello_pie:{name:"Gato–camello de pie",tag:"calent",type:"reps",sets:1,reps:10,rest:15,coach:"Sustituye al gato–camello del suelo: mismo movimiento, sin colchoneta.",
  steps:["De pie, rodillas semiflexionadas, manos en los muslos.","Redondea la espalda y lleva el mentón al pecho.","Invierte: saca el pecho y arquea suave la espalda."]},
glute_bridge:{name:"Puente de glúteo",tag:"diario",type:"reps",sets:2,reps:12,rest:20,coach:"Calentamiento: aprieta el glúteo 2 s arriba antes de cargar.",
  steps:["Boca arriba, rodillas flexionadas, pies plantados al ancho de cadera.","Empuja con los talones y sube la cadera hasta alinear rodilla-cadera-hombro.","Aprieta glúteos 2 s arriba y baja. No arquees la lumbar. (Puedes cargar una mancuerna.)"]},
hack_squat:{name:"Sentadilla en máquina inclinada (hack squat)",tag:"carga",type:"reps",sets:4,reps:8,rest:180,load:true,unit:"kg",coach:"Tu sentadilla principal: baja controlado pasando la paralela y empuja con todo el pie. Antes de la primera serie, dos de aproximación que no cuentan: 1×10 con la mitad del peso y 1×5 con el 70%.",
  steps:["Apoya espalda y hombros en la máquina, pies al ancho de hombros en el centro de la plataforma.","Baja controlado en 2-3 segundos hasta pasar la paralela, con las rodillas siguiendo la punta del pie.","Empuja con todo el pie hasta arriba sin bloquear las rodillas ni despegar la cadera del respaldo."]},
hip_thrust_db:{name:"Hip thrust con mancuerna",tag:"carga",type:"reps",sets:4,reps:10,rest:120,load:true,unit:"kg",coach:"Alternativa: espalda alta en el banco, barbilla al pecho y aprieta el glúteo 1 s arriba.",
  steps:["Apoya la espalda alta en el banco","Coloca la mancuerna sobre la cadera y sujétala","Empuja la cadera arriba apretando los glúteos"]},
hiperextension_banco:{name:"Hiperextensión en banco romano",tag:"carga",type:"reps",sets:3,reps:12,rest:60,load:false,unit:"kg",coach:"Termina apretando el glúteo, no arqueando la espalda baja.",
  steps:["Colócate en el banco con las caderas justo por delante del apoyo y los tobillos asegurados.","Baja el torso doblando la cadera hasta sentir el estiramiento en isquios y glúteo.","Sube hasta alinear el torso con las piernas, sin pasarte de la línea recta."]},
isometricos_cervicales:{name:"Isométricos cervicales",tag:"diario",type:"hold",sets:3,reps:8,holdSec:8,rest:15,
  steps:["Palma en la frente: empuja la cabeza contra la mano sin que se mueva.","Repite con la mano en cada lado de la cabeza.","Termina con la mano en la nuca. Fuerza suave-media, respira."]},
jalon_pecho:{name:"Jalón al pecho",tag:"carga",type:"reps",sets:4,reps:10,rest:120,load:true,unit:"kg",coach:"Primer pesado: baja los omóplatos y lleva la barra al pecho alto, subida controlada. Antes de la primera serie, dos de aproximación que no cuentan: 1×10 con la mitad del peso y 1×5 con el 70%.",
  steps:["Siéntate con la espalda recta en la máquina, agarra la barra con los brazos extendidos.","Jala la barra hacia tu pecho, contrayendo los músculos de la espalda.","Controla el descenso y regresa a la posición inicial sin bloquear los codos."]},
mandibula_platisma:{name:"Tensión de platisma y mandíbula",tag:"diario",type:"reps",sets:2,reps:8,rest:15,load:false,unit:"kg",coach:"8 contracciones de 5–8 s. Cierra la rutina. Efecto estético modesto (ver notas).",
  steps:["Sentado erguido, mirada al frente, hombros bajos y relajados.","Baja las comisuras de los labios enseñando los dientes de abajo hasta marcar los cordones del cuello (platisma).","Sostén la tensión 5–8 s y relaja del todo. No subas los hombros ni eches la cabeza hacia atrás."]},
maquina_gluteo:{name:"Empuje de cadera en máquina",tag:"carga",type:"reps",sets:3,reps:10,rest:90,load:true,unit:"kg",coach:"Empuja con el talón y bloquea la cadera 1 s arriba sin arquear la lumbar.",
  steps:["Siéntate con la espalda contra el respaldo y ajusta el asiento a la altura de la cadera.","Coloca los pies sobre la plataforma, luego empuja hacia adelante controlando el movimiento.","Regresa lentamente a la posición inicial sin relajar completamente los glúteos."]},
marcha_sitio:{name:"Marcha en el sitio",tag:"calent",type:"cardio",sets:1,holdSec:120,rest:0,coach:"Ritmo fácil: tienes que poder hablar sin cortar frases.",
  steps:["De pie, marcha levantando las rodillas a media altura.","Acompaña el movimiento con los brazos, hombros sueltos.","Dos minutos suaves: buscas entrar en calor, no cansarte."]},
mewing_lengua:{name:"Postura de lengua (mewing)",tag:"diario",type:"hold",sets:1,holdSec:45,rest:0,load:false,unit:"kg",coach:"45 s de mantenimiento. Su valor real está en repetirlo durante el día, no en esta serie.",
  steps:["Labios cerrados y dientes juntos sin apretar; cabeza neutra con la barbilla ligeramente metida.","Apoya TODA la lengua contra el paladar (punta, centro y base) y traga una vez para fijar la posición.","Mantén respirando solo por la nariz. Esto es un hábito de todo el día, la serie solo te enseña la posición."]},
movilidad_cervical:{name:"Movilidad cervical",tag:"diario",type:"reps",sets:1,reps:8,rest:0,coach:"Calentamiento obligatorio antes de cargar el cuello: 8 repeticiones por dirección, rango cómodo.",
  steps:["Sentado erguido, hombros relajados.","Haz «sí» (flexo-extensión), luego «no» (rotaciones), luego oreja-hombro.","Rango cómodo sin dolor; ~8 por dirección."]},
open_book:{name:"Open book (rotación torácica)",tag:"diario",type:"reps_side",sets:1,reps:8,rest:30,
  steps:["De lado, caderas y rodillas a 90°, brazos juntos al frente.","Abre el brazo de arriba hacia el otro lado siguiéndolo con la mirada.","Lleva el omóplato al piso y regresa. Rodillas quietas."]},
pallof_banda:{name:"Press Pallof con banda",tag:"carga",type:"reps_side",sets:2,reps:10,rest:30,load:false,unit:"kg",coach:"La banda quiere girarte: tu trabajo es que no lo consiga.",
  steps:["Ancla la banda a la altura del pecho y ponte de lado, pies al ancho de cadera.","Sujétala con las dos manos en el pecho y estira los brazos al frente.","Aguanta 2 s sin dejar que el tronco gire y regresa. Cambia de lado."]},
pec_deck:{name:"Contractora de pecho (pec deck / mariposa)",tag:"carga",type:"reps",sets:3,reps:12,rest:75,load:true,unit:"kg",coach:"Aprieta 1 s al juntar y abre lento; no lleves los codos más atrás del hombro.",
  steps:["Ajusta el asiento para que las manijas queden a la altura del pecho y apoya bien la espalda en el respaldo.","Junta los brazos al frente con los codos ligeramente flexionados y aprieta el pecho 1 segundo.","Abre lento hasta sentir el estiramiento, sin llevar los codos más atrás de la línea de los hombros."]},
pec_deck_inverso:{name:"Pec deck inverso",tag:"carga",type:"reps",sets:3,reps:15,rest:60,load:true,unit:"kg",coach:"También lo llaman pájaros en máquina o contractora inversa. Deltoides posterior, no dorsal.",
  steps:["Pecho contra la almohadilla, brazos casi extendidos.","Abre hacia atrás en línea con los hombros.","Regresa lento; no encojas el trapecio ni golpees las placas."]},
pec_puerta:{name:"Estiramiento de pectoral en la puerta",tag:"diario",type:"hold_side",sets:2,holdSec:30,rest:0,
  steps:["Antebrazo en el marco de la puerta, codo a la altura del hombro.","Da un paso adelante y rota el torso al lado contrario.","Siente el pecho; mantén y cambia de brazo."]},
peso_muerto_rumano_db:{name:"Peso muerto rumano",tag:"carga",type:"reps",sets:3,reps:12,rest:90,load:true,unit:"kg",coach:"Cadera atrás, espalda recta, baja hasta sentir el isquio. No busques el suelo.",
  steps:["Sujeta las mancuernas frente a los muslos","Lleva la cadera atrás con la espalda recta","Sube apretando los glúteos sin arquear la espalda"]},
piernas_pared:{name:"Piernas en la pared",tag:"diario",type:"hold",sets:1,holdSec:120,rest:0,coach:"Cierre del día: baja pulsaciones y descarga las piernas.",
  steps:["Túmbate en el tapete con la cadera cerca de la pared.","Sube las piernas apoyadas en la pared, rodillas algo blandas.","Dos minutos respirando lento por la nariz, brazos abiertos."]},
prensa_inclinada:{name:"Prensa inclinada",tag:"carga",type:"reps",sets:3,reps:11,rest:120,load:true,unit:"kg",coach:"Rango completo sin despegar la lumbar; no bloquees la rodilla arriba.",
  steps:["Ajusta el asiento y apoya la espalda contra el respaldo","Baja las plataformas flexionando rodillas hasta formar ángulo de 90 grados","Empuja hacia arriba extendiendo piernas sin bloquear las rodillas"]},
press_banca_db:{name:"Press de pecho con mancuernas",tag:"carga",type:"reps",sets:4,reps:8,rest:120,load:true,unit:"kg",coach:"Lo más pesado del día: baja en 2-3 s y deja 1-2 repeticiones en reserva. Antes de la primera serie, dos de aproximación que no cuentan: 1×10 con la mitad del peso y 1×5 con el 70%.",
  steps:["Acuéstate en el banco con los pies firmes en el piso","Baja los mancuernas controladamente hasta tocar el pecho","Empuja explosivamente hacia arriba hasta extender los brazos"]},
press_frances:{name:"Press francés con barra Z",tag:"opcional",type:"reps",sets:3,reps:10,rest:75,load:true,unit:"kg",coach:"Baja la barra hacia la frente o un poco por detrás de la cabeza, nunca hacia el pecho.",
  steps:["Acuéstate en un banco plano con la barra Z sostenida y los brazos estirados sobre los hombros.","Flexiona los codos para bajar la barra hasta la frente, manteniendo los brazos apuntando al techo.","Estira los codos para volver al inicio, sin llevar la barra hacia adelante."]},
press_hombro_db:{name:"Press de hombro con mancuernas",tag:"carga",type:"reps",sets:3,reps:10,rest:120,load:true,unit:"kg",coach:"Sentado con respaldo, sin arquear la lumbar al empujar.",
  steps:["De pie o sentado, mancuernas a la altura de los hombros con codos a 90°.","Presiona hacia arriba extendiendo los brazos, codos ligeramente flexionados al final.","Baja controlado a la altura de los hombros. Mantén el core activo sin arquear la lumbar."]},
puente_gluteo_banda:{name:"Puente de glúteo con banda",tag:"carga",type:"reps",sets:2,reps:12,rest:40,load:false,unit:"kg",coach:"Empuja la banda hacia fuera todo el rato: así entra el glúteo medio.",
  steps:["Tumbada en el tapete, banda por encima de las rodillas y pies al ancho de cadera.","Aprieta los glúteos y sube la cadera hasta alinear tronco y muslos.","Aguanta 2 s arriba y baja en tres segundos sin dejar caer la cadera."]},
/* Ni otro remo ni otro jalon: trabaja el dorsal en extension de hombro, que es
   el tercer patron que le faltaba al dia de tiron. */
pullover_polea:{name:"Pullover en polea alta",tag:"carga",type:"reps",sets:3,reps:12,rest:60,load:true,unit:"kg",coach:"Codos apenas flexionados y fijos todo el recorrido: si se doblan, se convierte en una extensión de tríceps.",
  steps:["Toma la cuerda o la barra recta de la polea alta, retrocede dos pasos e inclina el torso al frente con los brazos estirados sobre la cabeza.","Baja el agarre en arco amplio hasta que las manos lleguen a los muslos, apretando el dorsal al final.","Deja que los brazos suban de nuevo controlados hasta sentir el estiramiento completo del dorsal."]},
remo_banda:{name:"Remo con banda",tag:"carga",type:"reps",sets:2,reps:12,rest:45,load:false,unit:"kg",coach:"Tira con la espalda, no con los brazos: primero mueve el omóplato.",
  steps:["Sentada en el tapete, banda rodeando las plantas de los pies y una punta en cada mano.","Lleva los codos atrás pegados al cuerpo hasta las costillas.","Suelta en tres segundos manteniendo el pecho alto."]},
remo_db:{name:"Remo con mancuerna",tag:"carga",type:"reps_side",sets:4,reps:10,rest:90,load:true,unit:"kg",coach:"10 por brazo, rango largo hacia la cadera y sin girar el torso.",
  steps:["Inclina el torso hacia adelante, espalda recta, rodillas ligeramente flexionadas","Tira la mancuerna hacia tu cadera, codo pegado al cuerpo, aprieta los omoplatos","Baja con control, extiende el brazo completamente sin bloquear el codo"]},
remo_inclinado:{name:"Remo inclinado con mancuernas",tag:"carga",type:"reps",sets:2,reps:12,rest:40,load:true,unit:"kg",coach:"SOLO para postura_completa (no va en cuello_rostro). Con este dosaje postura_completa queda en ~19 min; con su dosaje por defecto 3x10/60 s se pasaría de 20.",
  steps:["Bisagra de cadera, espalda plana ~45°, mancuernas bajo los hombros.","Jala ambas hacia las caderas llevando los codos atrás.","Aprieta los omóplatos y baja controlado. No rotes el torso."]},
remo_invertido:{name:"Remo invertido",tag:"carga",type:"reps",sets:3,reps:12,rest:90,load:false,unit:"kg",coach:"Cuerpo recto como una tabla; cuanto más horizontal, más difícil.",
  steps:["Agárrate a la barra con el cuerpo recto","Tira llevando el pecho hacia la barra","Baja despacio sin hundir la cadera"]},
remo_maquina:{name:"Remo sentado en máquina",tag:"carga",type:"reps",sets:5,reps:10,rest:120,load:true,unit:"kg",coach:"Pecho apoyado, tira con los codos y junta escápulas 1 s. Antes de la primera serie, dos de aproximación que no cuentan: 1×10 con la mitad del peso y 1×5 con el 70%.",
  steps:["Siéntate con la espalda apoyada en el respaldo, pecho contra el pad.","Hala las asas hacia ti, llevando los codos atrás de tu torso.","Mantén la contracción, luego extiende lentamente sin bloquear los brazos."]},
remo_polea:{name:"Remo en polea baja",tag:"opcional",type:"reps",sets:4,reps:10,rest:120,load:true,unit:"kg",coach:"Torso firme, no tires con la lumbar ni te eches atrás.",
  steps:["Siéntate en el piso con las piernas extendidas, agarra el asa con brazos rectos.","Jala el asa hacia tu pecho, llevando los codos lo más atrás posible.","Controla la extensión y regresa al punto de partida manteniendo la tensión."]},
respiracion_diafragmatica:{name:"Respiración diafragmática",tag:"diario",type:"hold",sets:1,holdSec:120,rest:0,coach:"Cierra siempre así: entrenar deja el cuerpo acelerado y esto lo baja.",
  steps:["Túmbate en el tapete con las rodillas dobladas y una mano en la barriga.","Inhala por la nariz 4 s notando cómo sube la mano, no el pecho.","Exhala por la boca 6 s. Dos minutos sin forzar."]},
reverse_fly:{name:"Reverse fly con mancuernas",tag:"carga",type:"reps",sets:2,reps:12,rest:75,coach:"Deltoides posterior: hombros más redondos y menos caídos hacia delante. Peso ligero, 1 s de apriete escapular.",
  steps:["Bisagra de cadera ~45° con espalda plana (o boca abajo), mancuernas colgando.","Sube los brazos a los lados formando una «T», codos casi rectos.","Aprieta los omóplatos 1 s y baja lento. Poco peso."]},
rotacion_externa_db:{name:"Rotación externa de hombro con mancuerna",tag:"carga",type:"reps_side",sets:2,reps:12,rest:30,load:true,unit:"kg",coach:"Calentamiento: peso mínimo, codo pegado al costado. Solo activar el hombro.",
  steps:["De pie, codo pegado al costado y flexionado a 90° con una mancuerna muy ligera.","Gira el antebrazo hacia afuera sin separar el codo del cuerpo.","Vuelve lento al centro; es activación del manguito rotador, no busques peso."]},
sentadilla_aire:{name:"Sentadilla al aire",tag:"calent",type:"reps",sets:1,reps:15,rest:15,load:false,unit:"kg",coach:"Sin peso. Busca rango, no cansancio.",
  steps:["Pies al ancho de hombros, puntas algo hacia afuera.","Baja lento hasta que los muslos pasen la paralela.","Rodillas siguen la línea de los pies, talones clavados."]},
sentadilla_bulgara:{name:"Sentadilla búlgara",tag:"opcional",type:"reps_side",sets:3,reps:10,rest:90,load:true,unit:"kg",coach:"Extra: 10 por pierna, torso algo inclinado para cargar el glúteo.",
  steps:["Coloca el pie trasero sobre un banco o paso detrás de ti; el delantero a distancia de brazo.","Baja flexionando la rodilla delantera hasta que el muslo esté paralelo al suelo.","Empuja con el talón delantero y sube; completa todas las reps antes de cambiar de pierna."]},
sentadilla_goblet:{name:"Sentadilla goblet",tag:"carga",type:"reps",sets:2,reps:10,rest:45,load:true,unit:"kg",coach:"Calentamiento con peso ligero, solo para entrar en rango antes de la hack.",
  steps:["Sujeta la mancuerna vertical contra el pecho","Baja la cadera manteniendo el pecho erguido","Empuja con los talones para volver arriba"]},
sentadilla_silla:{name:"Sentarse y levantarse",tag:"carga",type:"reps",sets:2,reps:12,rest:45,load:true,unit:"kg",startKg:0,coach:"Sin peso hasta que las 12 salgan cómodas; luego una mancuerna al pecho.",
  steps:["De pie frente a una silla, pies al ancho de cadera y punteras algo abiertas.","Baja la cadera atrás en tres segundos hasta tocar el asiento sin sentarte del todo.","Empuja con los talones para subir, exhalando, y aprieta los glúteos arriba."]},
sentadilla_smith:{name:"Sentadilla en barra guiada (Smith)",tag:"carga",type:"reps",sets:4,reps:8,rest:180,load:true,unit:"kg",coach:"Alternativa guiada: pies un paso adelante, baja a la paralela con el pecho alto.",
  steps:["Coloca la barra guiada sobre los trapecios y adelanta los pies un paso respecto a la cadera.","Baja controlado hasta que el muslo quede paralelo al suelo, con el pecho alto y el abdomen firme.","Empuja con el medio del pie para subir, sin bloquear del todo las rodillas."]},
tmj_mandibula:{name:"Movilidad de mandíbula (TMJ)",tag:"diario",type:"reps",sets:1,reps:8,rest:0,
  steps:["Punta de la lengua en el paladar, tras los dientes.","Abre y cierra la boca despacio manteniendo la lengua arriba.","Luego mueve la mandíbula suave a los lados. Sin forzar chasquidos."]},
trapecio_superior:{name:"Estiramiento del trapecio superior",tag:"diario",type:"hold_side",sets:2,holdSec:30,rest:0,
  steps:["Siéntate erguido; ancla una mano para bajar ese hombro.","Inclina la cabeza llevando la oreja al hombro contrario.","Con la mano libre guía suave sobre la cabeza. No gires el cuello."]},
vuelos_posteriores_ligeros:{name:"Vuelos posteriores ligeros",tag:"calent",type:"reps",sets:1,reps:15,rest:15,load:true,unit:"kg",coach:"Peso mínimo: esto despierta el hombro, no lo entrena.",
  steps:["De pie, bisagra de cadera suave, espalda plana.","Sube los brazos a los lados hasta la altura del hombro.","Baja controlado; no encojas los hombros."]},
wall_angels:{name:"Wall angels",tag:"diario",type:"reps",sets:2,reps:10,rest:30,coach:"Calentamiento: espalda y brazos pegados a la pared, sube y baja sin despegar.",
  steps:["Espalda a la pared: cabeza, espalda alta y glúteos en contacto; pies algo adelante.","Pega brazos y dorso de las manos a la pared en forma de «W».","Sube a «Y» sin despegar y baja. Si despegas la lumbar, reduce el rango."]},
zancada_estatica:{name:"Zancada estática con apoyo",tag:"carga",type:"reps_side",sets:2,reps:10,rest:45,load:true,unit:"kg",startKg:0,coach:"La rodilla de delante no pasa de la punta del pie.",
  steps:["Un pie delante y otro detrás, una mano en la pared o en el respaldo de una silla.","Baja recto hasta que la rodilla de atrás quede cerca del suelo.","Empuja con la pierna de delante para subir. Termina las 10 y cambia de lado."]},
zancadas_db:{name:"Zancadas con mancuernas",tag:"carga",type:"reps_side",sets:3,reps:10,rest:90,load:true,unit:"kg",coach:"Extra: 10 por pierna, paso largo y bajada controlada.",

/* record personal: una serie es record si ninguna anterior la domina en peso
   Y repeticiones a la vez. Es la misma regla que ya usa el panel de progreso. */
function isPR(id,w,reps){w=w||0;reps=reps||0;if(!reps)return false;
  const recs=loadLogs()[id]||[],ses=sessLog(curRoutine)[id]||[];
  if(!recs.length&&!ses.length)return false;
  let dom=false;
  const rev=st=>{(st||[]).forEach(x=>{if((x.w||0)>=w&&(x.reps||0)>=reps)dom=true;});};
  recs.forEach(r=>rev(r.sets));rev(ses);
  return !dom;}
/* Tres niveles, porque celebrar todo igual devalua la senal: un logro trivial
   no construye nada. El de rango es el fuerte, porque es el que dispara la
   subida de carga de la sesion siguiente. */
function prLevel(id,w,reps){const rng=repRange(id),recs=loadLogs()[id]||[];
  let mejorE1=0;recs.forEach(r=>{mejorE1=Math.max(mejorE1,bestE1(id,r));});
  const e1=(reps>=rng[0])?e1rm(w||0,reps):0;
  if(e1>0&&e1>mejorE1*1.005)return 2;                    /* nuevo maximo de e1RM */
  return 1;}                                             /* mejor para esas reps */
function markPR(id,w,reps){const sv=loadSess();if(!sv)return;
  const lvl=prLevel(id,w,reps);
  sv.pr=sv.pr||[];sv.pr.push({id:id,w:w,reps:reps,lvl:lvl});saveSess(sv);
  const e=EX[id]||{},u=e.unit||"kg",marca=(w>0)?fmtW(w)+" "+u+" \u00d7 "+reps:reps+" reps";
  /* nivel 1 no lanza aviso flotante: se ve en la propia serie y ya */
  if(lvl>=2)toast(ic("trophy","sm")+" R\u00e9cord en "+esc(shortName(id))+": <b>"+marca+"</b>");}

function beep(){try{actx=actx||new (window.AudioContext||window.webkitAudioContext)();if(actx.state==="suspended")actx.resume();
  const t=actx.currentTime;[[880,t],[1175,t+.42]].forEach(([f,st])=>{const o=actx.createOscillator(),g=actx.createGain();
  o.connect(g);g.connect(actx.destination);o.type="sine";o.frequency.value=f;g.gain.setValueAtTime(.0001,st);
  g.gain.exponentialRampToValueAtTime(.3,st+.02);g.gain.exponentialRampToValueAtTime(.0001,st+.34);o.start(st);o.stop(st+.36);});}catch(e){}
  try{if(navigator.vibrate)navigator.vibrate([120,60,120]);}catch(e){}}

function completeDay(){const s=loadStreak(),t=today();if(s.last!==t){s.count=(s.last===yesterday())?s.count+1:1;s.last=t;s.total=(s.total||0)+1;}s.best=Math.max(s.best||0,s.count);jset("rp_streak",s);return s;}

/* ==== [S6] SEMANA CUMPLIDA ================================================
   La racha diaria se rompia si no entrenabas un dia, aunque fuera dia de
   descanso planificado. Con un split de 3 dias eso castiga exactamente lo que
   el programa pide. Ninguna de las cuatro apps de fuerza de referencia usa
   racha diaria, y por este motivo.
   Se cuenta por semanas cerradas: la semana en curso nunca resta, solo se
   muestra como progreso. El historico de la racha diaria no se borra. */
/* ojo: mas abajo ya existe un weekStart(off) que devuelve una cadena y toma un
   desplazamiento de semanas. Estas se llaman distinto para no pisarlo. */
function wkMonday(d){const x=new Date(d);x.setHours(0,0,0,0);
  x.setDate(x.getDate()-((x.getDay()+6)%7));return x;}
function wkKey(d){return ds(wkMonday(d));}
function gymSessionsByWeek(){const m={};
  loadHist().forEach(r=>{if(GYMKEYS.indexOf(r.key)<0)return;
    /* cuenta como sesion si se registro la mayoria del trabajo, no por abrirla */
    if(r.exTotal&&r.exDone/r.exTotal<0.6)return;
    const k=wkKey(new Date(r.iso));m[k]=(m[k]||0)+1;});
  return m;}
function weekGoal(){const p=loadPlan();
  const n=p.filter(v=>v&&GYMKEYS.indexOf(v)>=0).length;
  return n||3;}
function weekStats(){const m=gymSessionsByWeek(),goal=weekGoal(),hoy=new Date();
  const actual=wkKey(hoy),hechas=m[actual]||0;
  let racha=0,cur=wkMonday(hoy);
  for(;;){cur.setDate(cur.getDate()-7);const k=ds(cur);
    if((m[k]||0)>=goal)racha++;else break;
    if(racha>200)break;}
  let mejor=racha;const keys=Object.keys(m).sort();
  if(keys.length){let run=0,prev=null;
    keys.forEach(k=>{if(m[k]<goal){run=0;prev=k;return;}
      const d=new Date(k+"T00:00:00");
      if(prev){const pd=new Date(prev+"T00:00:00");
        run=((d-pd)/86400000===7&&m[prev]>=goal)?run+1:1;}else run=1;
      prev=k;mejor=Math.max(mejor,run);});}
  return {goal:goal,hechas:hechas,racha:racha,mejor:mejor,
    semanaOK:hechas>=goal,total:Object.keys(m).length};}
function loadHist(){return jget("rp_history",[]);}
function recordSession(key,name,sum,when){const h=loadHist(),d=when?new Date(when):new Date();
  const e={key,name,iso:d.toISOString(),day:DAYS[d.getDay()],
    date:String(d.getDate()).padStart(2,"0")+"/"+String(d.getMonth()+1).padStart(2,"0")+"/"+d.getFullYear(),
    time:String(d.getHours()).padStart(2,"0")+":"+String(d.getMinutes()).padStart(2,"0")};
  if(sum){e.sets=sum.sets;e.vol=sum.vol;e.exDone=sum.exDone;e.exTotal=sum.exTotal;e.dur=sum.dur;e.ids=sum.ids;
    if(sum.pr&&sum.pr.length)e.pr=sum.pr;}
  h.unshift(e);jset("rp_history",h.slice(0,200));return e;}

/* ---------- HOME ---------- */
function renderHome(){
  const s=loadStreak(),w=weekStats();
  $("stCount").textContent=w.racha;
  $("stCountL").textContent=plural(w.racha,"semana cumplida","semanas cumplidas");
  /* el anillo de la semana en curso: el gradiente de meta tira mas cuanto mas
     cerca esta el objetivo, y la semana viva nunca resta */
  $("stWeek").innerHTML=`<span class="wkring">${ringSVG(w.goal?w.hechas/w.goal:0,26,3.5)}</span>`
    +`<b>${w.hechas} de ${w.goal}</b> esta semana`;
  renderTodayCard(s);renderWeek();
  let h="";
  GROUPS.forEach(g=>{
    h+=`<div class="grouptitle">${g.title}</div><div class="rlist">`;
    g.keys.forEach(k=>{const r=ROUTINES[k];
      h+=`<div class="rcard" onclick="openRoutine('${k}')">
        <div class="em ${r.cls}">${ic(routIcon(k),"lg")}</div>
        <div class="t"><div class="nm">${r.name}</div><div class="ds">${esc(r.desc)}</div></div>
        <div class="rt">${estMinutes(k)}′</div>
        <div class="go">${ic("right","sm")}</div></div>`;});
    h+=`</div>`;});
  $("routines").innerHTML=h;
}

/* ---------- ROUTINE DETAIL ---------- */
/* d es la dosificacion efectiva; si no se pasa, se cae a la del programa para
   que los sitios que aun no tienen la clave de rutina sigan funcionando. */
function metaOf(e,d){d=d||e;return e.type==="cardio"?`${Math.round(d.holdSec/60)} min`:
  e.type==="hold"?`${d.sets} × ${d.holdSec}s`:e.type==="hold_side"?`${d.sets} × ${d.holdSec}s / lado`:
  e.type==="reps_side"?`${d.sets} × ${d.reps} / lado`:`${d.sets} × ${d.reps}`;}
/* ---- opcionales: sustitutos (swap) y extras ---- */
function loadSwaps(){return jget("rp_swaps",{});}
function swapOf(k,id){const s=loadSwaps()[k]||{};return s[id]||null;}
function setSwap(k,id,alt){const all=loadSwaps();all[k]=all[k]||{};if(alt)all[k][id]=alt;else delete all[k][id];jset("rp_swaps",all);}
function loadExtras(){return jget("rp_extras",{});}
function extrasOn(k){return loadExtras()[k]||[];}
/* ---- dosificacion: la del programa mas la del usuario encima ----
   Mismo patron que rp_swaps: por rutina, porque el mismo ejercicio vive en
   varias con dosis distintas. Solo se guarda el campo que el usuario toco, asi
   que si manana cambia la recomendacion del programa, lo no tocado la sigue.
   Se indexa por el ejercicio que SE EJECUTA, no por el hueco de la rutina:
   cambiar el press por flexiones no debe arrastrarle "5 series". */
function loadDoses(){return jget("rp_doses",{});}
function doseOv(k,id){const a=loadDoses()[k];return (a&&a[id])||null;}
function setDose(k,id,patch){const all=loadDoses();all[k]=all[k]||{};
  const cur=Object.assign({},all[k][id]||{},patch||{});
  Object.keys(cur).forEach(f=>{if(cur[f]==null)delete cur[f];});
  if(Object.keys(cur).length)all[k][id]=cur;else delete all[k][id];
  if(!Object.keys(all[k]).length)delete all[k];
  jset("rp_doses",all);}
/* Tres capas, de menos a mas especifica: la del programa en EX, la del bloque
   secundario en SECDOSE (el mismo ejercicio pesa menos cuando es el rescate de
   otro dia), y encima el ajuste del usuario.
   !=null en los cuatro campos, nunca ||: rest:0 es un valor real
   (gato_camello, y todos los calentamientos encadenados). */
function secDose(k,id){const a=(typeof SECDOSE!=="undefined"&&SECDOSE[k])||null;
  return (a&&a[id])||{};}
function progDose(k,id){const e=EX[id]||{},s=secDose(k,id);
  return {sets:s.sets!=null?s.sets:e.sets, reps:s.reps!=null?s.reps:e.reps,
    holdSec:s.holdSec!=null?s.holdSec:e.holdSec,
    rest:s.rest!=null?s.rest:e.rest,
    startKg:s.startKg!=null?s.startKg:e.startKg};}
function dose(k,id){const b=progDose(k,id),o=(k&&doseOv(k,id))||{},
  p=(a,c,d)=>a!=null?a:(c!=null?c:d);
  return {sets:p(o.sets,b.sets,1),reps:p(o.reps,b.reps,10),
    holdSec:p(o.holdSec,b.holdSec,30),rest:p(o.rest,b.rest,30),
    /* startKg no tiene capa de usuario ni default: solo lo lee suggestLoad
       cuando no hay historial, y si nadie lo declara vuelve a sus 10 kg */
    startKg:b.startKg,
    custom:o.sets!=null||o.reps!=null||o.holdSec!=null||o.rest!=null};}
function toggleExtra(k,id){const all=loadExtras(),a=(all[k]||[]).slice(),i=a.indexOf(id);
  if(i<0)a.push(id);else a.splice(i,1);all[k]=a;jset("rp_extras",all);openRoutine(k,true);}
/* El orden de la pantalla y el de la ejecucion tienen que salir del mismo
   sitio, o el ejercicio resaltado como "siguiente" no es el que arranca al
   darle a empezar. Un opcional que ya agregaste deja de ser opcional: entra al
   bloque de entrenamiento, al final, y de ahi en adelante es uno mas. */
function routineBuckets(k){const r=ROUTINES[k];if(!r)return {cal:[],ent:[],se:[]};
  const warm=r.warm||[],sec=r.secondary||[],cal=[],ent=[],se=[],vistos={};
  (r.list||[]).forEach(origin=>{const id=swapOf(k,origin)||origin,e=EX[id];
    if(!e||vistos[id])return;vistos[id]=1;
    const dest=(warm.indexOf(origin)>=0||e.tag==="calent")?cal:(sec.indexOf(origin)>=0?se:ent);
    dest.push({id:id,origin:origin});});
  extrasOn(k).forEach(id=>{if(EX[id]&&!vistos[id]){vistos[id]=1;ent.push({id:id,origin:null,added:true});}});
  return {cal:cal,ent:ent,se:se};}
function effList(k){const b=routineBuckets(k);
  return b.cal.concat(b.ent).concat(b.se).map(x=>x.id);}
function openSwap(k,origin){pushHist({ov:"swap"});const alts=[origin].concat(((ROUTINES[k].swaps||{})[origin])||[]),cur=swapOf(k,origin)||origin;
  $("swapTitle").textContent="Cambiar ejercicio";
  $("swapBody").innerHTML=alts.map(id=>{const e=EX[id];if(!e)return "";
    return `<div class="planopt ${id===cur?'sel':''}" onclick="pickSwap('${k}','${origin}','${id}')">
      <div class="em">${ic("swap")}</div><div style="flex:1;min-width:0"><div>${esc(e.name)}</div>
      <div class="optsub">${id===origin?'Ejercicio principal':'Alternativa'} · ${metaOf(e,dose(k,id))}</div></div>${id===cur?`<div class="optck">${ic("check","sm")}</div>`:''}</div>`;}).join("");
  $("swapov").classList.add("show");}
function pickSwap(k,origin,id){setSwap(k,origin,id===origin?null:id);history.back();setTimeout(()=>openRoutine(k,true),0);}
function closeSwap(){history.back();}

/* La pantalla de rutina se arma en tres piezas para poder rehacer cada una
   por separado: cabecera, lista de ejercicios y barra de accion. */
/* anillo de avance: el mismo motivo geometrico del temporizador */
function ringSVG(pct,size,w){const r=(size-(w||4)-2)/2,C=2*Math.PI*r,off=C*(1-Math.max(0,Math.min(1,pct)));
  return `<svg width="${size}" height="${size}" viewBox="0 0 ${size} ${size}"><circle cx="${size/2}" cy="${size/2}" r="${r.toFixed(1)}" fill="none" stroke="var(--line)" stroke-width="${w||4}"/><circle cx="${size/2}" cy="${size/2}" r="${r.toFixed(1)}" fill="none" stroke="var(--primary)" stroke-width="${w||4}" stroke-linecap="round" stroke-dasharray="${C.toFixed(1)}" stroke-dashoffset="${off.toFixed(1)}" style="transition:stroke-dashoffset .45s ease"/></svg>`;}
function routineProgressHTML(k){const l=effList(k),c=checksFor(k);let n=0;l.forEach(id=>{if(c[id])n++;});
  return ringSVG(l.length?n/l.length:0,46)+`<b>${n}/${l.length}</b>`;}
function routineHead(k,r){
  return `<div class="bar"><div class="icbtn" onclick="history.back()" role="button" tabindex="0" aria-label="Volver">${ic("left")}</div><div class="ttl">${esc(r.name)}</div><div id="routProg" class="rring" aria-live="polite" aria-label="Avance de la rutina">${routineProgressHTML(k)}</div></div>
    <div class="subttl">${esc(r.desc)} · ~${estMinutes(k)} min</div>
    <div class="exwrap">`;}
/* La tarjeta ya no despliega nada: tocarla mete DENTRO del ejercicio, que es
   donde estan los pasos, la figura, el video, la curva y el ajuste de series.
   isAdded distingue al opcional que ya agregaste: se pinta como uno normal,
   con su boton de empezar, y solo se le suma un chip para poder quitarlo. */
function routineExCard(k,ctx,id,origin,isExtra,isWarm,isAdded){const e=EX[id];if(!e)return "";
    const tg=isWarm?["Calentamiento","b-calent"]:(TAG[e.tag]||["Ejercicio","b-calent"]),done=!!ctx.chk[id],n=ctx.i++;
    const alts=origin?(ctx.swaps[origin]||[]):null,swapped=origin&&swapOf(k,origin);
    return `<div class="ex ${done?'checked':''} ${(id===ctx.next)?'next':''} ${isExtra?'off':''}" id="ex_${n}" data-ex="${id}">
      <div class="top">
        <div class="exck" onclick="event.stopPropagation();toggleCheck('${id}',${n})" role="checkbox" tabindex="0" aria-checked="${done?'true':'false'}" aria-label="Marcar como hecho">${ic("check")}</div>
        <div class="diag${(id===ctx.next)?' big':''}" onclick="startRoutine('${id}')">${
          (id===ctx.next)?framesLoop(id,'diaginner'):miniDiag(id)}</div>
        <div style="flex:1;min-width:0" onclick="startRoutine('${id}')"><div class="nm">${esc(e.name)}</div><div class="meta">${metaOf(e,ctx.d=dose(k,id))}${ctx.d.custom?' <span class="chip tiny">ajustado</span>':''}${(typeof ZONA!=="undefined"&&ZONA[id])?' · '+ZONA[id]:''}</div>
          <div class="badges"><span class="badge ${tg[1]}">${tg[0]}</span>${(alts&&alts.length)?`<span class="chip" onclick="event.stopPropagation();openSwap('${k}','${origin}')">${ic("swap","xs")} ${swapped?('Cambiado · original: '+shortName(origin)):(alts.length===1?('Cambiar por '+shortName(alts[0])):('Cambiar ('+alts.length+' opciones)'))}</span>`:''}${isAdded?`<span class="chip" onclick="event.stopPropagation();toggleExtra('${k}','${id}')" role="button" tabindex="0">${ic("close","xs")} Quitar</span>`:''}</div></div>
        ${isExtra?`<div class="exadd" onclick="event.stopPropagation();toggleExtra('${k}','${id}')" role="button" tabindex="0" aria-label="Agregar a la rutina">${ic("plus")}</div>`
                 :`<div class="exstart" onclick="event.stopPropagation();startRoutine('${id}')" role="button" tabindex="0" aria-label="Empezar por este ejercicio" title="Empezar aquí">${ic("play","sm solid")}</div>`}
      </div></div>`;}
function routineList(k,r,ctx){const b=routineBuckets(k),cal=b.cal,ent=b.ent,se=b.se;
  /* abajo solo quedan los opcionales que todavia no has agregado */
  const sueltos=ctx.extras.filter(id=>EX[id]&&ctx.on.indexOf(id)<0);
  /* el siguiente sin hacer es el unico que destaca en toda la pantalla */
  const pend=cal.concat(ent).concat(se).filter(x=>!ctx.chk[x.id])[0];
  ctx.next=pend?pend.id:null;
  const bloque=(titulo,icono,arr,isW,isExtra,nota)=>arr.length?
    `<div class="exgroup"><div class="blockt">${ic(icono,"xs")} ${titulo}</div>`
    +(nota?`<div class="last" style="margin:0 12px 4px">${nota}</div>`:"")
    +arr.map(x=>routineExCard(k,ctx,x.id,x.origin,!!isExtra,!!isW,!!x.added)).join("")+`</div>`:"";
  return bloque("Calentamiento","flame",cal,true)
    +bloque(cal.length?"Entrenamiento":"Ejercicios","dumbbell",ent)
    +bloque("Bloque secundario","refresh",se,false,false,
      "Un músculo de otro día. Sube su frecuencia a dos veces por semana sin alargar la rutina.")
    +bloque("Opcionales · si tienes tiempo","plus",sueltos.map(id=>({id:id,origin:null})),false,true,
      "Toca + y el ejercicio sube al bloque de entrenamiento, como uno más.");}
function openRoutine(k,noPush){curRoutine=k;if(!noPush)pushHist({v:"routine",k:k});
  const r=ROUTINES[k];
  if(sessActive(k)){const sv=loadSess();sessionLog=(sv&&sv.log)||{};sessionLogKey=k;}
  const ctx={chk:checksFor(k),swaps:r.swaps||{},extras:r.extras||[],on:extrasOn(k),LOGS:loadLogs(),i:0};
  $("routine").innerHTML=routineHead(k,r)+routineList(k,r,ctx)+`</div>`+routineCTA(k);
  show("routine");
}
/* barra inferior de la rutina: empezar/continuar + finalizar (siempre visibles) */
function routineCTA(k){const r=ROUTINES[k];if(!r)return "";
  const st=sessStats(k),live=st.exDone>0;
  const hoy=(histIndex()[today()]||[]).filter(x=>x.key===k),ult=hoy.length?hoy[0]:null;
  let note="";
  if(ult){note=`<div class="ctanote">${ic("check","xs")} Registrada hoy${ult.time?" a las "+ult.time:""}`
    +(ult.sets?" · "+ult.sets+" "+plural(ult.sets,"serie","series"):"")+`</div>`;}
  const prim=live?`${ic("play","sm solid")} Continuar · ${Math.min(st.exDone+1,st.exTotal)} de ${st.exTotal}`
                 :`${ic("play","sm solid")} Empezar ${esc(r.name)}`;
  return `<div class="cta cta2" id="routCta">${note}
    <button class="btn" onclick="startRoutine()">${prim}</button>
    <button class="btn sec" onclick="openFinish()">${ic("flag","sm")} Finalizar rutina</button></div>`;}
function updateRoutineCTA(){const el=$("routCta");if(el)el.outerHTML=routineCTA(curRoutine);}

/* checklist diaria + figuras multi-paso + empezar en cualquier ejercicio */
function loadChecks(){return jget("rp_checks",{});}
function checksOn(t,rk){const d=loadChecks()[t]||{};return d[rk]||{};}
function checksFor(rk){return checksOn(today(),rk);}
function isChecked(rk,id){return !!checksFor(rk)[id];}
function markCheck(rk,id,val){const all=loadChecks(),t=today();all[t]=all[t]||{};all[t][rk]=all[t][rk]||{};
  if(val===false)delete all[t][rk][id];else all[t][rk][id]=true;jset("rp_checks",all);
  if(curRoutine===rk)updateRoutineProgress();}
function toggleCheck(id,i){const cur=isChecked(curRoutine,id);
  if(!cur)startSess(curRoutine,"check");
  markCheck(curRoutine,id,!cur);
  const el=$("ex_"+i);if(el){el.classList.toggle("checked",!cur);const ck=el.querySelector(".exck");
    if(ck)ck.setAttribute("aria-checked",!cur?"true":"false");}
  if(!cur&&el){el.classList.add("justdone");setTimeout(()=>el.classList.remove("justdone"),650);}
  updateNextEx();updateRoutineCTA();}
function routineProgressText(k){const l=effList(k),c=checksFor(k);let n=0;l.forEach(id=>{if(c[id])n++;});
  return `${n} de ${l.length} ${plural(n,"hecho","hechos")} hoy`;}
function updateRoutineProgress(){const el=$("routProg");if(el)el.innerHTML=routineProgressHTML(curRoutine);}
/* el resalte del siguiente ejercicio se recalcula sobre el orden que se ve,
   no sobre el orden de los datos: los bloques reordenan la lista */
function updateNextEx(){if(!curRoutine)return;const c=checksFor(curRoutine);
  const filas=[...document.querySelectorAll("#routine .exgroup .ex:not(.off)")];
  filas.forEach(e=>e.classList.remove("next"));
  const nx=filas.filter(e=>!c[e.dataset.ex])[0];
  if(nx)nx.classList.add("next");}
function shortName(id){var e=EX[id];if(!e)return id;var n=e.name.replace(/\s*\(.*?\)\s*/g,"").trim();
  return n.length>22?n.slice(0,21)+"…":n;}
/* ==== [S3] CURVA DE EVOLUCION POR EJERCICIO =============================== */
const METRICS=[{k:"w",n:"Peso máx"},{k:"e1rm",n:"Fuerza est."},{k:"vol",n:"Volumen"},{k:"reps",n:"Reps"}];
function loadPrefs(){return jget("rp_prefs",{});}
function prefGet(k,d){const p=loadPrefs();return (p&&p[k]!=null)?p[k]:d;}
function prefSet(k,v){const p=loadPrefs();p[k]=v;jset("rp_prefs",p);}
function exSeries(id,metric,LOGS){const e=EX[id]||{},u=e.unit||"kg";
  const recs=(((LOGS||loadLogs())[id])||[]).filter(r=>r.sets&&r.sets.length);
  let unit=u;const out=[];
  recs.forEach(r=>{let v=0;
    if(metric==="vol"){r.sets.forEach(s=>{v+=(s.w||0)*(s.reps||0);});unit="kg";}
    else if(metric==="e1rm"){r.sets.forEach(s=>{if((s.w||0)>0&&(s.reps||0)<=12){const x=e1rm(s.w,s.reps);if(x>v)v=x;}});v=Math.round(v*10)/10;unit=u;}
    else if(metric==="reps"){r.sets.forEach(s=>{if((s.reps||0)>v)v=s.reps;});unit="reps";}
    else{const b=bestSet(r.sets);v=b?(b.w||0):0;unit=u;}
    out.push({date:r.date,v:v});});
  return {data:out,unit:unit};}
function exMetric(id,LOGS){const recs=(((LOGS||loadLogs())[id])||[]).filter(r=>r.sets&&r.sets.length);
  const loaded=recs.some(r=>r.sets.some(x=>(x.w||0)>0));
  return loaded?prefGet("chartMetric","w"):"reps";}
function exChart(id,LOGS){const e=EX[id]||{},all=(((LOGS||loadLogs())[id])||[]);
  const recs=all.filter(r=>r.sets&&r.sets.length);
  const head=`<div class="cthead"><div class="ct">Tu progreso</div>`;
  if(!recs.length){
    const hechas=all.length;
    return `<div class="exprog" id="exprog_${id}">${head}</div>
      <div class="exempty">${hechas?("Lo has hecho "+hechas+" "+plural(hechas,"vez","veces")+" sin anotar series. "):""}Registra tus series y aquí verás cómo evolucionas.</div></div>`;}
  const loaded=recs.some(r=>r.sets.some(x=>(x.w||0)>0)),metric=exMetric(id,LOGS);
  const s=exSeries(id,metric,LOGS),vals=s.data.map(d=>d.v);
  const best=Math.max.apply(null,vals),last=vals[vals.length-1],first=vals[0];
  const delta=Math.round((last-first)*10)/10;
  const bs=bestSet(recs[recs.length-1].sets);
  const chips=loaded?`<div class="mchips">`+METRICS.map(m=>`<span class="mchip ${m.k===metric?"on":""}" onclick="setMetric('${id}','${m.k}')" role="button" tabindex="0">${m.n}</span>`).join("")+`</div>`:"";
  return `<div class="exprog" id="exprog_${id}">${head}${(vals.length>1&&delta!==0)?`<span class="delta ${delta>0?"up":"down"}">${delta>0?"↑ +":"↓ "}${fmtW(Math.abs(delta))}</span>`:""}</div>
    <div class="cs">Récord ${fmtW(best)} ${s.unit}${(bs&&loaded)?" · última "+fmtW(bs.w||0)+" "+(e.unit||"kg")+" × "+bs.reps:""} · ${recs.length} ${plural(recs.length,"sesión","sesiones")}</div>
    ${chips}

  const base=(opt.baseline!==false&&n>1&&max!==min)?`<line x1="${padL}" y1="${Y(vals[0]).toFixed(1)}" x2="${w-padR}" y2="${Y(vals[0]).toFixed(1)}" stroke="var(--line2)" stroke-width="1" stroke-dasharray="3 4"/>`:"";
  const iMax=vals.indexOf(max);
  const dots=vals.map((v,i)=>`<circle cx="${X(i).toFixed(1)}" cy="${Y(v).toFixed(1)}" r="${i===n-1?4:2.6}" fill="var(--primary)"/>`).join("");
  const rec=(n>1&&max>min)?`<circle cx="${X(iMax).toFixed(1)}" cy="${Y(max).toFixed(1)}" r="6" fill="none" stroke="var(--primary)" stroke-width="1.5" opacity=".5"/>`:"";
  const lab=(v,y)=>`<text x="${w-padR}" y="${y}" text-anchor="end" font-size="10" font-weight="700" fill="var(--mut)">${fmtW(v)} ${unit}</text>`;
  let dl="";
  if(dated&&n>1)dl=`<text x="${padL}" y="${h-5}" font-size="9.5" font-weight="700" fill="var(--mut)">${dmLabel(data[0].date)}</text>`
    +`<text x="${w-padR}" y="${h-5}" text-anchor="end" font-size="9.5" font-weight="700" fill="var(--mut)">${dmLabel(data[n-1].date)}</text>`;
  return `<svg viewBox="0 0 ${w} ${h}" width="100%" height="${h}" role="img" aria-label="Curva de evolución">${grid}${area}${base}${line}${rec}${dots}
    ${lab(max,padT-4)}${lab(min,h-padB+11)}${dl}</svg>`;}
function volumeByDate(){const logs=loadLogs(),m={};
  Object.keys(logs).forEach(id=>logs[id].forEach(r=>{let v=0;(r.sets||[]).forEach(x=>{v+=(x.w||0)*(x.reps||0);});if(v>0)m[r.date]=(m[r.date]||0)+v;}));
  return Object.keys(m).sort().map(d=>({date:d,v:m[d]}));}

/* ===== copia de seguridad (exportar / importar) ===== */
function exportData(){try{const keys=["rp_streak","rp_history","rp_rem","rp_theme","rp_checks","rp_logs","rp_plan","rp_bw","rp_swaps","rp_extras","rp_doses","rp_session","rp_logged","rp_prefs"];
  const data={_app:"rutina-postura",_v:VERSION,_date:new Date().toISOString(),store:{}};
  keys.forEach(k=>{const v=localStorage.getItem(k);if(v!=null)data.store[k]=v;});
  const blob=new Blob([JSON.stringify(data,null,2)],{type:"application/json"});
  const a=document.createElement("a");a.href=URL.createObjectURL(blob);a.download="rutina-postura-"+today()+".json";
  document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove();},600);}catch(e){alert("No se pudo exportar.");}}
function importData(input){const f=input&&input.files&&input.files[0];if(!f)return;const r=new FileReader();
  r.onload=()=>{try{const d=JSON.parse(r.result);const store=(d&&d.store)?d.store:d;
    if(!store||typeof store!=="object")throw 0;
    const ks=Object.keys(store).filter(k=>k.indexOf("rp_")===0);if(!ks.length)throw 0;
    if(!confirm("Esto reemplazará tus datos actuales con los del archivo. ¿Continuar?")){input.value="";return;}
    ks.forEach(k=>localStorage.setItem(k,store[k]));
    alert("Datos importados correctamente. La app se recargará.");location.reload();
  }catch(e){alert("Ese archivo no es una copia válida.");input.value="";}};
  r.readAsText(f);}

let finRescue=null;
function openFinish(rescueKey){finRescue=rescueKey||null;

function closeFinish(){history.back();}
function renderFinish(){const k=curRoutine,r=ROUTINES[k];if(!r)return;
  const s=loadSess(),fecha=(finRescue&&s)?s.date:today();
  const st=sessStats(k,fecha),log=sessLog(k),ck=checksOn(fecha,k),done=loggedOn(fecha,k);
  $("finTitle").textContent=finRescue?"Entrenamiento sin cerrar":"Resumen de la sesión";
  let h=`<div class="finhead">${ic(routIcon(k),"sm")} ${esc(r.name)}`
    +(finRescue?` · del ${fecha.split("-").reverse().join("/")}`:(st.dur?` · ${st.dur} min`:""))+`</div>`;
  if(!st.exDone){
    h+=`<div class="finempty">Todavía no has registrado nada en esta rutina.<br>Marca un ejercicio con ${ic("check","xs")} o registra una serie.</div>

    <div class="fs"><b>${st.sets}</b><span>${plural(st.sets,"serie","series")}</span></div>

    <button class="btn sec" onclick="closeFinish()">${finRescue?"Ahora no":"Seguir entrenando"}</button>

function confirmFinish(){const k=curRoutine,res=finishSession(k,"sheet");finRescue=null;

function discardSession(){if(!confirm("Se borrará lo registrado en esta sesión sin guardarlo. ¿Seguro?"))return;

/* ---------- BUILD STEPS ---------- */
function buildSteps(k){const out=[],list=effList(k),total=list.length;
  list.forEach((id,idx)=>{const e=EX[id],d=dose(k,id),
    base={id,name:e.name,steps:e.steps,tag:e.tag,caveat:!!e.caveat,exI:idx+1,exN:total,load:e.load,unit:e.unit||"kg"};
    if(e.type==="reps"||e.type==="reps_side"){for(let s=1;s<=d.sets;s++)out.push(Object.assign({},base,{kind:"count",reps:d.reps,perSide:e.type==="reps_side",setNo:s,side:"",
      label:`Serie ${s} de ${d.sets}`+(e.type==="reps_side"?" · cada lado":""),restAfter:s<d.sets?d.rest:0,first:s===1}));}
    else if(e.type==="hold"){for(let s=1;s<=d.sets;s++)out.push(Object.assign({},base,{kind:"timer",seconds:d.holdSec,setNo:s,side:"",
      label:`Mantén ${s} de ${d.sets}`,restAfter:s<d.sets?(d.rest||15):0,first:s===1}));}
    else if(e.type==="hold_side"){for(let s=1;s<=d.sets;s++){
      out.push(Object.assign({},base,{kind:"timer",seconds:d.holdSec,setNo:s,side:"izq",label:`Serie ${s}/${d.sets} · Izquierdo`,restAfter:0,first:s===1}));
      out.push(Object.assign({},base,{kind:"timer",seconds:d.holdSec,setNo:s,side:"der",label:`Serie ${s}/${d.sets} · Derecho`,restAfter:s<d.sets?(d.rest||10):0,first:false}));}}
    /* cardio: un solo paso cronometrado y sin descanso detras. Es la caminadora,
       que sube la temperatura pero no ensaya ningun patron de movimiento. */
    else if(e.type==="cardio"){out.push(Object.assign({},base,{kind:"timer",seconds:d.holdSec,setNo:1,side:"",
      label:"Calentamiento general",restAfter:0,first:true}));}
  });return out;}

function startRoutine(from){prime();pushHist({v:"guided",k:curRoutine});
  const s=startSess(curRoutine,"guided");
  sessionLog=(s&&s.log)?s.log:{};sessionLogKey=curRoutine;
  curW=null;curReps=null;steps=buildSteps(curRoutine);stepi=0;

/* ---- lo unico ajustable a mano: cuantas series haces ----
   El descanso y los sostenes los fija el programa, asi que aqui no hay mas
   control que este. Vive dentro del ejercicio porque es justo ahi, a mitad de
   la cuarta serie, donde te das cuenta de que te sobra o te falta una. */
function seriesBox(s){const e=EX[s.id]||{};if(e.type==="cardio")return "";
  const k=curRoutine,d=dose(k,s.id),base=progDose(k,s.id),ov=(doseOv(k,s.id)||{});
  const ajustada=ov.sets!=null&&ov.sets!==base.sets;
  return `<div class="logrow" style="max-width:250px;margin:var(--s4) auto 0">

      <button class="sq" onclick="gAdjSets(-1)" aria-label="Una serie menos">−</button>
      <b style="cursor:default" aria-live="polite">${d.sets}</b>
      <button class="sq" onclick="gAdjSets(1)" aria-label="Una serie más">+</button></div></div></div>
    ${ajustada?`<button class="minibtn" style="display:block;margin:var(--s2) auto 0" onclick="gResetSets()">Volver a las sugeridas · ${base.sets}</button>`
              :`<div class="last" style="text-align:center">Sugeridas por el programa: ${base.sets} ${plural(base.sets,"serie","series")}</div>`}`;}
function gAdjSets(delta){const s=steps[stepi];if(!s)return;
  const k=curRoutine,d=dose(k,s.id);
  /* suelo doble: ni por debajo de lo ya registrado hoy, ni por debajo de la
     serie que estas haciendo ahora mismo */
  const piso=Math.max(1,todaySets(k,s.id).length,s.setNo||1);
  const v=Math.max(piso,Math.min(10,(d.sets||1)+delta));
  if(v===d.sets)return;
  setDose(k,s.id,{sets:v});reanclar(s);}
function gResetSets(){const s=steps[stepi];if(!s)return;
  setDose(curRoutine,s.id,{sets:null});reanclar(s);}
/* cambiar las series rehace la lista de pasos entera, asi que hay que volver a
   plantarse en la misma serie del mismo ejercicio; si la recortaste por debajo,
   en la ultima que quede. El peso y las reps que ya tenias marcados se
   conservan: no son parte de lo que acabas de cambiar. */
function reanclar(prev){const w=curW,r=curReps;
  steps=buildSteps(curRoutine);
  let i=steps.findIndex(x=>x.id===prev.id&&x.setNo===prev.setNo&&x.side===prev.side);
  if(i<0)for(let j=steps.length-1;j>=0;j--){if(steps[j].id===prev.id){i=j;break;}}
  stepi=(i<0)?Math.min(stepi,steps.length-1):i;
  touchSess(stepi);renderStep();
  const ahora=steps[stepi];
  if(ahora&&ahora.id===prev.id){
    if(w!=null){curW=w;const lw=$("lw");if(lw)lw.innerHTML=fmtW(curW)+' <small>'+(ahora.unit||'kg')+'</small>';}
    if(r!=null){curReps=r;const lr=$("lr");if(lr)lr.textContent=curReps;}}}
function frame(inner,opt){opt=opt||{};const s=steps[stepi],prog=Math.round(stepi/steps.length*100);
  const conFicha=(opt.info!==false);
  return `<div class="gtop"><div class="icbtn" onclick="guidedBack()">${ic("left")}</div>
    <div class="pbar"><i style="width:${prog}%"></i></div>
    <div class="gcount">${s.exI}/${s.exN}</div><div class="icbtn" onclick="guidedExit()" role="button" tabindex="0" aria-label="Salir" title="Salir (se guarda solo)">${ic("close")}</div></div>
    <div class="stage${opt.rest?" isrest":""}">${opt.rest?"":`<div class="setlab">${s.label}</div><div class="exname">${s.name}</div>`}${(conFicha&&typeof ZONA!=="undefined"&&ZONA[s.id])?'<div class="zonatag">'+ZONA[s.id]+'</div>':''}
    ${inner}

function renderStep(){clearTimer();const s=steps[stepi];let inner;if(s.first){curW=null;curReps=null;}
  if(s.kind==="count"){

      /* una sola rama para con carga y sin carga: antes eran dos casi

      const pesoStep=cargado?`<div class="stepper"><div class="lab">Peso</div><div class="row"><button class="sq" onclick="adjW(-2.5)" aria-label="Bajar peso">−</button><b id="lw" onclick="editNum('w')" title="Toca para escribir el peso exacto">${fmtW(curW)}</b><button class="sq" onclick="adjW(2.5)" aria-label="Subir peso">+</button></div></div>`:'';
      const repsStep=`<div class="stepper"${cargado?'':' style="max-width:220px;margin:0 auto"'}><div class="lab">${cargado?'Reps':'Repeticiones'}</div><div class="row"><button class="sq" onclick="adjR(-1)" aria-label="Menos reps">−</button><b id="lr" onclick="editNum('r')" title="Toca para escribir las repeticiones">${curReps}</b><button class="sq" onclick="adjR(1)" aria-label="Más reps">+</button></div></div>`;

    <button class="gbtn go" onclick="afterAction()">${ic("check","sm")} Serie completada</button>`;}
  }
  else{const C=(2*Math.PI*90).toFixed(1);
    inner=`<div class="ring"><svg width="200" height="200" viewBox="0 0 200 200"><g transform="rotate(-90 100 100)">

      <circle id="arc" cx="100" cy="100" r="90" stroke="#34d399" stroke-width="13" fill="none" stroke-linecap="round" stroke-dasharray="${C}" stroke-dashoffset="0"/></g></svg>
      <div class="val"><b id="tv">${fmtDur(s.seconds)}</b><span>${s.seconds>=120?"minutos":"segundos"}</span></div></div>
      <button class="gbtn go" id="startT" onclick="startTimer()">${ic("play","sm solid")} Iniciar (${s.seconds>=120?Math.round(s.seconds/60)+" min":s.seconds+"s"})</button>`;}
  $("guided").innerHTML=frame(inner);}

/* ==== [S4] PANTALLA DESPIERTA Y AVISO DE DESCANSO =========================
   Entrenando, el movil se bloquea entre series: el pitido no suena y el
   contador no se ve. Se resuelve por dos vias, ninguna imprescindible:
   mantener la pantalla despierta mientras dura el guiado, y avisar con una
   notificacion cuando el descanso termina con la app en segundo plano. */
let wakeLock=null;
function keepAwakeOn(){return prefGet("keepAwake",true)!==false;}
function restNotifyOn(){return prefGet("restNotify",false)===true;}
function requestWake(){if(!keepAwakeOn()||wakeLock||document.hidden)return;
  try{if(navigator.wakeLock&&navigator.wakeLock.request)
    navigator.wakeLock.request("screen").then(l=>{wakeLock=l;
      l.addEventListener("release",()=>{wakeLock=null;});}).catch(()=>{wakeLock=null;});}catch(e){wakeLock=null;}}
function releaseWake(){try{if(wakeLock){wakeLock.release();wakeLock=null;}}catch(e){wakeLock=null;}}
function inGuided(){const g=$("guided");return !!(g&&g.classList.contains("active"));}
/* si el navegador soporta disparadores, la notificacion se programa y llega
   aunque la pagina se haya congelado; si no, se lanza al terminar la cuenta */
function scheduleRestNotif(ms){if(!restNotifyOn())return;
  try{navigator.serviceWorker&&navigator.serviceWorker.ready.then(reg=>{
    if(typeof Notification!=="undefined"&&"showTrigger" in Notification.prototype&&typeof TimestampTrigger!=="undefined"){
      reg.showNotification("Descanso terminado 💪",{body:"Vuelve a la serie.",icon:"icon-192-v25.png",
        badge:"icon-192-v25.png",tag:"rp-rest",showTrigger:new TimestampTrigger(Date.now()+ms)});}}).catch(()=>{});}catch(e){}}
function clearRestNotif(){try{navigator.serviceWorker&&navigator.serviceWorker.ready.then(reg=>
    reg.getNotifications({tag:"rp-rest",includeTriggered:true}).then(ns=>ns.forEach(n=>n.close())).catch(()=>{})).catch(()=>{});}catch(e){}}
function restDone(){clearRestNotif();
  if(document.hidden&&restNotifyOn()&&typeof Notification!=="undefined"&&Notification.permission==="granted")
    showNotif("Descanso terminado 💪","Vuelve a la serie.",{tag:"rp-rest",renotify:true,vibrate:[220,90,220]});}
/* ==== fin [S4] ============================================================ */

let gVidOn=false;
function toggleGVid(){const b=$("gvid");if(!b)return;gVidOn=!gVidOn;if(gVidOn){$("gvframe").src=embed(vidInfo(steps[stepi].id));b.classList.add("show");}else{$("gvframe").src="";b.classList.remove("show");}}
/* Un sosten de 30 s se lee mejor en segundos; ocho minutos de caminadora, en
   mm:ss. El segundo argumento es la duracion total, para que el formato no
   cambie a mitad de cuenta cuando baja de 120. */
function fmtDur(sec,total){return (total!=null?total:sec)>=120
  ? Math.floor(sec/60)+":"+String(sec%60).padStart(2,"0") : String(sec);}
function startTimer(){const s=steps[stepi],C=2*Math.PI*90,btn=$("startT");if(btn)btn.style.display="none";
  tEnds=Date.now()+s.seconds*1000;const arc=$("arc");
  const upd=()=>{const r=Math.max(0,Math.ceil((tEnds-Date.now())/1000)),tv=$("tv");
    if(tv)tv.textContent=fmtDur(r,s.seconds);
    if(arc)arc.style.strokeDashoffset=(C*(1-r/s.seconds)).toFixed(1);
    if(r<=0){clearTimer();if(arc)arc.style.strokeDashoffset=C;beep();afterAction();}};
  upd();if(tId)return;tickFn=upd;tId=setInterval(upd,250);}
function afterAction(){const s=steps[stepi];if(s.restAfter>0)renderRest(s.restAfter);else advance();}
/* El descanso es la pantalla que mas segundos acumula en una sesion y era la
   unica sin el anillo, que DISENO.md declara el motivo geometrico de la app.
   Y como reutilizaba frame(), mostraba el nombre del paso que acababas de
   terminar, no el que viene: saber que toca es lo que te deja ir preparando la
   maquina o el disco mientras esperas. */
function nextStepLabel(){const n=steps[stepi+1];if(!n)return "Ultima serie";
  const mismo=n.id===steps[stepi].id;
  return (mismo?"Sigue: ":"Después: ")+n.label.replace(" · cada lado","")+
    (mismo?"":" · "+n.name);}
function renderRest(sec){clearTimer();restR=sec;restEnds=Date.now()+sec*1000;
  clearRestNotif();scheduleRestNotif(sec*1000);
  const C=(2*Math.PI*90).toFixed(1);
  $("guided").innerHTML=frame(`<div class="phaselab">Descanso</div>
    <div class="ring rest"><svg width="200" height="200" viewBox="0 0 200 200"><g transform="rotate(-90 100 100)">
      <circle cx="100" cy="100" r="90" stroke="var(--ring-track)" stroke-width="13" fill="none"/>
      <circle id="rarc" cx="100" cy="100" r="90" stroke="var(--energy-strong)" stroke-width="13" fill="none" stroke-linecap="round" stroke-dasharray="${C}" stroke-dashoffset="0"/></g></svg>
      <div class="val"><b id="rv" aria-live="polite">${fmtDur(restR,sec)}</b><span>${sec>=120?"minutos":"segundos"}</span></div></div>
    <div class="nextup">${esc(nextStepLabel())}</div>
    <button class="gbtn rest" onclick="skipRest()">Saltar descanso ${ic("next","sm")}</button>`,{info:false,rest:true});
  const arc=$("rarc"),CC=2*Math.PI*90;
  const upd=()=>{restR=Math.max(0,Math.ceil((restEnds-Date.now())/1000));const el=$("rv");
    if(el)el.textContent=fmtDur(restR,sec);
    /* se vacia, no se llena: lo que queda es lo que importa */
    if(arc)arc.style.strokeDashoffset=(CC*(1-restR/Math.max(1,sec))).toFixed(1);
    const rg=document.querySelector(".ring.rest");
    if(rg)rg.classList.toggle("last",restR<=5&&restR>0);
    if(restR<=0){clearTimer();beep();restDone();advance();}};
  tickFn=upd;tId=setInterval(upd,250);}
function skipRest(){clearTimer();clearRestNotif();advance();}
function advance(){clearTimer();const prev=steps[stepi];stepi++;
  /* gVidOn es global: sin resetearlo, si dejabas un video abierto y avanzabas,
     el primer toque de "Ver video" del ejercicio siguiente no abria nada */
  if(prev&&(stepi>=steps.length||steps[stepi].id!==prev.id)){gInfoOpen=null;gVidOn=false;}
  if(prev&&(stepi>=steps.length||steps[stepi].id!==prev.id))markCheck(curRoutine,prev.id,true);
  touchSess(Math.min(stepi,steps.length-1));
  if(stepi>=steps.length)finish();else renderStep();}
/* ilustracion de la pantalla de fin: fuera de la rejilla de 24, se dibuja
   sola al entrar */
function doneHero(){const r=44,C=(2*Math.PI*r).toFixed(1);

    <path d="M34 53l12 12 24-26" fill="none" stroke="var(--primary)" stroke-width="7"

function finish(){clearTimer();const res=finishSession(curRoutine,"guided");
  const s=(res&&res.streak)||loadStreak(),sum=res&&res.summary,nom=ROUTINES[curRoutine].name;

  $("guided").innerHTML=`<div class="done">${doneHero()}

      <div><b>${sum.exDone}</b><span>${plural(sum.exDone,"ejercicio","ejercicios")}</span></div>
      <div><b>${sum.sets}</b><span>${plural(sum.sets,"serie","series")}</span></div>
      ${sum.vol>0?`<div><b>${fmtW(sum.vol)}</b><span>kg movidos</span></div>`:""}</div>`:""}
    ${prHTML}
    <div class="donest">${ic("flame","lg")}<span class="n">${s.count}</span>${plural(s.count,"día seguido","días seguidos")}</div>
    <p class="donesub">Mejor racha ${s.best} · ${s.total} ${plural(s.total,"sesión","sesiones")} en total</p>
    <button class="gbtn go" style="margin-top:22px" onclick="exitToHome()">Volver al inicio</button></div>`;beep();}

/* ---------- CALENDARIO ---------- */
const MONTHS=["enero","febrero","marzo","abril","mayo","junio","julio","agosto","septiembre","octubre","noviembre","diciembre"];
let calY=null,calM=null,calSel=null;
function histIndex(){const h=loadHist(),idx={};h.forEach(x=>{let k=null;
  if(x.date&&x.date.indexOf("/")>0){const p=x.date.split("/");k=p[2]+"-"+p[1].padStart(2,"0")+"-"+p[0].padStart(2,"0");}
  else if(x.iso){k=ds(new Date(x.iso));}
  if(k){(idx[k]=idx[k]||[]).push(x);}});return idx;}
function routColor(key){const r=ROUTINES[key];if(!r)return "g";return r.cls==="n"?"n":r.cls==="p"?"p":"g";}
function calShift(d){calM+=d;if(calM<0){calM=11;calY--;}if(calM>11){calM=0;calY++;}renderHistory();}
function calPick(k){calSel=k;renderHistory();}
function renderHistory(){const s=loadStreak(),idx=histIndex(),now=new Date();
  if(calY==null){calY=now.getFullYear();calM=now.getMonth();}
  if(calSel==null)calSel=today();
  const mesIdx=Object.keys(idx).filter(d=>d.slice(0,7)===calY+"-"+String(calM+1).padStart(2,"0"));
  let ses=0,gym=0;mesIdx.forEach(d=>{idx[d].forEach(x=>{ses++;if(routColor(x.key)==="g")gym++;});});
  let b=`<div class="calsum">${MONTHS[calM]}: <b>${ses}</b> ${plural(ses,"sesión","sesiones")}${gym?` · <b>${gym}</b> de fuerza`:""}</div>`;
  b+=`<div class="cal"><div class="calhead"><div class="calnav" onclick="calShift(-1)" role="button" tabindex="0" aria-label="Mes anterior">${ic("left","sm")}</div>
    <div class="m">${MONTHS[calM]} ${calY}</div>
    <div class="calnav" onclick="calShift(1)" role="button" tabindex="0" aria-label="Mes siguiente">${ic("right","sm")}</div></div><div class="calgrid">`;
  ["L","M","X","J","V","S","D"].forEach(w=>b+=`<div class="wd">${w}</div>`);
  const first=new Date(calY,calM,1),lead=(first.getDay()+6)%7,dim=new Date(calY,calM+1,0).getDate();
  for(let i=0;i<lead;i++)b+=`<div class="calcell empty"></div>`;
  for(let d=1;d<=dim;d++){const key=calY+"-"+String(calM+1).padStart(2,"0")+"-"+String(d).padStart(2,"0");
    const sess=idx[key]||[],cls=["calcell"];if(sess.length)cls.push("has");if(key===today())cls.push("istoday");if(key===calSel)cls.push("sel");
    const cols=[];sess.forEach(x=>{const c=routColor(x.key);if(cols.indexOf(c)<0)cols.push(c);});
    const dots=cols.slice(0,3).map(c=>`<span class="cdot ${c}"></span>`).join("");
    b+=`<div class="${cls.join(" ")}" onclick="calPick('${key}')"><span class="dnum">${d}</span><span class="dots">${dots}</span></div>`;}
  b+=`</div></div>`;
  b+=`<div class="callegend"><span><i class="cdot p"></i>Postura</span><span><i class="cdot n"></i>Cuello</span><span><i class="cdot g"></i>Fuerza</span></div>`;
  const sel=idx[calSel]||[],p=calSel.split("-"),futuro=calSel>today();
  b+=`<div class="caldayhead"><div class="grouptitle">${p[2]}/${p[1]}/${p[0]}</div>
    ${futuro?"":`<button type="button" class="calladd" onclick="openCalLog()">${ic("plus")} Registrar rutina</button>`}</div>`;
  if(!sel.length)b+=`<div class="empty" style="padding:16px 10px">Sin actividad este día.<br>${futuro?"Todavía no ha llegado.":"Si hiciste una rutina y no quedó anotada, añádela con «Registrar rutina»."}</div>`;
  else b+=sel.map((x,i)=>{const rows=dayRows(calSel,x.key,x.iso?Date.parse(x.iso):0),tot=dayTotals(x,rows);
    const meta=[x.day||"",x.manual?"":(x.time||"")].filter(Boolean).join(" · ");
    return `<div class="dayblock"><div class="hitem" onclick="toggleDay(${i})" role="button" tabindex="0" aria-label="Ver detalle">
      <div class="dot ${routColor(x.key)}">${ic(routIcon(x.key),"sm")}</div>
      <div style="flex:1"><div class="nm">${esc(x.name)}</div><div class="dt">${meta}</div>
      ${tot?`<div class="dt2">${tot}</div>`:""}</div>
      <div class="go">${rows.length?ic("right","sm"):""}</div></div>
      <div class="daydet" id="dd_${i}">${rows.length?rows.map(r=>`<div class="ddrow"><span class="dn">${esc(shortName(r.id))}</span><span class="dv">${r.txt}</span></div>`).join(""):`<div class="ddrow"><span class="dn">Sin series anotadas ese día.</span></div>`}</div>
      ${x.manual?`<div class="mrow"><span class="mtag">Añadida a mano</span><button type="button" class="mdel" onclick="calLogDel(${x.mid||0})">Quitar</button></div>`:""}</div>`;}).join("");
  $("histBody").innerHTML=b;}

/* ---- registrar a mano una rutina que no se anoto ese dia ---- */
/* el historial se guarda de mas nuevo a mas viejo y se recorta a 200: por eso
   una sesion retroactiva se inserta en su sitio y no al principio */
function histStamp(x){if(x&&x.iso){const t=Date.parse(x.iso);if(!isNaN(t))return t;}
  if(x&&x.date&&x.date.indexOf("/")>0){const p=x.date.split("/");
    const t=Date.parse(p[2]+"-"+p[1].padStart(2,"0")+"-"+p[0].padStart(2,"0")+"T12:00:00");
    if(!isNaN(t))return t;}
  return 0;}
function openCalLog(){if(!calSel||calSel>today())return;
  pushHist({ov:"plan"});
  const p=calSel.split("-");
  $("planTitle").textContent=(calSel===today()?"Registrar hoy":"Registrar el "+p[2]+"/"+p[1]);
  let h="";
  GROUPS.forEach(g=>g.keys.forEach(k=>{const r=ROUTINES[k];
    h+=`<div class="planopt" onclick="calLogPick('${k}')"><div class="em ${r.cls}">${ic(routIcon(k))}</div>${esc(r.name)}</div>`;}));
  $("planBody").innerHTML=h;$("planov").classList.add("show");}
function calLogPick(key){const r=ROUTINES[key];if(!r||!calSel){closePlan();return;}
  const p=calSel.split("-"),d=new Date(+p[0],+p[1]-1,+p[2],12,0,0),
    e={key:key,name:r.name,iso:d.toISOString(),day:DAYS[d.getDay()],
       date:p[2]+"/"+p[1]+"/"+p[0],time:"",manual:true,mid:Date.now()},
    h=loadHist(),st=histStamp(e);
  let i=0;while(i<h.length&&histStamp(h[i])>=st)i++;
  h.splice(i,0,e);jset("rp_history",h.slice(0,200));
  recalcStreak();closePlan();renderHistory();}
function calLogDel(mid){if(!mid)return;
  if(!confirm("¿Quitar esta rutina del calendario?"))return;
  const h=loadHist().filter(x=>!(x.manual&&x.mid===mid));
  jset("rp_history",h);recalcStreak();renderHistory();}
/* al anadir o quitar dias sueltos la racha deja de coincidir con lo guardado:
   se recuenta desde el historial, que es la fuente real de que dias hubo */
function recalcStreak(){const s=loadStreak(),idx=histIndex(),keys=Object.keys(idx).sort();
  let d=new Date(),n=0;
  if(!idx[ds(d)])d.setDate(d.getDate()-1);
  while(idx[ds(d)]&&n<1000){n++;d.setDate(d.getDate()-1);}
  let run=0,best=0,prev=null;
  keys.forEach(k=>{const cur=Date.parse(k+"T00:00:00");
    run=(prev&&(cur-prev)===86400000)?run+1:1;prev=cur;if(run>best)best=run;});
  let tot=0;keys.forEach(k=>{tot+=idx[k].length;});
  s.count=n;s.last=keys.length?keys[keys.length-1]:null;
  s.best=Math.max(s.best||0,best,n);s.total=Math.max(s.total||0,tot);
  jset("rp_streak",s);return s;}
/* que se hizo un dia concreto: se cruza rp_logs por fecha y rutina, y si la
   sesion trae marca de tiempo se filtra por ella para no mezclar dos sesiones
   de la misma rutina el mismo dia */
function dayRows(dateKey,routineKey,stamp){const logs=loadLogs(),order=effList(routineKey);
  const pick=(useStamp)=>{const out=[];
    Object.keys(logs).forEach(id=>{(logs[id]||[]).forEach(r=>{
      if(r.date!==dateKey)return;
      if(useStamp){if(r.t!==stamp)return;}
      else{if(r.k){if(r.k!==routineKey)return;}else if(order.indexOf(id)<0)return;}
      const sets=r.sets||[];
      out.push({id:id,sets:sets,pos:order.indexOf(id),
        txt:sets.length?sets.map(s=>((s.w||0)>0?fmtW(s.w)+"×":"")+s.reps).join("  ·  "):`${ic("check","xs")} hecho`});});});
    return out;};
  let rows=stamp?pick(true):[];
  if(!rows.length)rows=pick(false);
  rows.sort((a,b)=>(a.pos<0?99:a.pos)-(b.pos<0?99:b.pos));
  return rows;}
function dayTotals(x,rows){if(x.sets!=null){const ne=x.exDone||rows.length;
    return `${ne} ${plural(ne,"ejercicio","ejercicios")} · ${x.sets} ${plural(x.sets,"serie","series")}`
      +((x.vol>0)?" · "+fmtW(x.vol)+" kg":"")+((x.dur>0)?" · "+x.dur+" min":"");}
  if(!rows.length)return "";
  let ns=0,vol=0;rows.forEach(r=>{ns+=r.sets.length;r.sets.forEach(s=>{vol+=(s.w||0)*(s.reps||0);});});
  return `${rows.length} ${plural(rows.length,"ejercicio","ejercicios")}`+(ns?` · ${ns} ${plural(ns,"serie","series")}`:"")+((vol>0)?" · "+fmtW(Math.round(vol))+" kg":"");}
function toggleDay(i){const el=$("dd_"+i);if(el)el.classList.toggle("open");}

/* ==== [S7] PROGRESION, SOBRECARGA Y ESTANCAMIENTO ========================= */
/* Rango de repeticiones por tipo de ejercicio. La progresion doble sube reps
   dentro del rango y, cuando lo llenas entero, sube la carga y vuelve al
   minimo. Progresar por reps da la misma hipertrofia que por carga
   (Plotkin 2022), asi que el guardarrail de abajo no cuesta resultados. */
function repRange(id){const e=EX[id]||{},r=e.reps||10;
  if(r<=8)return [6,10];
  if(r<=12)return [8,12];
  return [12,20];}
/* Tope del 10% sobre el peso de trabajo, que es el limite alto del rango que
   maneja la NSCA (2,5-10%). Un 5% seria mas conservador pero bloquearia casi
   todo: el escalon minimo real de una mancuerna es 2,5 kg, que sobre 47,5 kg
   ya es un 5,3%. Por encima del tope no se sube carga, se estira el rango de
   repeticiones, que da la misma hipertrofia (Plotkin 2022). */
function loadStep(w){const s=w<10?1:(w<20?2:2.5);
  return (w>0&&s/w>0.10)?0:s;}
/* Objetivo de hoy: una meta de proceso resoluble hoy, no un resultado lejano. */
function todayTarget(k,id){const e=EX[id]||{};if(e.load!==true&&e.load!==false)return null;
  const rng=repRange(id),d=dose(k,id),ll=lastLog(id);
  if(!ll||!ll.sets.length)return {w:e.load===true?0:0,reps:rng[0],why:"Primera vez: busca "+rng[0]+" repeticiones limpias",nuevo:true};
  const trabajo=ll.sets,tope=trabajo.every(x=>(x.reps||0)>=rng[1]),
        completo=trabajo.length>=(d.sets||trabajo.length),first=trabajo[0];
  if(e.load===true&&tope&&completo){const inc=loadStep(first.w||0);
    if(inc>0){const w=Math.round((first.w+inc)*10)/10;
      return {w:w,reps:rng[0],subeCarga:true,
        why:"Llenaste el rango entero: sube a "+fmtW(w)+" kg y vuelve a "+rng[0]};}
    return {w:first.w,reps:rng[1]+2,extiende:true,
      why:"El salto de peso seria mas del 5%: estira el rango a "+(rng[1]+2)+" reps"};}
  const objetivo=Math.min(rng[1],Math.max(rng[0],(first.reps||rng[0])+1));
  return {w:first.w||0,reps:objetivo,
    why:"La vez pasada "+(first.reps||0)+": hoy "+objetivo+" con el mismo peso"};}
/* Mejor serie de una sesion, en e1RM. Guardarrail: si las reps caen por debajo
   del minimo del rango no cuenta como progreso, aunque el e1RM salga mayor.
   Sin eso, la mecanica premiaria subir peso a costa del rango. */
function bestE1(id,rec){const rng=repRange(id);let b=0;
  (rec.sets||[]).forEach(s=>{if((s.reps||0)<rng[0])return;
    b=Math.max(b,e1rm(s.w||0,s.reps||0));});return b;}
function overloadIndex(days){const logs=loadLogs(),warm=warmIds(),from=dOffset(days||7);
  let prog=0,tot=0;const detalle=[];

    const recs=logs[id].filter(r=>r.sets&&r.sets.length);
    if(recs.length<2)return;
    const ult=recs[recs.length-1];if(ult.date<from)return;
    const hoy=bestE1(id,ult),antes=bestE1(id,recs[recs.length-2]);
    if(!hoy&&!antes)return;
    tot++;const ok=hoy>antes*1.005;if(ok)prog++;
    detalle.push({id:id,ok:ok,hoy:hoy,antes:antes});});
  return {prog:prog,total:tot,pct:tot?Math.round(prog/tot*100):0,detalle:detalle};}

function strengthIdx(cut){const logs=loadLogs(),warm=warmIds(),vals=[];
  Object.keys(logs).forEach(id=>{const e=EX[id];if(!e||e.load!==true||warm[id])return;
    const recs=logs[id].filter(r=>!cut||r.date<=cut);if(recs.length<3)return;

    if(pts.length<3)return;

    const last=pts[pts.length-1];
    const lim=cut||today();const d21=new Date(lim);d21.setDate(d21.getDate()-21);
    if(last.date<ds(d21))return;
