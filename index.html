<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" id="tc" content="#eef1f5">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon-v25.png">
<link rel="icon" href="favicon.ico" sizes="16x16 32x32 48x48">
<link rel="icon" type="image/png" href="icon-192-v25.png" sizes="192x192">
<title>Mi Rutina</title>
<script>/* resuelve el tema antes de pintar: asi el CSS solo necesita UN bloque oscuro */
try{var _t=JSON.parse(localStorage.getItem("rp_theme"))||"auto";
  var _d=(_t==="dark")||(_t!=="light"&&matchMedia("(prefers-color-scheme:dark)").matches);
  document.documentElement.setAttribute("data-theme",_d?"dark":"light");
  /* la barra de estado tambien se resuelve aqui: antes nacia clara y el JS la
     corregia despues, asi que en oscuro habia un destello blanco al arrancar */
  var _m=document.getElementById("tc")||document.querySelector('meta[name="theme-color"]');
  if(_m)_m.setAttribute("content",_d?"#0a1020":"#eef1f5");}catch(e){}</script>
<style>
  /* =========================================================================
     Mi Rutina · sistema visual v23
     Una sola capa. Antes eran tres superpuestas (base oscura + rediseño v4 +
     refresh v16), con la paleta oscura escrita tres veces y 69 colores
     sueltos. Aquí: tokens arriba, componentes después, pantallas al final.
     El tema oscuro vive en UN solo bloque porque el JS resuelve "auto" y
     siempre escribe data-theme en <html>.
     ========================================================================= */

  :root{
    /* --- superficies: gris frio, para que el tema claro y el oscuro sean la
           misma app. Antes el claro era verde-gris y el oscuro azul marino. --- */
    --bg:#eef1f5; --bg2:#e7ebf1; --card:#ffffff; --card2:#f7f9fc; --sunk:#f1f4f8;
    --line:#e2e7ee; --line2:#c8d1dd;
    /* borde de un control, que es la unica senal de que ahi hay algo pulsable.
       Va aparte de --line2 porque necesita 3:1 y un separador no. */
    --ctl-line:#7d8b9e;
    --hairline:#e8ecf2;
    /* --- texto --- */
    --tx:#111827; --tx2:#4a5568; --mut:#5c6a7d;
    /* --- cuatro familias, no seis: cobalto = accion, progreso e informacion;
           ambar = energia, logro y espera; morado = carga; rojo = destructivo.
           Antes descanso y energia eran el mismo naranja (1,13:1 de diferencia)
           y el azul de informacion no se distinguia del primario en su papel. --- */
    --primary:#2563eb; --primary2:#1e40af; --primary-tint:#dbeafe; --on-primary:#ffffff;
    /* cobalto de relleno (texto blanco encima: 5,2:1) vs cobalto de texto sobre
       fondo claro (8,7:1). Con un solo tono uno de los dos siempre falla. */
    --primary-ink:#1e40af; --hero-accent:#7dd3fc;
    /* informacion entra en la familia del primario: mismo color, otro papel */
    --accent:#2563eb; --accent-tint:#dbeafe; --accent-ink:#1e40af;
    /* descanso entra en energia */
    --rest:#e07b1a; --rest-tint:#fdf0e0; --rest-ink:#8a4b06;
    /* ambar de energia: racha, record, descanso y "toca subir peso". Nunca es
       accion primaria; si aparece en mas sitios deja de significar algo.
       -strong es el relleno para botones, porque el ambar claro no aguanta
       texto blanco: daba 3,4:1 y ahora da 5,2:1. */
    --energy:#e07b1a; --energy-ink:#8a4b06; --energy-tint:#fdf0e0; --energy-hero:#ffb454;
    --energy-strong:#a35a0c; --energy-on:#ffffff;
    --load:#6d5bc9; --load2:#5a49b0; --load-tint:#ece9fb; --load-ink:#3a2f6b;
    --danger:#c4443f; --danger-tint:#fbe9e8; --danger-ink:#a3322e;
    /* --- figuras y anillos (los SVG traen estos hex y se recolorean abajo) --- */
    --diagram-ink:#2b3648; --diagram-line:#cbd3de; --diagram-hi:#2563eb; --diagram-eye:#111827;
    /* el miembro lejano: en vista lateral los dos brazos en la misma tinta se
       funden en un bulto. Da 3,35:1 contra el fondo del diagrama y 3,30:1
       contra la tinta cercana, asi que se lee como cuerpo y no como sombra. */
    --diagram-ink-far:#78869c; --diagram-shadow:#d3dae4;
    --diagram-bg:#f1f4f8; --ring-track:#e2e7ee;
    --nav-bg:rgba(255,255,255,.94); --page-grad:#ffffff;
    /* la superficie invertida. Degradado para que tenga materia y no parezca un
       agujero, y azul profundo para que el boton primario se separe de ella. */
    --hero:linear-gradient(155deg,#141f36,#0b111d); --hero-tx:#ffffff; --hero-mut:#a8bdd6;

    /* --- tipografía: 8 pasos, ni uno más --- */
    --t-mega:50px; --t-display:30px; --t-xl:26px; --t-title:22px; --t-lg:20px; --t-md:16px;
    --t-lead:15px; --t-base:14px; --t-sm:12.5px; --t-xs:11px; --t-2xs:10px;
    /* --- pesos: el texto normal deja de ir en negrita --- */
    --w-body:400; --w-med:600; --w-semi:700; --w-bold:800;
    /* --- espaciado --- */
    --s1:4px; --s2:8px; --s3:12px; --s4:16px; --s5:22px; --s6:30px;
    --gut:16px;                      /* margen lateral único de la app */
    /* --- radios --- */
    --r-sm:12px; --r-md:16px; --r-lg:20px; --r-xl:24px; --r-pill:999px;
    /* --- sombras --- */
    --sh-card:0 1px 2px rgba(17,24,39,.05), 0 10px 24px -16px rgba(17,24,39,.26);
    /* el halo del boton primario tenia otro verde que el propio boton
       (#0f9d76 contra #0c8163). Ahora los dos salen del primario. */
    --sh-raised:0 8px 20px -6px rgba(37,99,235,.42);
    --sh-focus:0 0 0 3px rgba(37,99,235,.30);
  }
  :root[data-theme="dark"]{
    --bg:#0a1020; --bg2:#0e1626; --card:#141d2e; --card2:#1b263a; --sunk:#101827;
    --line:#243349; --line2:#38485f;
    --ctl-line:#64748b; --hairline:transparent;
    --tx:#f1f5fb; --tx2:#c4d1de; --mut:#92a4b8;
    --primary:#60a5fa; --primary2:#3b82f6; --primary-tint:#132a4a; --on-primary:#0b1a33;
    --primary-ink:#93c5fd; --hero-accent:#7dd3fc;
    --accent:#60a5fa; --accent-tint:#132a4a; --accent-ink:#93c5fd;
    --rest:#fbbf24; --rest-tint:#3a2a10; --rest-ink:#fbbf24;
    --energy:#fbbf24; --energy-ink:#fbbf24; --energy-tint:#3a2a10; --energy-hero:#fcd34d;
    /* aqui el ambar es claro, asi que el boton lleva texto oscuro encima */
    --energy-strong:#fbbf24; --energy-on:#3a2a10;
    --load:#a78bfa; --load2:#8b6df0; --load-tint:#241a44; --load-ink:#c3b3fb;
    --danger:#fca5a5; --danger-tint:#2a1414; --danger-ink:#fca5a5;
    --diagram-ink:#cfe0f5; --diagram-line:#3a4b60; --diagram-hi:#60a5fa; --diagram-eye:#0a1020;
    --diagram-ink-far:#6c8099; --diagram-shadow:#1a2436;
    --diagram-bg:#101827; --ring-track:#243349;
    --nav-bg:rgba(10,16,32,.94); --page-grad:#132038;
    /* el fallo mas grande de la auditoria: el hero tenia 1,02:1 contra una
       tarjeta normal, asi que "una sola cosa manda" solo existia en tema claro */
    --hero:linear-gradient(155deg,#1e3a8a,#152a52); --hero-tx:#f2f6fb; --hero-mut:#a8bdd6;
    --sh-card:0 1px 2px rgba(0,0,0,.35), 0 10px 24px -16px rgba(0,0,0,.6);
    --sh-raised:0 8px 20px -6px rgba(96,165,250,.30);
    --sh-focus:0 0 0 3px rgba(96,165,250,.34);
  }

  /* ============================ base ============================ */
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;padding:0;color:var(--tx);
    background:radial-gradient(1100px 460px at 50% -12%, var(--page-grad) 0%, var(--bg) 60%) fixed;
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,system-ui,sans-serif;
    font-size:var(--t-base);font-weight:var(--w-body);line-height:1.45;letter-spacing:-.01em;
    -webkit-font-smoothing:antialiased;-webkit-text-size-adjust:100%;text-size-adjust:100%}
  body{max-width:600px;margin:0 auto;min-height:100vh;min-height:100dvh;overflow-x:hidden}
  .app{padding:0 0 calc(92px + env(safe-area-inset-bottom))}
  .view{display:none;animation:fade .22s ease} .view.active{display:block}
  @keyframes fade{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
  @media (prefers-reduced-motion:reduce){
    .view{animation:none}
    /* sin animation-duration, las celebraciones se colarian igual */
    *{transition-duration:.01ms !important;animation-duration:.01ms !important;
      animation-iteration-count:1 !important}
    /* la regla de arriba congelaria el fundido de la figura a media opacidad,
       con los dos fotogramas encima. Aqui se fija en el primero. */
    .anim .fa{animation:none !important;opacity:1}
    .anim .fb{animation:none !important;opacity:0}}
  h1{font-size:var(--t-xl);margin:0;font-weight:var(--w-bold);letter-spacing:-.8px}
  .mut{color:var(--mut)}
  /* cifras siempre con ancho fijo: no bailan al contar */
  .stat .v,.timer,#tv,.ring .val b,.gcount,.done .big,.target,.heroP .hbig,
  .stepper .row b,.finsum .fs b,.mrow .mv,.ddrow .dv{font-variant-numeric:tabular-nums}

  /* ===================== superficies compartidas =====================
     Una sola definición de "tarjeta", "caja hundida" y "nota de color". */
  /* el filo de 1 px es lo que de verdad hace visible la tarjeta en exterior:
     el fondo contra la tarjeta solo da 1,13:1 y con sol la sombra se lava */
  .rcard,.stat,.hitem,.field,.cal,.chartcard,.ex,.day,.stepper,.daydet,.ovcard{
    background:var(--card);box-shadow:var(--sh-card);border:1px solid var(--hairline);
    border-radius:var(--r-lg)}
  :root[data-theme="dark"] .rcard,:root[data-theme="dark"] .stat,:root[data-theme="dark"] .hitem,
  :root[data-theme="dark"] .field,:root[data-theme="dark"] .cal,:root[data-theme="dark"] .chartcard,
  :root[data-theme="dark"] .ex,:root[data-theme="dark"] .day,:root[data-theme="dark"] .stepper,
  :root[data-theme="dark"] .daydet,:root[data-theme="dark"] .ovcard{border:1px solid var(--line)}

  .exprog,.finempty,.finsum .fs,.frame,.setline,.planopt,.timepill{
    background:var(--sunk);border:1px solid var(--line);border-radius:var(--r-sm)}

  /* notas de color: mismo formato, distinto significado */
  .last,.qwhy,.optbox,.caveatbox,.callout{
    border-radius:var(--r-sm);padding:10px 12px;font-size:var(--t-sm);
    font-weight:var(--w-med);line-height:1.45;border:1px solid transparent}
  .qwhy{background:var(--primary-tint);color:var(--primary-ink)}
  .last{background:var(--sunk);color:var(--tx2);border-color:var(--line)}
  .optbox{background:var(--load-tint);color:var(--load-ink)}
  .optbox.warm,.caveatbox,.callout{background:var(--rest-tint);color:var(--rest-ink)}

  /* etiquetas de sección: una sola voz */
  .grouptitle,.blockt,.wkhead .t,.stepper .lab,.finsum .fs span,.heroP .hkick,.today .kick{
    font-size:var(--t-2xs);font-weight:var(--w-bold);letter-spacing:1.3px;
    text-transform:uppercase;color:var(--mut)}
  .grouptitle{margin:var(--s5) var(--gut) var(--s2)}
  .blockt{margin:var(--s5) 2px var(--s2)}

  /* ========================== botones ==========================
     Base común para las once clases de botón que habían crecido sueltas. */
  button{font-family:inherit}
  .btn,.gbtn,.today-go,.minibtn,.vbtn,.setok,.install button,.addrow button,.nav .tab{
    font-family:inherit;border:none;cursor:pointer;font-weight:var(--w-bold);
    letter-spacing:-.01em;background:none;color:var(--tx)}
  .btn,.gbtn,.today-go{width:100%;display:block;border-radius:var(--r-md);
    background:var(--primary);color:var(--on-primary);box-shadow:var(--sh-raised)}
  .btn{height:54px;padding:0;font-size:var(--t-md)}
  .gbtn{height:52px;padding:0;font-size:var(--t-md);margin-top:var(--s3)}
  .today-go{height:50px;padding:0;font-size:var(--t-md);margin-top:var(--s4)}
  .btn:active,.gbtn:active,.today-go:active{transform:translateY(1px)}
  .btn[disabled]{opacity:.45;box-shadow:none;cursor:default;transform:none}
  /* variantes apagadas */
  .btn.sec,.gbtn.sec,.gbtn.fin{background:var(--card);color:var(--tx);
    border:1px solid var(--line);box-shadow:none}
  .gbtn.fin{color:var(--tx2);font-size:var(--t-base);height:46px}
  .today-go.sec{background:rgba(255,255,255,.12);color:var(--hero-tx);box-shadow:none}
  /* el blanco estaba escrito a mano sobre un naranja: daba 3,4:1 en claro y
     2,2:1 en oscuro, y es el boton que sale en cada descanso de cada serie.
     Ningun relleno calido aguanta texto blanco, asi que el relleno usa el tono
     oscuro de la familia y el texto sale del token. */
  .gbtn.rest{background:var(--energy-strong);color:var(--energy-on);box-shadow:none}
  .minibtn,.vbtn{background:var(--card2);border:1px solid var(--line);color:var(--tx);
    border-radius:var(--r-sm);font-size:var(--t-sm);font-weight:var(--w-semi);padding:10px 14px}
  .minibtn{margin-top:var(--s2)}
  .vbtn{display:inline-flex;align-items:center;gap:var(--s2);margin-top:var(--s3)}
  .minibtn.danger,.danger{color:var(--danger-ink);border:1px solid var(--danger);background:var(--danger-tint)}
  .skip{display:block;width:100%;text-align:center;background:none;border:none;color:var(--mut);
    font-size:var(--t-sm);font-weight:var(--w-med);margin-top:var(--s4);cursor:pointer;padding:var(--s2)}
  /* botones de icono cuadrados */
  .icbtn{width:44px;height:44px;border-radius:var(--r-sm);background:var(--card);
    border:1px solid var(--line);color:var(--tx2);font-size:var(--t-lg);display:flex;
    align-items:center;justify-content:center;cursor:pointer;flex:0 0 auto}
  .sq{width:42px;height:42px;border-radius:var(--r-sm);background:var(--sunk);border:1px solid var(--line);
    color:var(--primary-ink);font-size:22px;font-weight:var(--w-bold);display:flex;
    align-items:center;justify-content:center;cursor:pointer}
  .exstart,.exadd{width:42px;height:42px;border-radius:var(--r-sm);display:flex;align-items:center;
    justify-content:center;flex:0 0 auto;cursor:pointer;font-size:var(--t-sm)}
  .exstart{background:var(--primary-tint);color:var(--primary-ink);border:none}
  .exadd{background:var(--sunk);color:var(--mut);border:1px solid var(--line);font-size:var(--t-lg);font-weight:var(--w-bold)}
  .setok{background:var(--primary);color:var(--on-primary);font-size:var(--t-sm);
    border-radius:10px;padding:6px 10px;margin-left:6px}

  /* pastillas */
  .badge,.chip,.mchip,.delta,.zonatag{font-size:var(--t-2xs);font-weight:var(--w-bold);
    border-radius:var(--r-pill);letter-spacing:.2px;display:inline-block}
  .badge{padding:3px 10px}
  .chip,.mchip{padding:5px 11px;background:var(--sunk);color:var(--tx2);
    border:1px solid var(--line);cursor:pointer}
  .mchip.on{background:var(--primary-tint);color:var(--primary-ink);border-color:var(--primary)}
  .delta{padding:3px 9px;font-size:var(--t-xs);flex:0 0 auto}
  .delta.up{background:var(--primary-tint);color:var(--primary-ink)}
  .delta.down{background:var(--rest-tint);color:var(--rest-ink)}
  .b-diario{background:var(--accent-tint);color:var(--accent-ink)}
  .b-carga{background:var(--load-tint);color:var(--load-ink)}
  .b-calent{background:var(--sunk);color:var(--mut)}
  .b-opcional{background:var(--rest-tint);color:var(--rest-ink)}
  .zonatag{color:var(--accent-ink);border-radius:0;font-size:var(--t-xs);margin:0 0 var(--s2)}
  /* área de toque cómoda sin agrandar el control */
  .exck,.chip,.mchip,.setline .del,.calnav{position:relative}
  .exck:after,.chip:after,.mchip:after,.setline .del:after,.calnav:after{content:"";
    position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);
    min-width:44px;min-height:44px;width:100%;height:100%}

  /* entradas numéricas */
  .numin,.setin,.addrow input,.bwrow input{background:var(--card);color:var(--tx);
    border:2px solid var(--primary);border-radius:10px;text-align:center;
    font-weight:var(--w-bold);font-variant-numeric:tabular-nums;-moz-appearance:textfield}
  .numin{width:104px;font-size:24px;padding:2px 4px}
  .setin{width:58px;font-size:var(--t-sm);padding:5px 2px}
  .addrow input,.bwrow input{flex:1;min-width:0;text-align:left;background:var(--sunk);
    border:1px solid var(--line);border-radius:var(--r-sm);padding:12px;font-size:var(--t-md);font-weight:var(--w-med)}
  .numin::-webkit-outer-spin-button,.numin::-webkit-inner-spin-button,
  .setin::-webkit-outer-spin-button,.setin::-webkit-inner-spin-button{-webkit-appearance:none;margin:0}

  /* ==================== bloques rehechos en v24 ====================
     Antes cada rutina, cada ejercicio y cada estadistica era una tarjeta
     suelta con la misma sombra: doce seguidas y ninguna destacaba. Ahora
     hay una superficie por BLOQUE y filas separadas por linea fina. */

  /* racha: una linea en vez de tres tarjetones */
  .streak{display:flex;align-items:center;gap:9px;margin:var(--s3) var(--gut) 0;
    padding:13px 15px;background:var(--card);border-radius:var(--r-md);box-shadow:var(--sh-card)}
  .streak .fl{color:var(--energy);display:flex;align-items:center}
  .streak .n{font-size:var(--t-title);font-weight:var(--w-bold);line-height:1;letter-spacing:-.5px;
    font-variant-numeric:tabular-nums}
  .streak .lb{font-size:var(--t-sm);color:var(--mut);font-weight:var(--w-med)}
  .streak .wkring{display:inline-flex;vertical-align:-8px;margin-right:5px}
  .streak .rt b{color:var(--tx);font-variant-numeric:tabular-nums}
  /* barra de sobrecarga: la franja marca lo esperable, no el 100% */
  .ovbar{position:relative;height:8px;border-radius:var(--r-pill);background:var(--sunk);
    margin-top:9px;overflow:hidden}
  .ovbar i{display:block;height:100%;border-radius:var(--r-pill);background:var(--primary);
    transition:width .35s ease}
  .ovbar u{position:absolute;top:0;height:100%;border-left:1px dashed var(--line2);
    border-right:1px dashed var(--line2);text-decoration:none}
  .streak .rt{margin-left:auto;font-size:var(--t-xs);color:var(--mut);font-weight:var(--w-med);text-align:right;line-height:1.35}
  .streak .rt b{color:var(--tx2);font-weight:var(--w-bold);font-variant-numeric:tabular-nums}

  /* la semana pasa de siete tarjetas a un riel */
  .week{display:flex;margin:var(--s3) var(--gut) 0;background:var(--card);
    border-radius:var(--r-md);box-shadow:var(--sh-card);overflow:hidden;padding:0;gap:0}
  .week .day{flex:1;min-width:0;border-radius:0;box-shadow:none;background:none;border:none;
    border-left:1px solid var(--line);padding:10px 2px 9px}
  .week .day:first-child{border-left:none}
  .week .day.on{background:var(--primary-tint)}
  .week .day.on .d{color:var(--primary-ink)}

  /* rutinas: una tarjeta por familia, no una por rutina */
  .rlist{margin:0 var(--gut) var(--s4);background:var(--card);border-radius:var(--r-lg);
    box-shadow:var(--sh-card);overflow:hidden}
  .rlist .rcard{margin:0;border-radius:0;box-shadow:none;background:none;
    border-top:1px solid var(--line);padding:13px 14px}
  .rlist .rcard:first-child{border-top:none}
  :root[data-theme="dark"] .rlist .rcard{border:none;border-top:1px solid var(--line)}
  :root[data-theme="dark"] .rlist .rcard:first-child{border-top:none}

  /* anillo de avance de la rutina */
  .rring{width:46px;height:46px;position:relative;flex:0 0 auto}
  .rring svg{transform:rotate(-90deg);display:block}
  .rring b{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;
    font-size:var(--t-xs);font-weight:var(--w-bold);font-variant-numeric:tabular-nums;color:var(--tx2)}

  /* ejercicios: una superficie por bloque y filas dentro */
  .exgroup{margin:0 0 var(--s3);background:var(--card);border-radius:var(--r-lg);
    box-shadow:var(--sh-card);overflow:hidden}
  :root[data-theme="dark"] .exgroup{border:1px solid var(--line)}
  .exgroup .blockt{margin:0;padding:10px 14px;background:var(--sunk);
    border-bottom:1px solid var(--line);display:flex;align-items:center;gap:6px}
  .exgroup .ex{margin:0;border-radius:0;box-shadow:none;background:none;border:none;
    overflow:visible;border-top:1px solid var(--line)}
  .exgroup .ex:first-of-type{border-top:none}
  :root[data-theme="dark"] .exgroup .ex{border:none;border-top:1px solid var(--line)}
  /* solo destaca uno: el siguiente que toca */
  .exgroup .ex.next{background:var(--card2);box-shadow:inset 3px 0 0 var(--primary)}
  .exgroup .ex.next .exstart{background:var(--primary);color:var(--on-primary)}
  /* lo hecho encoge: la pantalla se acorta segun avanzas */
  .ex.checked .meta,.ex.checked .badges{display:none}
  .ex.checked .diag{opacity:.4}
  .ex .top{padding:11px 13px}

  /* ======================= momentos =======================
     Nada dura mas de medio segundo: una celebracion que se disfruta la
     primera vez estorba la trigesima. */
  @keyframes pop{from{opacity:0;transform:translateY(6px) scale(.96)}to{opacity:1;transform:none}}
  @keyframes ckpop{0%{transform:scale(.4)}60%{transform:scale(1.18)}100%{transform:scale(1)}}
  @keyframes flash{from{background:var(--primary-tint)}to{background:transparent}}
  @keyframes drawring{from{stroke-dashoffset:var(--len)}to{stroke-dashoffset:0}}
  .setline.pop{animation:pop .24s ease-out}
  .ex.checked .exck .ic{animation:ckpop .32s cubic-bezier(.2,1.4,.4,1)}
  .ex.justdone{animation:flash .6s ease-out}
  .setline.pr{background:var(--energy-tint);border-color:var(--energy)}
  .setline.pr .n{color:var(--energy-ink)}
  .prtag{margin-left:auto;color:var(--energy-ink);display:flex;align-items:center;gap:4px;
    font-size:var(--t-2xs);font-weight:var(--w-bold);text-transform:uppercase;letter-spacing:.6px}

  /* aviso flotante: la unica pieza que faltaba para poder celebrar algo */
  .toast{position:fixed;left:50%;bottom:calc(80px + env(safe-area-inset-bottom));
    transform:translateX(-50%) translateY(16px);background:var(--hero);color:var(--hero-tx);
    border-radius:var(--r-pill);padding:12px 20px;font-size:var(--t-sm);font-weight:var(--w-semi);
    z-index:70;display:flex;align-items:center;gap:9px;max-width:86%;opacity:0;pointer-events:none;
    box-shadow:0 10px 30px -10px rgba(0,0,0,.5);transition:opacity .25s,transform .25s}
  .toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
  .toast .ic{color:var(--energy-hero);flex:0 0 auto}

  /* pantalla de fin */
  .done .hero{margin:0 auto var(--s4);width:104px;height:104px;display:block}
  .donesum{display:flex;gap:var(--s2);margin:var(--s5) 0 0}
  .donesum div{flex:1;background:var(--card);border-radius:var(--r-md);padding:12px 6px;box-shadow:var(--sh-card)}
  :root[data-theme="dark"] .donesum div{border:1px solid var(--line)}
  .donesum b{display:block;font-size:var(--t-title);font-weight:var(--w-bold);
    font-variant-numeric:tabular-nums;line-height:1.15}
  .donesum span{font-size:var(--t-2xs);font-weight:var(--w-bold);color:var(--mut);
    text-transform:uppercase;letter-spacing:.6px}
  .doneprs{margin:var(--s4) 0 0;text-align:left}
  .doneprs .h{font-size:var(--t-2xs);font-weight:var(--w-bold);color:var(--energy-ink);
    text-transform:uppercase;letter-spacing:1.1px;display:flex;align-items:center;gap:6px;margin-bottom:var(--s2)}
  .doneprs .r{display:flex;gap:10px;font-size:var(--t-sm);padding:9px 12px;background:var(--energy-tint);
    border-radius:var(--r-sm);margin-bottom:6px;color:var(--energy-ink);font-weight:var(--w-semi)}
  .doneprs .r b{margin-left:auto;font-variant-numeric:tabular-nums}
  .donest{display:flex;align-items:center;justify-content:center;gap:9px;margin-top:var(--s5);
    color:var(--energy-ink);font-weight:var(--w-bold);font-size:var(--t-base)}
  .donest .n{font-size:var(--t-display);letter-spacing:-1px;font-variant-numeric:tabular-nums}

  /* ============================ iconos ============================
     Un solo trazo para toda la app: rejilla 24, grosor 2, remates
     redondos y currentColor, igual que los iconos que ya traia la barra
     inferior. Antes la interfaz se dibujaba con 32 emojis distintos, que
     cambian de aspecto en cada telefono y no se pueden colorear. */
  .ic{width:20px;height:20px;stroke:currentColor;fill:none;stroke-width:2;
    stroke-linecap:round;stroke-linejoin:round;display:inline-block;vertical-align:-4px;flex:0 0 auto}
  .ic.xs{width:15px;height:15px;stroke-width:2.2}
  .ic.sm{width:17px;height:17px}
  .ic.lg{width:26px;height:26px;stroke-width:1.9}
  .ic.hero{width:34px;height:34px;stroke-width:1.7}
  .ic.solid{fill:currentColor;stroke:none}
  /* el visto se dibuja siempre y lo enseña el CSS: asi el estado vive en
     una clase y no en el texto del elemento */
  .exck .ic{width:15px;height:15px;opacity:0;transform:scale(.5);transition:opacity .15s,transform .18s}
  .ex.checked .exck .ic{opacity:1;transform:none}

  /* ========================== navegación ========================== */
  .nav{position:fixed;bottom:0;left:0;right:0;max-width:600px;margin:0 auto;background:var(--nav-bg);
    backdrop-filter:blur(12px);border-top:1px solid var(--line);display:flex;
    padding:6px 6px calc(6px + env(safe-area-inset-bottom));z-index:30}
  .nav.hide{display:none}
  .nav .tab{flex:1;text-align:center;color:var(--mut);font-size:var(--t-2xs);
    font-weight:var(--w-semi);padding:7px 2px;border-radius:var(--r-sm);margin:0 3px;
    transition:background .15s,color .15s}
  .nav .tab.on{color:var(--primary-ink);background:var(--primary-tint)}
  .nav .tab .i{display:block;margin-bottom:2px}
  .nav .tab .i svg{width:23px;height:23px;stroke:currentColor;fill:none;stroke-width:1.9;
    stroke-linecap:round;stroke-linejoin:round;display:block;margin:0 auto}

  /* =========================== INICIO =========================== */
  .head{padding:calc(20px + env(safe-area-inset-top)) var(--gut) 2px;display:flex;align-items:center;gap:var(--s3)}
  .head img{width:42px;height:42px;border-radius:13px}
  .head .sub{color:var(--mut);font-size:var(--t-sm);margin-top:2px}
  .install{display:none;margin:var(--s3) var(--gut) 0;background:var(--accent-tint);
    border-radius:var(--r-md);padding:12px 14px;font-size:var(--t-sm);align-items:center;gap:var(--s2);
    color:var(--accent-ink);font-weight:var(--w-med)}
  .install button{margin-left:auto;background:var(--primary);color:var(--on-primary);
    border-radius:10px;padding:9px 13px;font-size:var(--t-sm)}

  /* tarjeta HOY: invertida, ancla visual de la pantalla */
  .today{margin:var(--s4) var(--gut) var(--s1);background:var(--hero);border:none;
    border-radius:var(--r-xl);padding:18px;box-shadow:var(--sh-card)}
  .today .kick{color:var(--hero-accent)}
  .today .tt{color:var(--hero-tx);font-size:var(--t-display);font-weight:var(--w-bold);
    letter-spacing:-1px;line-height:1.08;margin-top:6px;text-wrap:balance}
  .today .mt{color:var(--hero-mut);font-size:var(--t-sm);margin-top:5px;line-height:1.4}
  .today .alt{color:var(--hero-mut);margin-top:11px}

  .wkhead{display:flex;align-items:baseline;justify-content:space-between;padding:var(--s5) var(--gut) 0}
  /* aqui habia una segunda declaracion de .week, de antes del rediseno, que
     ganaba en gap y padding y dejaba el riel con 32 px de inset lateral: 16 de
     margen mas 16 de padding. Eso rompia la regla del margen unico, que dice
     que todo bloque de primer nivel mide lo mismo. La buena es la de arriba. */
  .day{flex:1;min-width:0;border-radius:var(--r-sm);padding:9px 2px;text-align:center;cursor:pointer}
  .day .d{font-size:var(--t-xs);font-weight:var(--w-bold);color:var(--mut)}
  .day .tag{font-size:var(--t-2xs);font-weight:var(--w-semi);margin-top:4px;color:var(--mut);
    line-height:1.1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  /* el dia de hoy se marca con el tinte del riel (.week .day.on), no tambien
     con un anillo: dos senales para lo mismo se leen como un error */
  .day.on .d{color:var(--primary-ink)}
  .day.d-p .tag{color:var(--primary-ink)} .day.d-n .tag{color:var(--accent-ink)}
  .day.d-g .tag{color:var(--load-ink)} .day.rest .tag{color:var(--mut)}

  .stats{display:flex;gap:var(--s2);margin:var(--s4) var(--gut) 2px}
  .stat{flex:1;border-radius:var(--r-md);padding:12px 13px}
  .stat .v{font-size:var(--t-lg);font-weight:var(--w-bold);line-height:1;letter-spacing:-.5px;color:var(--tx)}
  .stat .l{color:var(--mut);font-size:var(--t-2xs);margin-top:5px;font-weight:var(--w-med)}
  /* b2 y b3 venían de una versión con tarjetas de colores distintos; ahora las
     tres son iguales a propósito y solo cambia el emoji de la etiqueta */
  .stat.b2,.stat.b3{background:var(--card)}

  .rcard{margin:0 var(--gut) var(--s2);padding:14px;display:flex;gap:13px;
    align-items:center;cursor:pointer;transition:transform .15s;border-radius:var(--r-lg)}
  .rcard:active{transform:scale(.99)}
  .rcard .em{width:48px;height:48px;border-radius:15px;display:flex;align-items:center;
    justify-content:center;font-size:22px;flex:0 0 auto;background:var(--primary-tint);color:var(--primary-ink)}
  .rcard .em.n{background:var(--accent-tint);color:var(--accent-ink)}
  .rcard .em.g{background:var(--load-tint);color:var(--load-ink)}
  .rcard .t{flex:1;min-width:0}
  .rcard .nm{font-weight:var(--w-semi);font-size:var(--t-lead);letter-spacing:-.2px}
  .rcard .ds{color:var(--mut);font-size:var(--t-sm);margin-top:3px;line-height:1.35}
  .rcard .go{color:var(--line2);font-size:var(--t-lg);display:flex;align-items:center}
  .rcard .rt{font-size:var(--t-sm);color:var(--mut);font-weight:var(--w-semi);
    font-variant-numeric:tabular-nums;flex:0 0 auto;margin-right:2px}

  /* ====================== DETALLE DE RUTINA ====================== */
  .bar{display:flex;align-items:center;gap:var(--s3);
    padding:calc(18px + env(safe-area-inset-top)) var(--gut) 6px}
  .bar .ttl{font-size:var(--t-display);font-weight:var(--w-bold);letter-spacing:-1px;flex:1;min-width:0;line-height:1.1;text-wrap:balance}
  .routprog{margin:0 var(--gut) 6px;font-size:var(--t-sm);font-weight:var(--w-bold);color:var(--primary-ink)}
  .exwrap{margin:6px var(--gut)}
  .ex{margin-bottom:var(--s2);overflow:hidden;border-radius:var(--r-lg)}
  .ex .top{display:flex;gap:11px;align-items:center;padding:12px;cursor:pointer}
  .ex .nm{font-weight:var(--w-semi);font-size:var(--t-lead);line-height:1.2;letter-spacing:-.2px}
  .ex .meta{color:var(--mut);font-size:var(--t-sm);margin-top:3px}
  .badges{display:flex;gap:5px;flex-wrap:wrap;margin-top:6px}
  /* la miniatura de 46 px era ilegible por aritmetica: el SVG mide ~255
     unidades y entra en 36 px utiles, o sea a escala 0,14, con la cabeza a
     4 px y el ojo por debajo de un pixel. Se paga ese ancho en catorce filas
     para mostrar algo que nadie puede descifrar. Ahora solo la fila
     "siguiente" -- la unica que debe destacar -- la lleva grande y animada. */
  .diag{width:46px;height:46px;border-radius:12px;background:var(--diagram-bg);
    flex:0 0 auto;display:flex;align-items:center;justify-content:center;padding:5px}
  .diag svg{width:100%;height:100%}
  .diag.big{width:76px;height:76px;border-radius:var(--r-sm);padding:6px}
  .diaginner{position:relative;width:100%;height:100%}
  .diaginner i{position:absolute;inset:0;display:flex;align-items:center;justify-content:center}
  .diaginner i svg{width:100%;height:100%}
  /* el circulo hueco es la UNICA senal de que ahi hay un control, asi que su
     borde necesita 3:1. Con --line2 daba 1,5:1; --ctl-line existe para esto. */
  .exck{width:28px;height:28px;border-radius:50%;border:2px solid var(--ctl-line);background:transparent;
    color:var(--on-primary);font-size:var(--t-sm);font-weight:var(--w-bold);display:flex;
    align-items:center;justify-content:center;flex:0 0 auto;cursor:pointer}
  .ex.checked{background:var(--primary-tint)}
  :root[data-theme="dark"] .ex.checked{background:var(--card)}
  .ex.checked .exck{background:var(--primary);border-color:var(--primary)}
  .ex.checked .nm{color:var(--mut);text-decoration:line-through}
  .ex.off{opacity:.6}
  .optsub{font-size:var(--t-xs);color:var(--mut);font-weight:var(--w-med);margin-top:2px}

  /* pasos numerados (detalle y guiado comparten formato) */
  .glist{list-style:none;margin:var(--s2) 0 0;padding:0;counter-reset:s}
  .glist li{position:relative;padding:8px 0 8px 32px;color:var(--tx2);
    font-size:var(--t-base);line-height:1.5}
  .glist li:before{counter-increment:s;content:counter(s);position:absolute;
    left:0;top:8px;width:22px;height:22px;background:var(--primary);color:var(--on-primary);
    border-radius:50%;font-size:var(--t-xs);font-weight:var(--w-bold);
    display:flex;align-items:center;justify-content:center}
  .glist{margin-top:var(--s4)}

  /* figuras paso a paso */
  .frames{display:flex;gap:var(--s2);margin:var(--s1) 0 var(--s3)}
  .frame{flex:1;min-width:0;background:var(--diagram-bg);padding:8px 6px 7px;
    display:flex;flex-direction:column;align-items:center;gap:5px}
  .frame .fnum{width:20px;height:20px;border-radius:50%;background:var(--primary);
    color:var(--on-primary);font-size:var(--t-xs);font-weight:var(--w-bold);
    display:flex;align-items:center;justify-content:center;font-variant-numeric:tabular-nums}
  .frame .fdiag{width:100%;height:74px}
  .frame .fdiag svg{width:100%;height:100%;display:block}
  .frame .fcap{font-size:var(--t-2xs);color:var(--tx2);text-align:center;
    font-weight:var(--w-med);line-height:1.2}
  .gframes{margin:2px 0}
  #guided .frame .fdiag{height:94px}

  .chip.tiny{padding:1px 7px;font-size:var(--t-2xs);vertical-align:1px;
    background:var(--primary-tint);color:var(--primary-ink);border-color:transparent}

  /* curva de evolución del ejercicio */
  .exprog{padding:11px 12px 6px;margin:2px 0 var(--s3)}
  .exprog .ct{font-size:var(--t-sm);font-weight:var(--w-bold)}
  .exprog .cs,.chartcard .cs{font-size:var(--t-xs);color:var(--mut);font-weight:var(--w-med);margin:2px 0 var(--s2)}
  .exempty{font-size:var(--t-sm);color:var(--mut);font-weight:var(--w-med);line-height:1.5}
  .cthead{display:flex;align-items:center;gap:var(--s2)}
  .cthead .ct{flex:1;min-width:0}
  .mchips{display:flex;flex-wrap:wrap;gap:5px;margin:2px 0 var(--s2)}
  .spk{display:inline-block;vertical-align:middle;margin-left:var(--s2)}

  /* barra inferior de acción */
  .cta{position:sticky;bottom:0;padding:var(--s3) var(--gut) calc(var(--s3) + env(safe-area-inset-bottom));
    background:linear-gradient(0deg,var(--bg) 62%,transparent)}
  .cta2{display:flex;flex-direction:column;gap:var(--s2)}
  .ctanote{font-size:var(--t-sm);font-weight:var(--w-bold);color:var(--primary-ink);text-align:center}

  /* ========================= MODO GUIADO ========================= */
  #guided{padding-bottom:var(--s5)}
  .gtop{display:flex;align-items:center;gap:var(--s2);
    padding:calc(14px + env(safe-area-inset-top)) var(--gut) 6px}
  .pbar{flex:1;height:8px;background:var(--sunk);border-radius:var(--r-pill);overflow:hidden}
  .pbar>i{display:block;height:100%;width:0;background:var(--primary);transition:width .35s}
  .gcount{color:var(--mut);font-size:var(--t-sm);font-weight:var(--w-bold)}
  .stage{padding:var(--s2) var(--gut) var(--s6)}
  /* la serie manda: pastilla en vez de linea de texto */
  .setlab{display:inline-flex;align-items:center;gap:6px;background:var(--primary-tint);
    color:var(--primary-ink);padding:6px 13px;border-radius:var(--r-pill);
    font-size:var(--t-xs);font-weight:var(--w-bold);letter-spacing:1.1px;
    text-transform:uppercase;margin-top:var(--s2)}
  /* la ficha de como se hace baja al final y se pliega: durante la serie
     estorba, y a partir de la tercera vez ya no hace falta leerla */
  .exinfo{margin-top:var(--s5);border-top:1px solid var(--line)}
  .exinfo>summary{list-style:none;display:flex;align-items:center;gap:8px;cursor:pointer;
    font-size:var(--t-xs);font-weight:var(--w-bold);color:var(--mut);padding:14px 0 10px;
    text-transform:uppercase;letter-spacing:1.1px}
  .exinfo>summary::-webkit-details-marker{display:none}
  .exinfo>summary:after{content:"";margin-left:auto;width:8px;height:8px;
    border-right:2px solid var(--line2);border-bottom:2px solid var(--line2);
    transform:rotate(45deg) translate(-2px,-2px);transition:transform .2s}
  .exinfo[open]>summary:after{transform:rotate(-135deg) translate(-2px,-2px)}
  .exinfo-b{padding-bottom:var(--s2)}
  .exname{font-size:var(--t-title);font-weight:var(--w-bold);letter-spacing:-.9px;
    margin:10px 0 var(--s4);line-height:1.1;text-wrap:balance}
  .gdiag{width:100%;height:172px;background:var(--diagram-bg);border-radius:var(--r-md);
    display:flex;align-items:center;justify-content:center;padding:12px;margin-bottom:6px}
  .gdiag svg{height:100%;width:auto;max-width:100%}
  /* la figura ejecuta el ejercicio: los dos fotogramas apilados y fundidos,
     con meseta en cada extremo para que se lea la postura y no sea un parpadeo */
  .anim{position:relative}
  .anim i{position:absolute;inset:12px;display:flex;align-items:center;justify-content:center}
  .anim i svg{height:100%;width:auto;max-width:100%}
  /* --- micro-interaccion (v25) --- */
  /* el boton se convierte en visto antes de que entre el descanso */
  .gbtn.go.done{background:var(--primary2);transform:scale(.985)}
  /* el descanso: pantalla propia, con el mismo anillo que el sosten */
  .stage.isrest{padding-top:var(--s5)}
  .ring.rest #rarc{transition:stroke-dashoffset .25s linear}
  .ring.rest .val b{font-size:var(--t-mega);letter-spacing:-2px;color:var(--energy-ink)}
  .ring.rest.last .val b{color:var(--energy-strong)}
  .ring.rest.last svg{animation:pulso 1s ease-in-out infinite}
  @keyframes pulso{0%,100%{opacity:1}50%{opacity:.72}}
  .nextup{text-align:center;font-size:var(--t-sm);font-weight:var(--w-semi);
    color:var(--mut);margin:var(--s3) 0 var(--s1)}
  /* cada paso del guiado entra con un gesto corto en vez de aparecer de golpe */
  .stage{animation:stageIn .18s ease-out}
  @keyframes stageIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
  .anim .fa{animation:figA 2.6s ease-in-out infinite}
  .anim .fb{animation:figB 2.6s ease-in-out infinite}
  @keyframes figA{0%,38%{opacity:1}50%,88%{opacity:0}100%{opacity:1}}
  @keyframes figB{0%,38%{opacity:0}50%,88%{opacity:1}100%{opacity:0}}
  .videobox{margin:var(--s3) 0 2px;border-radius:var(--r-md);overflow:hidden;background:#000;display:none}
  .videobox.show{display:block}
  .ratio{position:relative;width:100%;padding-top:56.25%}
  .ratio iframe{position:absolute;inset:0;width:100%;height:100%;border:0}
  /* casi todos los clips de un solo ejercicio son Shorts verticales: dentro de
     la caja 16:9 quedarian como un sello en medio de dos franjas negras, asi
     que la caja se estrecha y se centra en vez de deformar el video */
  .videobox.vert{max-width:min(100%,34vh);margin-left:auto;margin-right:auto}
  .videobox.vert .ratio{padding-top:177.78%}
  .ytlink{display:inline-block;color:var(--accent-ink);font-size:var(--t-sm);
    margin:var(--s2) 2px 0;text-decoration:none;font-weight:var(--w-med)}
  .target{text-align:center;font-size:var(--t-lg);font-weight:var(--w-bold);margin:var(--s5) 0 var(--s1)}
  .target small{display:block;color:var(--mut);font-size:var(--t-sm);font-weight:var(--w-med);margin-top:var(--s1)}

  /* steppers: el ancla visual de la pantalla */
  .logrow{display:flex;gap:var(--s2);margin-top:var(--s1)}
  .stepper{flex:1;border-radius:var(--r-md);padding:12px 10px}
  .stepper .lab{text-align:center}
  .stepper .row{display:flex;align-items:center;justify-content:space-between;margin-top:6px}
  .stepper .row b{font-size:var(--t-xl);font-weight:var(--w-bold);letter-spacing:-1px;cursor:pointer}
  .stepper .row b small{font-size:var(--t-sm);font-weight:var(--w-med);color:var(--mut)}
  .last{margin:var(--s3) 0 var(--s1)}
  .last.tap{cursor:pointer}
  .gchart{margin:var(--s2) 0 0;display:none}
  .gchart.show{display:block}
  .sets{margin:var(--s3) 0 0;display:flex;flex-direction:column;gap:6px}
  .setline{display:flex;align-items:center;gap:var(--s2);font-size:var(--t-sm);padding:9px 11px}
  .setline .n{color:var(--mut);font-weight:var(--w-bold);width:52px}
  .setline .v{font-weight:var(--w-semi);cursor:pointer}
  .setline .ck{margin-left:auto;color:var(--primary-ink);font-weight:var(--w-bold)}
  .setline .del{margin-left:auto;color:var(--mut);font-size:var(--t-base);
    font-weight:var(--w-bold);cursor:pointer;padding:2px 4px;line-height:1}
  .setline .ck~.del{margin-left:var(--s2)}

  /* temporizadores */
  .ring{position:relative;width:200px;height:200px;margin:var(--s4) auto 0}
  .ring .val{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center}
  .ring .val b{font-size:var(--t-mega);font-weight:var(--w-bold)}
  .ring .val span{color:var(--mut);font-size:var(--t-sm);font-weight:var(--w-med);margin-top:2px}
  .phaselab{text-align:center;color:var(--mut);font-size:var(--t-base);
    font-weight:var(--w-bold);margin-bottom:var(--s1);text-transform:uppercase;letter-spacing:1px}
  .timer{font-size:var(--t-mega);font-weight:var(--w-bold);text-align:center;margin:var(--s5) 0 var(--s1)}
  .timer.rest{color:var(--rest)}

  /* pantalla final */
  .done{text-align:center;padding:46px var(--s5)}
  .done .em{font-size:60px}
  .done h2{font-size:var(--t-xl);margin:var(--s3) 0 var(--s1);font-weight:var(--w-bold);letter-spacing:-.6px}
  .done .big{font-size:var(--t-mega);font-weight:var(--w-bold);color:var(--primary-ink);margin:var(--s4) 0 0}

  /* ==================== CALENDARIO E HISTORIAL ==================== */
  .sect{padding:6px var(--gut) var(--s5)}
  .cal{border-radius:var(--r-lg);padding:14px 12px 16px;margin-bottom:var(--s4)}
  .calhead{display:flex;align-items:center;gap:var(--s2);margin-bottom:var(--s2)}
  .calhead .m{flex:1;text-align:center;font-weight:var(--w-bold);font-size:var(--t-md);text-transform:capitalize}
  .calnav{width:38px;height:38px;border-radius:var(--r-sm);border:1px solid var(--line);
    background:var(--sunk);color:var(--tx2);font-size:17px;display:flex;
    align-items:center;justify-content:center;cursor:pointer}
  .calgrid{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:3px}
  .calgrid .wd{text-align:center;font-size:var(--t-2xs);font-weight:var(--w-bold);color:var(--mut);padding:2px 0 4px}
  .calcell{min-width:0;min-height:44px;padding:3px 0;display:flex;flex-direction:column;
    align-items:center;justify-content:center;gap:2px;cursor:pointer}
  .calcell.empty{visibility:hidden}
  .calcell .dnum{width:32px;height:32px;border-radius:50%;display:flex;align-items:center;
    justify-content:center;font-size:var(--t-sm);font-weight:var(--w-med);color:var(--tx2)}
  .calcell.has .dnum{color:var(--tx);font-weight:var(--w-semi)}
  /* ojo: la clase se llama "istoday" y no "today" a proposito. ".today" es la
     tarjeta oscura de la portada y se colaba aqui pintando la celda de negro */
  .calcell.istoday .dnum{border:2px solid var(--primary);color:var(--primary-ink)}
  .calcell.sel .dnum{background:var(--primary);color:var(--on-primary)}
  .calcell .dots{display:flex;gap:3px;height:6px;align-items:center}
  .calcell .cdot{width:6px;height:6px;border-radius:50%;flex:0 0 auto}
  .cdot.p{background:var(--primary)} .cdot.n{background:var(--accent)} .cdot.g{background:var(--load)}
  .callegend{display:flex;gap:14px;justify-content:center;margin:var(--s3) 0 2px;
    font-size:var(--t-xs);font-weight:var(--w-med);color:var(--mut)}
  .callegend span{display:flex;align-items:center;gap:5px}
  .callegend .cdot{display:inline-block;width:8px;height:8px;border-radius:50%}

  .hitem{border-radius:var(--r-md);padding:13px 14px;margin-bottom:var(--s2);
    display:flex;align-items:center;gap:var(--s3);cursor:pointer}
  /* cada sesion se distingue por su familia: antes el cuadro era siempre
     verde y lo unico que cambiaba era el emoji */
  .hitem .dot.n{background:var(--accent-tint);color:var(--accent-ink)}
  .hitem .dot.g{background:var(--load-tint);color:var(--load-ink)}
  .hitem .dot{width:38px;height:38px;border-radius:12px;background:var(--primary-tint);
    color:var(--primary-ink);display:flex;align-items:center;justify-content:center;
    font-size:18px;flex:0 0 auto}
  .hitem .nm{font-weight:var(--w-semi);font-size:var(--t-base)}
  .hitem .dt{color:var(--mut);font-size:var(--t-sm);margin-top:2px;text-transform:capitalize}
  .hitem .dt2{font-size:var(--t-xs);color:var(--mut);font-weight:var(--w-med);margin-top:3px}
  .hitem .go{color:var(--mut);font-size:var(--t-lg)}
  /* cabecera del dia elegido: fecha a la izquierda y el boton de anadir a mano
     a la derecha, para poder registrar una rutina que no se anoto ese dia */
  .caldayhead{display:flex;align-items:center;gap:var(--s2);margin:2px 2px 8px}
  .caldayhead .grouptitle{margin:0;flex:1}
  .calladd{display:inline-flex;align-items:center;gap:4px;border:1px solid var(--line);
    background:var(--card);color:var(--primary-ink);border-radius:var(--r-pill);
    padding:7px 13px 7px 10px;font-size:var(--t-xs);font-weight:var(--w-bold);
    font-family:inherit;cursor:pointer;flex:0 0 auto;box-shadow:var(--sh-card)}
  .calladd:active{transform:scale(.97)}
  .calladd .ic{width:16px;height:16px}
  .dayblock .mrow{display:flex;align-items:center;justify-content:space-between;
    gap:var(--s2);padding:0 14px 11px}
  .dayblock .mtag{font-size:var(--t-2xs);font-weight:var(--w-bold);letter-spacing:.04em;
    text-transform:uppercase;color:var(--mut)}
  .dayblock .mdel{border:none;background:none;color:var(--mut);font-family:inherit;
    font-size:var(--t-xs);font-weight:var(--w-semi);cursor:pointer;padding:4px 2px}
  .calsum{font-size:var(--t-sm);color:var(--mut);font-weight:var(--w-med);margin:0 2px var(--s3)}
  .calsum b{color:var(--tx);font-weight:var(--w-bold);font-variant-numeric:tabular-nums}
  /* el detalle vive dentro de la tarjeta de su sesion: antes era un bloque
     hermano y al desplegarlo se separaba visualmente */
  .dayblock{margin-bottom:var(--s2);background:var(--card);border-radius:var(--r-md);
    box-shadow:var(--sh-card);overflow:hidden}
  :root[data-theme="dark"] .dayblock{border:1px solid var(--line)}
  .dayblock .hitem{margin:0;border-radius:0;box-shadow:none;background:none}
  :root[data-theme="dark"] .dayblock .hitem{border:none}
  .daydet{display:none;margin:0;border-radius:0;background:var(--sunk);
    box-shadow:none;padding:2px 14px 8px;border-top:1px solid var(--line)}
  :root[data-theme="dark"] .daydet{border:none;border-top:1px solid var(--line)}
  .daydet.open{display:block}
  .ddrow{display:flex;gap:var(--s3);font-size:var(--t-sm);padding:9px 0;border-top:1px solid var(--line)}
  .ddrow:first-child{border-top:none}
  .ddrow .dn{flex:1;font-weight:var(--w-med);min-width:0}
  .ddrow .dv{color:var(--mut);font-weight:var(--w-semi);text-align:right}
  .empty{color:var(--mut);text-align:center;font-size:var(--t-sm);padding:36px 10px;line-height:1.65}

  /* ========================= PROGRESO ========================= */
  .heroP{background:var(--hero);border-radius:var(--r-xl);padding:20px 18px;
    margin:var(--s2) 0 var(--s1);text-align:center}
  .heroP .hkick{color:var(--hero-accent)}
  .heroP .hbig{color:var(--hero-tx);font-size:var(--t-mega);font-weight:var(--w-bold);
    letter-spacing:-2px;line-height:1.05;margin:6px 0 4px}
  .heroP .hsub{color:var(--hero-mut);font-size:var(--t-sm);margin-top:6px;line-height:1.4}
  .heroP .hverd{color:var(--hero-tx);font-size:var(--t-sm);line-height:1.5;
    margin-top:var(--s3);font-weight:var(--w-med)}
  .heroP .delta{display:inline-block;margin-top:2px}
  .heroP svg{margin-top:var(--s3)}
  .chartcard{margin:0 0 var(--s2);border-radius:var(--r-lg);padding:14px 12px 8px}
  .chartcard .ct{font-size:var(--t-base);font-weight:var(--w-bold);margin:0 2px 2px}
  .callout{margin:0 0 var(--s3)}
  .bwrow{display:flex;gap:var(--s2);margin-top:var(--s3)}
  .bwrow .minibtn{margin-top:0;flex:0 0 auto}
  .mbars{display:flex;flex-direction:column;gap:9px}
  .mrow{display:flex;align-items:center;gap:9px}
  .mrow .mn{flex:0 0 84px;font-size:var(--t-xs);font-weight:var(--w-med);color:var(--tx2);
    overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .mrow .mtrack{flex:1;height:10px;background:var(--sunk);border-radius:var(--r-pill);
    position:relative;overflow:hidden;min-width:0}
  .mrow .mfill{position:absolute;left:0;top:0;bottom:0;border-radius:var(--r-pill);background:var(--primary)}
  .mrow .mfill.mid{background:var(--rest)} .mrow .mfill.low{background:var(--danger)}
  .mrow .mgoal{position:absolute;top:-2px;bottom:-2px;width:2px;background:var(--line2);z-index:2}
  .mrow .mv{flex:0 0 26px;text-align:right;font-size:var(--t-xs);font-weight:var(--w-bold)}
  .prrow{display:flex;align-items:baseline;gap:var(--s2);padding:9px 0;border-top:1px solid var(--line)}
  .prrow .prn{flex:1;min-width:0;font-size:var(--t-sm);font-weight:var(--w-med);
    overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .prrow .prv{font-size:var(--t-sm);font-weight:var(--w-bold);color:var(--energy-ink)}
  .prrow .prd{font-size:var(--t-xs);color:var(--mut);flex:0 0 auto}
  .heat{display:grid;grid-template-columns:repeat(12,minmax(0,1fr));gap:3px;margin-top:var(--s3);direction:ltr}
  .heat i{display:block;width:100%;aspect-ratio:1/1;border-radius:3px;background:var(--sunk)}
  .heat i.h-g{background:var(--primary)} .heat i.h-c{background:var(--primary-tint)}
  .heat i.h-b{background:var(--primary);box-shadow:inset 0 0 0 2px var(--accent)}
  .hleg{display:inline-block;width:9px;height:9px;border-radius:2px;vertical-align:-1px;margin:0 2px 0 6px}
  .hleg.h-g{background:var(--primary)} .hleg.h-c{background:var(--primary-tint)}

  /* ========================== AJUSTES ========================== */
  .field{border-radius:var(--r-lg);padding:16px;margin-bottom:var(--s3)}
  .field .fl{font-weight:var(--w-bold);font-size:var(--t-base);margin-bottom:3px}
  .field .fh{color:var(--mut);font-size:var(--t-sm);line-height:1.5}
  .switch{display:flex;align-items:center;gap:var(--s3)}
  .toggle{width:48px;height:28px;border-radius:var(--r-pill);background:var(--line2);
    position:relative;cursor:pointer;flex:0 0 auto;transition:.2s}
  .toggle.on{background:var(--primary)}
  .toggle i{position:absolute;top:3px;left:3px;width:22px;height:22px;background:#fff;
    border-radius:50%;transition:.2s}
  .toggle.on i{left:23px}
  .themeseg{display:inline-flex;flex:0 0 auto;margin-left:auto;background:var(--sunk);
    border:1px solid var(--line);border-radius:var(--r-pill);padding:3px;gap:2px}
  .themeseg button{border:none;background:transparent;color:var(--mut);border-radius:var(--r-pill);
    padding:6px 11px;font-size:var(--t-sm);font-weight:var(--w-bold);cursor:pointer;
    display:flex;align-items:center;gap:5px;min-height:34px}
  .themeseg button svg{width:16px;height:16px;stroke:currentColor;fill:none;stroke-width:1.9;
    stroke-linecap:round;stroke-linejoin:round}
  .themeseg button.on{background:var(--card);color:var(--primary-ink);box-shadow:var(--sh-card)}
  .timelist{display:flex;flex-wrap:wrap;gap:var(--s2);margin-top:var(--s3)}
  .timepill{border-radius:var(--r-pill);padding:8px 13px;font-size:var(--t-base);
    font-weight:var(--w-semi);display:flex;align-items:center;gap:var(--s2)}
  .timepill span.x{color:var(--mut);cursor:pointer;font-weight:var(--w-bold)}
  .addrow{display:flex;gap:var(--s2);margin-top:var(--s3)}
  .addrow button{background:var(--primary);color:var(--on-primary);border-radius:var(--r-sm);
    padding:0 18px;font-size:var(--t-base)}

  /* ========================== OVERLAYS ========================== */
  #planov,#swapov,#finov{position:fixed;inset:0;background:rgba(4,8,12,.55);display:none;
    z-index:60;align-items:flex-end;justify-content:center}
  #finov{z-index:65}
  #planov.show,#swapov.show,#finov.show{display:flex}
  .ovcard{width:100%;max-width:540px;overflow:hidden;border-radius:var(--r-md)}
  #planov .ovcard,#swapov .ovcard,#finov .ovcard{border-radius:var(--r-xl) var(--r-xl) 0 0;
    max-width:600px;max-height:84vh;overflow:auto}
  #finov .ovcard{max-height:88vh}
  .ovhead{display:flex;align-items:center;gap:var(--s3);padding:14px;border-bottom:1px solid var(--line)}
  .ovhead .t{font-weight:var(--w-bold);font-size:var(--t-md);flex:1;overflow:hidden;
    text-overflow:ellipsis;white-space:nowrap}
  .ovhead .x{cursor:pointer;font-size:20px;color:var(--mut);width:40px;height:40px;
    display:flex;align-items:center;justify-content:center}
  .planbody{padding:var(--s3) var(--s3) calc(var(--s4) + env(safe-area-inset-bottom));
    display:flex;flex-direction:column;gap:7px}
  .planopt{display:flex;align-items:center;gap:11px;padding:12px;cursor:pointer;
    font-weight:var(--w-med);font-size:var(--t-base);color:var(--tx);background:var(--card2)}
  .planopt .em{width:34px;height:34px;border-radius:10px;display:flex;align-items:center;
    justify-content:center;background:var(--primary-tint);flex:0 0 auto}
  .planopt.sel{border-color:var(--primary);background:var(--primary-tint)}
  .planopt .em.n{background:var(--accent-tint);color:var(--accent-ink)}
  .planopt .em.g{background:var(--load-tint);color:var(--load-ink)}
  .planopt .em.rest{background:var(--rest-tint);color:var(--rest-ink)}
  .planopt .em.none{background:var(--sunk);color:var(--mut)}
  .planopt .optck{margin-left:auto;color:var(--primary-ink);display:flex;align-items:center}
  /* hoja de resumen */
  .finsum{display:flex;gap:var(--s2);margin:0 0 var(--s3)}
  .finsum .fs{flex:1;padding:10px 4px;text-align:center}
  .finsum .fs b{display:block;font-size:var(--t-lg);font-weight:var(--w-bold);line-height:1.2}
  .finsum .fs span{font-size:var(--t-2xs);letter-spacing:.6px}
  .finlist{display:flex;flex-direction:column;gap:6px;margin:0 0 var(--s4)}
  .setline.fin .n{width:auto;flex:1;color:var(--tx);font-weight:var(--w-med)}
  .setline.fin .v{color:var(--mut);font-weight:var(--w-semi);font-size:var(--t-sm);text-align:right}
  .finempty{padding:16px 14px;text-align:center;font-size:var(--t-sm);color:var(--mut);
    font-weight:var(--w-med);margin:0 0 var(--s4);line-height:1.5}
  .finhint{font-size:var(--t-xs);color:var(--mut);font-weight:var(--w-med);text-align:center;margin-top:2px}
  /* textos sueltos de las plantillas, sobre la misma escala */
  .subttl{margin:0 var(--gut) var(--s1);font-size:var(--t-sm);color:var(--mut)}
  .hint{margin:0 var(--gut) var(--s2);font-size:var(--t-xs);color:var(--mut);line-height:1.45}
  .finhead{font-size:var(--t-sm);color:var(--mut);margin:0 0 var(--s3)}
  .donesub{font-size:var(--t-sm);color:var(--mut);margin-top:var(--s3)}

  /* ============ figuras: los SVG traen hex fijos y se recolorean ============ */
  [stroke="#cfeede"]{stroke:var(--diagram-ink)} [fill="#cfeede"]{fill:var(--diagram-ink)}
  [stroke="#5fe39a"]{stroke:var(--diagram-hi)} [fill="#5fe39a"]{fill:var(--diagram-hi)}
  [fill="#0c1524"]{fill:var(--diagram-eye)}
  [stroke="#3a5069"],[stroke="#46596f"]{stroke:var(--diagram-line)}
  [stroke="#22303c"]{stroke:var(--ring-track)} [stroke="#34d399"]{stroke:var(--primary)}

  /* ============================ foco ============================ */
  button:focus-visible,a:focus-visible,input:focus-visible,[tabindex]:focus-visible,
  .toggle:focus-visible,.rcard:focus-visible,.ex .top:focus-visible{
    outline:none;box-shadow:var(--sh-focus);border-radius:10px}
</style>
</head>
<body>
<div class="app">

  <!-- HOME -->
  <section id="home" class="view active">
    <div class="head">
      <img src="icon-192-v25.png" alt="">
      <div><h1>Mi Rutina</h1><div class="sub">Postura, cuello y fuerza</div></div>
    </div>
    <div id="install" class="install"><span><svg class="ic sm" viewBox="0 0 24 24" aria-hidden="true"><path d="M8 3h8a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2zM11 17.5h2"/></svg> Instálala en tu pantalla de inicio</span><button id="installBtn">Instalar</button></div>
    <div id="todayCard"></div>
    <div class="streak">
      <span class="fl"><svg class="ic sm" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3c.7 2.8 3.7 3.9 3.7 7.6a3.7 3.7 0 1 1-7.4 0c0-1.8.9-2.9 1.9-3.7.2 1.9 1 2.1 1.8 1.9 0-2.8-.9-3.7 0-5.8z"/></svg></span>
      <span class="n" id="stCount">0</span><span class="lb" id="stCountL">semanas cumplidas</span>
      <span class="rt" id="stWeek"></span>
    </div>
    <div id="weekCard"></div>
    <div id="routines"></div>
  </section>

  <!-- ROUTINE DETAIL -->
  <section id="routine" class="view"></section>

  <!-- GUIDED -->
  <section id="guided" class="view"></section>

  <!-- HISTORY -->
  <section id="history" class="view">
    <div class="bar"><div class="ttl">Calendario</div></div>
    <div class="sect" id="histBody"></div>
  </section>

  <!-- SETTINGS -->
  <section id="settings" class="view">
    <div class="bar"><div class="ttl">Ajustes</div></div>
    <div class="sect" id="setBody"></div>
  </section>

  <section id="progress" class="view">
    <div class="bar"><div class="ttl">Progreso</div></div>
    <div class="sect" id="progBody"></div>
  </section>
</div>

<nav class="nav" id="nav">
  <button type="button" class="tab on" data-v="home" aria-current="page"><span class="i"><svg viewBox="0 0 24 24"><path d="M4 11l8-7 8 7M6 10v9h12v-9"/></svg></span>Inicio</button>
  <button type="button" class="tab" data-v="history"><span class="i"><svg viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M8 3v4M16 3v4M3 10h18"/></svg></span>Calendario</button>
  <button type="button" class="tab" data-v="progress"><span class="i"><svg viewBox="0 0 24 24"><path d="M4 19V5M4 19h16M8 16l3-4 3 2 4-6"/></svg></span>Progreso</button>
  <button type="button" class="tab" data-v="settings"><span class="i"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M12 3v3M12 18v3M3 12h3M18 12h3M5.6 5.6l2.1 2.1M16.3 16.3l2.1 2.1M18.4 5.6l-2.1 2.1M7.7 16.3l-2.1 2.1"/></svg></span>Ajustes</button>
</nav>

<div id="planov">
  <div class="ovcard">
    <div class="ovhead"><div class="t" id="planTitle">Asignar rutina</div><div class="x" onclick="closePlan()"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg></div></div>
    <div id="planBody" class="planbody"></div>
  </div>
</div>

<div id="swapov">
  <div class="ovcard">
    <div class="ovhead"><div class="t" id="swapTitle">Cambiar ejercicio</div><div class="x" onclick="closeSwap()"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg></div></div>
    <div id="swapBody" class="planbody"></div>
  </div>
</div>

<div id="toast" class="toast" role="status" aria-live="polite"></div>

<div id="finov">
  <div class="ovcard">
    <div class="ovhead"><div class="t" id="finTitle">Resumen de la sesión</div><div class="x" onclick="closeFinish()"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg></div></div>
    <div id="finBody" class="planbody"></div>
  </div>
</div>

<script src="figuras.js"></script>
<script src="poses.js"></script>
<script src="figura.js"></script>
<script>
const DIAG = {};   /* se rellena desde figuras.js */
const FRAMES={};
/* ==== DATOS ================================================
   Fuente unica de verdad. Antes esto eran cinco literales mas
   una cola de dieciseis mutaciones en runtime al final del
   archivo, asi que no habia forma de saber cuantas series
   tenia un ejercicio sin ejecutar la app. */
const VID={
abduccion_banda:"qgwrbh4T1m0", abductores_maquina:"2KkuFEf7aZs|v", aductores_maquina:"76uNT_VMhPI|v",
apertura_toracica_rack:"0RwQ5m-fjNA", aperturas_db:"FBaAsqAsQsc|v", balanceo_pierna_frontal:"qkPcARrI-F0",
balanceo_pierna_lateral:"6aw8CAH_65Y", banda_pull_apart:"A9Ep05sIW-M", bird_dog:"JM9MLYqMLjs|v",

bisagra_cadera_pie:{name:"Bisagra de cadera de pie",tag:"calent",type:"reps",sets:1,reps:12,rest:15,coach:"Sustituye al puente de glúteo del suelo. Sin peso.",

caminadora:{name:"Caminadora",tag:"calent",type:"cardio",sets:1,holdSec:300,rest:0,coach:"Ritmo fácil: debes poder hablar sin cortar frases. Si vienes de una rutina de postura, sáltatela: ya estás caliente.",

caminata_granjero:{name:"Caminata del granjero",tag:"carga",type:"hold",sets:2,holdSec:30,rest:45,coach:"El peso no debe balancearse: es el core el que trabaja.",

chin_tuck:{name:"Retracción cervical",tag:"diario",type:"reps",sets:2,reps:10,rest:20,

colgado_escapular:{name:"Colgado con retracción escapular",tag:"carga",type:"reps",sets:2,reps:8,rest:45,load:false,unit:"kg",coach:"Calentamiento: sin doblar codos, hunde los hombros y aguanta 2 s.",

cruce_poleas:{name:"Cruce de poleas de abajo hacia arriba",tag:"carga",type:"reps",sets:3,reps:12,rest:60,load:true,unit:"kg",coach:"Sube las manos hasta la altura de los ojos y júntalas como si abrazaras a alguien, con los hombros abajo. Si no hay dos poleas libres, hazlo a un brazo por vez en una sola: mismo vector y más rango.",

cuello_extension_manual:{name:"Extensión cervical con resistencia manual",tag:"diario",type:"reps",sets:2,reps:10,rest:30,load:false,unit:"kg",coach:"Extensores y esplenio: es lo que da grosor a la parte de atrás del cuello. Sube la presión de las manos, no las repeticiones.",

cuello_flexion_supina:{name:"Flexión cervical tumbado",tag:"diario",type:"reps",sets:2,reps:12,rest:40,load:false,unit:"kg",coach:"Flexores profundos + esternocleidomastoideo (el músculo que marca el frente del cuello). Semana 1–2 empieza con 8 reps si aparece temblor.",
  steps:["Boca arriba en la esterilla, rodillas flexionadas, hombros y lumbar pegados al suelo.","Primero mete la barbilla (doble papada) y solo entonces despega la cabeza 3–4 cm, sin sacar el mentón al frente.","Aguanta 1–2 s arriba y baja en 3 s sin llegar a apoyar del todo. Si la mandíbula se aprieta o tiembla, corta la serie."]},
cuello_lateral_manual:{name:"Inclinación lateral de cuello con resistencia",tag:"diario",type:"reps_side",sets:2,reps:8,rest:15,load:false,unit:"kg",coach:"8 por lado. Da anchura al cuello visto de frente. Descanso corto porque cada lado descansa mientras trabaja el otro.",

curl_concentrado:{name:"Curl concentrado",tag:"carga",type:"reps_side",sets:2,reps:12,rest:60,load:true,unit:"kg",coach:"12 por brazo, codo apoyado en el muslo y sin balanceo.",

elevacion_pantorrilla:{name:"Elevación de gemelos",tag:"carga",type:"reps",sets:4,reps:15,rest:45,load:true,unit:"kg",coach:"Pausa arriba en punta de pie y estiramiento completo abajo.",

elevaciones_laterales:{name:"Elevaciones laterales",tag:"carga",type:"reps",sets:4,reps:15,rest:60,load:true,unit:"kg",coach:"Poco peso y cero impulso; sube hasta la altura del hombro.",

encogimientos_db:{name:"Encogimientos de hombros con mancuernas",tag:"diario",type:"reps",sets:4,reps:12,rest:60,load:true,unit:"kg",coach:"Las mancuernas más pesadas que tengas. Es el ejercicio que más cambia la silueta hombro-cuello. Sube peso cuando llegues a 15 reps limpias.",

equilibrio_unipodal:{name:"Equilibrio a una pierna",tag:"diario",type:"hold_side",sets:2,holdSec:20,rest:20,coach:"Cuando aguantes los 20 segundos sin tambalearte, cierra los ojos.",

extension_cuadriceps:{name:"Extensión de cuádriceps",tag:"carga",type:"reps",sets:3,reps:12,rest:75,load:true,unit:"kg",coach:"Pausa 1 s arriba; la última serie al fallo técnico.",

extension_toracica:{name:"Extensión torácica sobre bloque",tag:"diario",type:"reps",sets:2,reps:10,rest:20,coach:"Calentamiento: abre la espalda alta sin forzar la lumbar.",

extension_triceps_db:{name:"Extensión de tríceps sobre la cabeza",tag:"carga",type:"reps",sets:3,reps:12,rest:65,load:true,unit:"kg",coach:"Sobre la cabeza: estira bien abajo, ahí crece la porción larga.",

extension_triceps_polea:{name:"Extensión de tríceps en polea",tag:"carga",type:"reps",sets:3,reps:15,rest:60,load:true,unit:"kg",coach:"Pega los codos a las costillas y no los muevas: solo debe abrirse el antebrazo.",
