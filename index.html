/* ================= Dashboard de progreso (v19) ================= */
const GYMKEYS=["gym_empuje","gym_tiron","gym_pierna"];
const MUSC={press_banca_db:{pecho:1,triceps:.5,hombro:.5},fondos_paralelas:{pecho:1,triceps:1},pec_deck:{pecho:1},
 cruce_poleas:{pecho:1},flexiones:{pecho:1,triceps:.5,hombro:.5},fondos_banco:{triceps:1,pecho:.5},
 press_hombro_db:{hombro:1,triceps:.5},elevaciones_laterales:{hombro:1},reverse_fly:{hombro:.5,espalda:.5},
 rotacion_externa_db:{hombro:.5},extension_triceps_polea:{triceps:1},extension_triceps_db:{triceps:1},
 jalon_pecho:{espalda:1,biceps:.5},remo_maquina:{espalda:1,biceps:.5},remo_db:{espalda:1,biceps:.5},
 remo_polea:{espalda:1,biceps:.5},remo_invertido:{espalda:1,biceps:.5},colgado_escapular:{espalda:.5},
 curl_barra:{biceps:1},curl_martillo_cruzado:{biceps:1},curl_predicador:{biceps:1},curl_biceps_db:{biceps:1},
 curl_concentrado:{biceps:1},prensa_inclinada:{cuadriceps:1,gluteo:.5},hack_squat:{cuadriceps:1,gluteo:.5},
 sentadilla_smith:{cuadriceps:1,gluteo:.5},sentadilla_goblet:{cuadriceps:1,gluteo:.5},sentadilla_bulgara:{cuadriceps:1,gluteo:.5},
 zancadas_db:{cuadriceps:1,gluteo:.5},extension_cuadriceps:{cuadriceps:1},curl_femoral:{isquios:1},
 peso_muerto_rumano_db:{isquios:1,gluteo:.5},maquina_gluteo:{gluteo:1,isquios:.5},hip_thrust_db:{gluteo:1,isquios:.5},
 abductores_maquina:{gluteo:.5},aductores_maquina:{aductores:1},elevacion_pantorrilla:{gemelo:1},encogimientos_db:{trapecio_cuello:1}};
const MUSCNAME={pecho:"Pecho",espalda:"Espalda",hombro:"Hombro",triceps:"Tríceps",biceps:"Bíceps",cuadriceps:"Cuádriceps",
 isquios:"Isquios",gluteo:"Glúteo",gemelo:"Gemelo",aductores:"Aductores",trapecio_cuello:"Trapecio/cuello"};
const MUSCGOAL={pecho:10,espalda:10,cuadriceps:10,hombro:8,biceps:8,triceps:8,gluteo:8,isquios:8,gemelo:6,aductores:6,trapecio_cuello:6};

function dOffset(n){const d=new Date();d.setDate(d.getDate()-n);return ds(d);}
function warmIds(){const s={};GYMKEYS.forEach(k=>{((ROUTINES[k]||{}).warm||[]).forEach(id=>s[id]=1);});return s;}
function histRows(){return loadHist().map(x=>{let d=null;
   if(x.iso){try{d=ds(new Date(x.iso));}catch(e){}}
   if(!d&&x.date&&x.date.indexOf("/")>0){const p=x.date.split("/");d=p[2]+"-"+p[1].padStart(2,"0")+"-"+p[0].padStart(2,"0");}
   return d?{key:x.key,name:x.name,date:d}:null;}).filter(Boolean);}
function e1rm(w,r){return w*(1+r/30);}
function median(a){if(!a.length)return 0;const s=a.slice().sort((x,y)=>x-y),m=s.length>>1;return s.length%2?s[m]:(s[m-1]+s[m])/2;}

/* --- indice de fuerza (e1RM normalizado, base 100) --- */
function strengthIdx(cut){const logs=loadLogs(),warm=warmIds(),vals=[];
  Object.keys(logs).forEach(id=>{const e=EX[id];if(!e||e.load!==true||warm[id])return;
    const recs=logs[id].filter(r=>!cut||r.date<=cut);if(recs.length<3)return;
    const pts=[];recs.forEach(r=>{let best=0;(r.sets||[]).forEach(s=>{if((s.w||0)>0&&s.reps<=12){const v=e1rm(s.w,s.reps);if(v>best)best=v;}});
      if(best>0)pts.push({date:r.date,v:best});});
    if(pts.length<3)return;
    const base=median(pts.slice(0,3).map(p=>p.v));if(!base)return;
    const last=pts[pts.length-1];
    const lim=cut||today();const d21=new Date(lim);d21.setDate(d21.getDate()-21);
    if(last.date<ds(d21))return;
    vals.push(100*last.v/base);});
  return vals.length?{idx:vals.reduce((a,b)=>a+b,0)/vals.length,n:vals.length}:null;}
function strengthSpark(){const out=[];for(let w=11;w>=0;w--){const r=strengthIdx(dOffset(w*7));if(r)out.push(r.idx);}return out;}

/* --- peso corporal --- */
function loadBW(){return jget("rp_bw",[]).slice().sort((a,b)=>a.date<b.date?-1:1);}
function addBW(){const el=$("bwin");if(!el)return;const v=parseFloat(el.value);if(isNaN(v)||v<=0||v>400)return;
  const arr=loadBW(),t=today(),i=arr.findIndex(x=>x.date===t);
  if(i>=0)arr[i].kg=v;else arr.push({date:t,kg:Math.round(v*10)/10});
  jset("rp_bw",arr);renderProgress();}
function ma7(arr,day){const end=new Date(day),st=new Date(day);st.setDate(st.getDate()-6);
  const w=arr.filter(x=>x.date>=ds(st)&&x.date<=ds(end));
  return w.length>=3?w.reduce((a,b)=>a+b.kg,0)/w.length:null;}
function bwRate(arr){const pts=[];for(let i=27;i>=0;i--){const d=dOffset(i),m=ma7(arr,d);if(m!=null)pts.push({x:27-i,y:m});}
  if(pts.length<8)return null;
  const n=pts.length,sx=pts.reduce((a,p)=>a+p.x,0),sy=pts.reduce((a,p)=>a+p.y,0),
        sxy=pts.reduce((a,p)=>a+p.x*p.y,0),sxx=pts.reduce((a,p)=>a+p.x*p.x,0);
  const slope=(n*sxy-sx*sy)/(n*sxx-sx*sx);const kgw=slope*7;const cur=pts[pts.length-1].y;
  return {kgw:kgw,pct:100*kgw/cur,cur:cur};}

/* --- series por musculo --- */
function weekStart(off){const d=new Date();const dow=(d.getDay()+6)%7;d.setDate(d.getDate()-dow-7*off);return ds(d);}
function muscleSets(fromDate,toDate){const logs=loadLogs(),warm=warmIds(),m={};
  Object.keys(logs).forEach(id=>{const f=MUSC[id];if(!f)return;
    logs[id].forEach(r=>{if(r.date<fromDate||r.date>toDate)return;
      const n=(r.sets||[]).filter(s=>(s.reps||0)>=1).length;if(!n)return;
      if(warm[id]&&n<3)return;
      Object.keys(f).forEach(k=>{m[k]=(m[k]||0)+n*f[k];});});});
  return m;}

/* --- records (dominancia de Pareto) --- */
function prFeed(days){const logs=loadLogs(),warm=warmIds(),out=[],from=dOffset(days);
  Object.keys(logs).forEach(id=>{const e=EX[id];if(!e||warm[id])return;
    const recs=logs[id].slice().sort((a,b)=>a.date<b.date?-1:1);const prev=[];
    recs.forEach((r,ri)=>{(r.sets||[]).forEach(s=>{
      const loaded=e.load===true;
      const dom=prev.some(p=>loaded?(p.w>=s.w&&p.reps>=s.reps):(p.reps>=s.reps));
      if(!dom&&ri>0&&r.date>=from){
        const bestSame=prev.filter(p=>p.w===s.w).reduce((a,p)=>Math.max(a,p.reps),0);
        const txt=loaded?(bestSame?("+"+(s.reps-bestSame)+" reps a "+fmtW(s.w)+" kg"):(fmtW(s.w)+" kg × "+s.reps)):(s.reps+" reps");
        out.push({id:id,name:e.name,date:r.date,txt:txt});}
      prev.push({w:s.w||0,reps:s.reps||0});});});});
  return out.sort((a,b)=>a.date<b.date?1:-1);}

/* --- constancia --- */
function adherence(){const rows=histRows(),from=dOffset(27),plan=loadPlan();
  const planned=plan.filter(v=>GYMKEYS.indexOf(v)>=0).length*4;
  const seen={};rows.forEach(r=>{if(GYMKEYS.indexOf(r.key)>=0&&r.date>=from)seen[r.key+"|"+r.date]=1;});
  const done=Object.keys(seen).length;
  return {planned:planned,done:done,pct:planned?Math.round(100*done/planned):null};}
function heatCells(){const rows=histRows(),map={};
  rows.forEach(r=>{const g=GYMKEYS.indexOf(r.key)>=0?"g":"c";map[r.date]=map[r.date]&&map[r.date]!==g?"b":g;});
  const out=[];for(let i=83;i>=0;i--){const d=dOffset(i);out.push({d:d,t:map[d]||""});}return out;}

function heatmap(cells){let h='<div class="heat">';
  cells.forEach(c=>{h+='<i class="h-'+(c.t||"n")+'" title="'+c.d+'"></i>';});
  return h+'</div>';}
function bars(items){let h='<div class="mbars">';
  items.forEach(it=>{const pct=Math.min(100,Math.round(100*it.v/Math.max(it.goal*1.6,1)));
    const gmin=Math.round(100*it.goal/Math.max(it.goal*1.6,1));
    h+='<div class="mrow"><span class="mn">'+it.name+'</span><span class="mtrack"><i class="mgoal" style="left:'+gmin+'%"></i>'
      +'<i class="mfill '+it.cls+'" style="width:'+pct+'%"></i></span><span class="mv">'+(Math.round(it.v*10)/10)+'</span></div>';});
  return h+'</div>';}

function renderProgress(){
  const s=loadStreak(),logs=loadLogs(),rows=histRows(),bw=loadBW();
  let b="";

  /* 1 · indice de fuerza */
  const now=strengthIdx(null),prev=strengthIdx(dOffset(28)),spark=strengthSpark();
  b+='<div class="heroP">';
  if(now){const dlt=prev?Math.round(now.idx-prev.idx):null;
    b+='<div class="hkick">Índice de fuerza</div><div class="hbig">'+Math.round(now.idx)+'</div>';
    if(dlt!==null&&dlt!==0)b+='<span class="delta '+(dlt>0?'up':'down')+'">'+(dlt>0?'↑ +':'↓ ')+Math.abs(dlt)+' pts vs. hace 4 semanas</span>';
    b+='<div class="hsub">Base 100 = tus primeras sesiones · '+now.n+' ejercicios</div>';
    if(spark.length>2)b+=chart(spark,"pts");
    const rate=bw.length?bwRate(bw):null;
    let verd="";
    if(!prev)verd="Aún faltan datos para comparar. Sigue registrando.";
    else if(now.idx>prev.idx+1&&rate&&rate.kgw>0.05)verd="Fuerza y peso suben a la vez: estás ganando masa.";
    else if(now.idx>prev.idx+1&&rate&&Math.abs(rate.kgw)<=0.05)verd="Levantas más pero no pesas más: sube un poco la comida.";
    else if(now.idx>prev.idx+1)verd="Tu fuerza sube. Registra tu peso para saber si es masa.";
    else if(rate&&rate.kgw<-0.05)verd="Estás perdiendo peso: en fase de masa eso frena la ganancia.";
    else verd="Fuerza estable. Mira abajo qué músculo lleva más semanas sin récord.";
    b+='<div class="hverd">'+verd+'</div>';
  }else{
    b+='<div class="hkick">Índice de fuerza</div><div class="hbig">—</div><div class="hsub">Necesitas al menos 3 sesiones registradas de un mismo ejercicio con peso.</div>';}
  b+='</div>';

  /* 4 · records */
  const prs=prFeed(30);
  b+='<div class="grouptitle">'+ic("trophy","xs")+' Récords recientes</div>';
  if(!prs.length){b+='<div class="empty" style="padding:18px 12px">Cuando superes una marca anterior aparecerá aquí.</div>';}
  else{b+='<div class="chartcard"><div class="cs" style="margin:0 0 8px"><b>'+prs.length+'</b> récords en 30 días</div>';
    prs.slice(0,5).forEach(p=>{const dd=Math.round((new Date(today())-new Date(p.date))/86400000);
      b+='<div class="prrow"><span class="prn">'+esc(p.name)+'</span><span class="prv">'+p.txt+'</span><span class="prd">'+(dd===0?"hoy":("hace "+dd+" d"))+'</span></div>';});
    b+='</div>';}

  /* 2 · peso corporal */
  b+='<div class="grouptitle">Peso corporal</div><div class="chartcard">';
  const rate=bw.length?bwRate(bw):null;
  if(rate){const cls=(rate.pct>=0.25&&rate.pct<=0.5)?"up":((rate.pct<0||rate.pct>0.75)?"down":"");
    b+='<div class="cthead"><div class="ct">'+fmtW(Math.round(rate.cur*10)/10)+' kg</div><span class="delta '+(cls||"up")+'">'
      +(rate.kgw>=0?"+":"")+fmtW(Math.round(rate.kgw*100)/100)+' kg/sem</span></div>';
    b+='<div class="cs">'+(rate.pct>=0.25&&rate.pct<=0.5?"Ritmo ideal para ganar masa limpia.":
      (rate.pct>0.75?"Vas muy rápido: buena parte será grasa.":(rate.pct<0?"Estás bajando de peso.":"Vas lento para ganar masa.")))+'</div>';
    const serie=[];for(let i=55;i>=0;i-=1){const m=ma7(bw,dOffset(i));if(m!=null)serie.push(Math.round(m*10)/10);}
    if(serie.length>2)b+=chart(serie,"kg");
  }else{b+='<div class="cs">Pésate en ayunas casi todos los días. Con 2 semanas te digo tu ritmo real (el día a día oscila ±1 kg por agua y sal).</div>';}
  b+='<div class="bwrow"><input id="bwin" type="number" inputmode="decimal" step="0.1" placeholder="Peso de hoy (kg)"><button class="minibtn" onclick="addBW()">Guardar</button></div>';
  if(bw.length)b+='<div class="cs" style="margin-top:6px">'+bw.length+' pesajes registrados · último '+bw[bw.length-1].kg+' kg</div>';
  b+='</div>';

  /* 3 · por musculo */
  const wk=muscleSets(weekStart(0),today());
  const m4={};for(let w=0;w<4;w++){const st=weekStart(w),en=w===0?today():ds(new Date(new Date(weekStart(w-1)).getTime()-86400000));
    const mm=muscleSets(st,en);Object.keys(mm).forEach(k=>{m4[k]=(m4[k]||0)+mm[k];});}
  const muscles=Object.keys(MUSCGOAL).filter(k=>(m4[k]||0)>0||(wk[k]||0)>0);
  b+='<div class="grouptitle">Series por músculo · esta semana</div>';
  if(!muscles.length){b+='<div class="empty" style="padding:18px 12px">Registra tus series en el gimnasio y aquí verás si cada músculo recibe suficiente trabajo.</div>';}
  else{
    const items=muscles.map(k=>{const v=wk[k]||0,g=MUSCGOAL[k],avg=(m4[k]||0)/4;
      return {key:k,name:MUSCNAME[k]||k,v:v,goal:g,avg:avg,def:g-avg,cls:avg>=g?"ok":(avg>=g*0.6?"mid":"low")};})
      .sort((a,c)=>c.def-a.def);
    const worst=items[0];
    if(worst&&worst.def>1)b+='<div class="callout">Tu punto débil: <b>'+worst.name+'</b> — '+(Math.round(worst.avg*10)/10)+' series/semana, objetivo '+worst.goal+'.</div>';
    b+='<div class="chartcard">'+bars(items)+'<div class="cs" style="margin-top:8px">Barra = series de esta semana · la marca es tu objetivo semanal.</div></div>';}

  /* 5 · constancia */
  const ad=adherence();
  b+='<div class="grouptitle">Constancia · 28 días</div><div class="chartcard">';
  b+='<div class="cthead"><div class="ct">'+ad.done+(ad.planned?' de '+ad.planned:'')+' entrenos de gimnasio</div>'
    +(ad.pct!==null?'<span class="delta '+(ad.pct>=85?"up":(ad.pct>=60?"":"down"))+'">'+ad.pct+'%</span>':'')+'</div>';
  b+='<div class="cs">'+(ad.planned?'Según tu plan semanal.':'Asigna tus días en Inicio → Tu semana para medir la adherencia.')+'</div>';
  b+=heatmap(heatCells());
  b+='<div class="cs" style="margin-top:8px">12 semanas · <i class="hleg h-g"></i> gimnasio <i class="hleg h-c"></i> postura/cuello</div></div>';

  /* 6 · postura y cuello */
  const from28=dOffset(27),pdays={};rows.forEach(r=>{if(GYMKEYS.indexOf(r.key)<0&&r.date>=from28)pdays[r.date]=1;});
  b+='<div class="grouptitle">Postura y cuello</div><div class="chartcard"><div class="ct">'+Object.keys(pdays).length+' de 28 días</div>'
    +'<div class="cs">Aquí lo que importa es la frecuencia, no la carga.</div></div>';

  /* 7 · racha */
  b+='<div class="grouptitle">Tu historial</div><div class="chartcard"><div class="cs">Racha de '+(s.count||0)+' días · mejor '+(s.best||0)
    +'<br>'+(s.total||0)+' sesiones · '+rows.filter(r=>GYMKEYS.indexOf(r.key)>=0).length+' de gimnasio'
    +'<br>'+Object.keys(logs).reduce((a,k)=>a+logs[k].reduce((x,r)=>x+(r.sets||[]).length,0),0)+' series registradas</div></div>';

  $("progBody").innerHTML=b;}

applyTheme(loadTheme());renderHome();
(function(){var st=history.state;
  if(st&&st.v==="routine"&&st.k&&ROUTINES[st.k]){openRoutine(st.k,true);}
  else if(st&&st.v==="guided"&&st.k&&ROUTINES[st.k]){resumeGuided(st.k);}
  else if(st&&(st.v==="history"||st.v==="progress"||st.v==="settings")){show(st.v);if(st.v==="history")renderHistory();if(st.v==="progress")renderProgress();if(st.v==="settings")renderSettings();}
  else{try{history.replaceState({v:"home"},"");}catch(e){}}
})();
