<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#f4f6f5">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-192.png">
<title>Mi Rutina</title>
<script>try{var _t=JSON.parse(localStorage.getItem("rp_theme"));if(_t==="light"||_t==="dark")document.documentElement.setAttribute("data-theme",_t);}catch(e){}</script>
<style>
  :root{
    /* ---- Tema claro "Sereno" (por defecto) ---- */
    --bg:#f4f6f5; --bg2:#eef2f0; --card:#ffffff; --card2:#f8faf9; --sunk:#eef1f0;
    --line:#e2e8e5; --line2:#cdd6d2;
    --tx:#16211d; --tx2:#4a5a54; --mut:#6b7c74;
    --primary:#0f9d76; --primary2:#0c8163; --primary-tint:#e2f4ee; --on-primary:#ffffff;
    --accent:#5b8def; --accent-tint:#e8effc; --accent-ink:#1f4fa8;
    --rest:#e08a2b; --rest-tint:#fbefdd;
    --load:#7c6bd6; --load2:#6553bf; --load-tint:#ece8fb; --load-ink:#3a2f6b;
    --danger:#d1544f; --danger-tint:#fbe9e8;
    --diagram-ink:#2f4a41; --diagram-line:#c4d2cc; --diagram-hi:#0f9d76; --diagram-eye:#16211d;
    --diagram-bg:#eef1f0; --ring-track:#e2e8e5;
    --nav-bg:rgba(255,255,255,.92); --page-grad:#ffffff;
    --r-sm:12px; --r-md:16px; --r-lg:22px; --r-pill:999px;
    --sh-card:0 2px 10px rgba(22,33,29,.06); --sh-raised:0 8px 22px rgba(15,157,118,.16);
    --sh-focus:0 0 0 3px rgba(15,157,118,.25);
    /* alias legacy: no romper reglas existentes */
    --go:var(--primary); --go2:var(--primary2); --sky:var(--accent); --blue:var(--accent);
    --purple:var(--load); --amber:var(--rest); --slate:var(--mut);
  }
  :root[data-theme="dark"]{
    --bg:#0b1220; --bg2:#0e1826; --card:#152130; --card2:#1c2c3e; --sunk:#0e1a28;
    --line:#26374a; --line2:#37475c;
    --tx:#f1f6fb; --tx2:#c5d2dc; --mut:#93a7ba;
    --primary:#34d399; --primary2:#0e9f6e; --primary-tint:#123528; --on-primary:#04231b;
    --accent:#38bdf8; --accent-tint:#0e2436; --accent-ink:#7dbaf5;
    --rest:#f59e0b; --rest-tint:#3a2a10;
    --load:#a78bfa; --load2:#8b6df0; --load-tint:#241a44; --load-ink:#c3b3fb;
    --danger:#fca5a5; --danger-tint:#2a1414;
    --diagram-ink:#cfeede; --diagram-line:#3a5069; --diagram-hi:#5fe39a; --diagram-eye:#0c1524;
    --diagram-bg:#0e1a28; --ring-track:#22303c;
    --nav-bg:rgba(11,18,32,.92); --page-grad:#14243a;
    --sh-card:0 2px 10px rgba(0,0,0,.28); --sh-raised:0 8px 22px rgba(0,0,0,.4);
    --sh-focus:0 0 0 3px rgba(52,211,153,.3);
  }
  @media (prefers-color-scheme:dark){
    :root:not([data-theme="light"]){
      --bg:#0b1220; --bg2:#0e1826; --card:#152130; --card2:#1c2c3e; --sunk:#0e1a28;
      --line:#26374a; --line2:#37475c;
      --tx:#f1f6fb; --tx2:#c5d2dc; --mut:#93a7ba;
      --primary:#34d399; --primary2:#0e9f6e; --primary-tint:#123528; --on-primary:#04231b;
      --accent:#38bdf8; --accent-tint:#0e2436; --accent-ink:#7dbaf5;
      --rest:#f59e0b; --rest-tint:#3a2a10;
      --load:#a78bfa; --load2:#8b6df0; --load-tint:#241a44; --load-ink:#c3b3fb;
      --danger:#fca5a5; --danger-tint:#2a1414;
      --diagram-ink:#cfeede; --diagram-line:#3a5069; --diagram-hi:#5fe39a; --diagram-eye:#0c1524;
      --diagram-bg:#0e1a28; --ring-track:#22303c;
      --nav-bg:rgba(11,18,32,.92); --page-grad:#14243a;
      --sh-card:0 2px 10px rgba(0,0,0,.28); --sh-raised:0 8px 22px rgba(0,0,0,.4);
      --sh-focus:0 0 0 3px rgba(52,211,153,.3);
    }
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;padding:0;background:
    radial-gradient(1200px 500px at 50% -10%, #14243a 0%, var(--bg) 60%) fixed;
    color:var(--tx);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,system-ui,sans-serif;
    -webkit-font-smoothing:antialiased;-webkit-text-size-adjust:100%;text-size-adjust:100%}
  body{max-width:600px;margin:0 auto;min-height:100vh;overflow-x:hidden}
  .app{padding:0 0 96px}
  .view{display:none;animation:fade .25s ease} .view.active{display:block}
  @keyframes fade{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
  h1{font-size:23px;margin:0;font-weight:800;letter-spacing:-.4px}
  .mut{color:var(--mut)}

  .head{padding:22px 18px 6px;display:flex;align-items:center;gap:12px}
  .head img{width:38px;height:38px;border-radius:11px}
  .head .sub{color:var(--mut);font-size:13px;margin-top:1px}

  .stats{display:flex;gap:10px;margin:14px 18px 6px}
  .stat{flex:1;background:linear-gradient(150deg,#12261d,#132f24);border:1px solid #1e4a37;
    border-radius:16px;padding:12px 14px}
  .stat.b2{background:linear-gradient(150deg,#111f33,#122842);border-color:#1d3d63}
  .stat.b3{background:linear-gradient(150deg,#1c1633,#241a44);border-color:#372a63}
  .stat .v{font-size:24px;font-weight:800;line-height:1}
  .stat .l{color:var(--mut);font-size:11px;margin-top:5px;font-weight:600}

  .install{display:none;margin:12px 18px 0;background:#10233a;border:1px solid #1d3b5c;
    border-radius:14px;padding:11px 14px;font-size:13px;align-items:center;gap:10px}
  .install button{margin-left:auto;background:var(--sky);color:#04121d;border:none;
    border-radius:9px;padding:8px 12px;font-weight:800;font-size:13px}

  .grouptitle{margin:22px 18px 8px;font-size:13px;font-weight:800;color:var(--mut);
    text-transform:uppercase;letter-spacing:1px}
  .rcard{margin:0 18px 10px;background:var(--card);border:1px solid var(--line);border-radius:18px;
    padding:16px;display:flex;gap:14px;align-items:center;cursor:pointer;transition:.15s}
  .rcard:active{transform:scale(.99)}
  .rcard .em{width:48px;height:48px;border-radius:14px;display:flex;align-items:center;
    justify-content:center;font-size:24px;flex:0 0 auto}
  .rcard .em.p{background:linear-gradient(150deg,#123528,#0e9f6e33)}
  .rcard .em.n{background:linear-gradient(150deg,#122842,#38bdf833)}
  .rcard .t{flex:1;min-width:0}
  .rcard .nm{font-weight:800;font-size:16px}
  .rcard .ds{color:var(--mut);font-size:12.5px;margin-top:3px;line-height:1.4}
  .rcard .go{color:var(--mut);font-size:22px}

  /* routine detail */
  .bar{display:flex;align-items:center;gap:12px;padding:18px 16px 8px}
  .icbtn{width:40px;height:40px;border-radius:12px;background:var(--card);border:1px solid var(--line);
    color:var(--tx);font-size:19px;display:flex;align-items:center;justify-content:center;cursor:pointer;flex:0 0 auto}
  .bar .ttl{font-size:19px;font-weight:800}
  .exwrap{margin:6px 16px}
  .ex{background:var(--card);border:1px solid var(--line);border-radius:16px;margin-bottom:10px;overflow:hidden}
  .ex .top{display:flex;gap:12px;align-items:center;padding:12px;cursor:pointer}
  .diag{width:66px;height:52px;border-radius:11px;background:#0e1a28;border:1px solid var(--line);
    flex:0 0 auto;display:flex;align-items:center;justify-content:center;padding:4px}
  .diag svg{width:100%;height:100%}
  .ex .nm{font-weight:700;font-size:15px;line-height:1.2}
  .ex .meta{color:var(--mut);font-size:12px;margin-top:3px}
  .badges{display:flex;gap:6px;flex-wrap:wrap;margin-top:6px}
  .badge{font-size:10px;font-weight:800;padding:2px 8px;border-radius:20px;letter-spacing:.2px}
  .b-diario{background:#122c4a;color:#7dbaf5} .b-carga{background:#241a44;color:#c3b3fb}
  .b-calent{background:#232c34;color:#9fb0bd} .b-opcional{background:#3a2a10;color:#f4c37a}
  .chev{color:var(--mut);font-size:16px;flex:0 0 auto;transition:.2s}
  .ex.open .chev{transform:rotate(90deg)}
  .ex .panel{display:none;padding:0 14px 14px}
  .ex.open .panel{display:block}
  .steps{list-style:none;margin:6px 0 0;padding:0;counter-reset:s}
  .steps li{position:relative;padding:7px 0 7px 34px;color:#d3dfea;font-size:13.5px;line-height:1.5;border-top:1px solid #1b2836}
  .steps li:before{counter-increment:s;content:counter(s);position:absolute;left:0;top:7px;width:22px;height:22px;
    background:var(--go2);color:#03130c;border-radius:50%;font-size:12px;font-weight:800;display:flex;align-items:center;justify-content:center}
  .vbtn{display:inline-flex;align-items:center;gap:8px;background:var(--card2);border:1px solid var(--line);
    color:var(--tx);border-radius:10px;padding:9px 13px;font-size:13.5px;font-weight:700;cursor:pointer;margin-top:12px}

  .cta{position:sticky;bottom:0;padding:12px 16px calc(12px + env(safe-area-inset-bottom));
    background:linear-gradient(0deg,var(--bg) 60%,transparent)}
  .btn{display:block;width:100%;border:none;border-radius:15px;padding:17px;font-size:16px;font-weight:800;
    cursor:pointer;color:#03130c;background:linear-gradient(135deg,var(--go),var(--go2));
    box-shadow:0 8px 22px rgba(16,185,129,.28)}
  .btn:active{transform:translateY(1px)}
  .btn[disabled]{opacity:.45;box-shadow:none;cursor:default}
  .cta2{display:flex;flex-direction:column;gap:8px}
  .ctanote{font-size:12px;font-weight:800;color:var(--primary);text-align:center;padding:0}
  .btn.sec{background:var(--card);color:var(--tx);border:1px solid var(--line);box-shadow:none}

  /* guided */
  #guided{padding-bottom:20px}
  .gtop{display:flex;align-items:center;gap:10px;padding:16px 16px 6px}
  .pbar{flex:1;height:9px;background:var(--card);border-radius:20px;overflow:hidden}
  .pbar>i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--go),var(--sky));transition:width .35s}
  .gcount{color:var(--mut);font-size:12px;font-weight:800}
  .stage{padding:6px 18px 26px}
  .setlab{color:var(--go);font-weight:800;font-size:14px;margin-top:8px}
  .exname{font-size:25px;font-weight:800;letter-spacing:-.4px;margin:4px 0 12px;line-height:1.12}
  .gdiag{width:100%;height:172px;background:#0e1a28;border:1px solid var(--line);border-radius:16px;
    display:flex;align-items:center;justify-content:center;padding:12px;margin-bottom:6px}
  .gdiag svg{height:100%;width:auto;max-width:100%}
  .caveatbox{background:#3a2a10;border:1px solid #6b4c17;color:#f4c37a;font-size:12.5px;
    border-radius:11px;padding:10px 12px;margin:10px 0;line-height:1.5}
  .videobox{margin:12px 0 2px;border-radius:14px;overflow:hidden;background:#000;display:none}
  .videobox.show{display:block}
  .ratio{position:relative;width:100%;padding-top:56.25%}
  .ratio iframe{position:absolute;inset:0;width:100%;height:100%;border:0}
  .ytlink{display:inline-block;color:var(--sky);font-size:12.5px;margin:8px 2px 0;text-decoration:none}
  .glist{list-style:none;margin:14px 0 0;padding:0;counter-reset:s}
  .glist li{position:relative;padding:8px 0 8px 34px;color:#d8e3ee;font-size:14.5px;line-height:1.5}
  .glist li:before{counter-increment:s;content:counter(s);position:absolute;left:0;top:7px;width:23px;height:23px;
    background:var(--go2);color:#03130c;border-radius:50%;font-size:12px;font-weight:800;display:flex;align-items:center;justify-content:center}
  .target{text-align:center;font-size:21px;font-weight:800;margin:18px 0 4px}
  .target small{display:block;color:var(--mut);font-size:13px;font-weight:600;margin-top:4px}
  .ring{position:relative;width:200px;height:200px;margin:14px auto 0}
  .ring .val{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center}
  .ring .val b{font-size:54px;font-weight:800;font-variant-numeric:tabular-nums}
  .ring .val span{color:var(--mut);font-size:12px;font-weight:700;margin-top:2px}
  .phaselab{text-align:center;color:var(--mut);font-size:14px;font-weight:800;margin-bottom:4px}
  .timer{font-size:60px;font-weight:800;text-align:center;margin:22px 0 4px;font-variant-numeric:tabular-nums}
  .timer.rest{color:var(--rest)}
  .gbtn{width:100%;border:none;border-radius:15px;padding:17px;font-size:16px;font-weight:800;cursor:pointer;margin-top:10px}
  .gbtn.go{background:linear-gradient(135deg,var(--go),var(--go2));color:#03130c}
  .gbtn.rest{background:linear-gradient(135deg,#f59e0b,#d97706);color:#241400}
  .gbtn.sec{background:var(--card);color:var(--tx);border:1px solid var(--line)}
  .skip{display:block;width:100%;text-align:center;background:none;border:none;color:var(--mut);
    font-size:13.5px;font-weight:700;margin-top:14px;cursor:pointer;padding:8px}

  /* completion */
  .done{text-align:center;padding:46px 22px}
  .done .em{font-size:64px}
  .done h2{font-size:27px;margin:10px 0 4px}
  .done .big{font-size:46px;font-weight:800;color:var(--go);margin:14px 0 0}

  /* history + settings */
  .sect{padding:6px 18px 20px}
  .hitem{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px 14px;
    margin-bottom:9px;display:flex;align-items:center;gap:12px}
  .hitem .dot{width:38px;height:38px;border-radius:11px;background:linear-gradient(150deg,#123528,#0e9f6e33);
    display:flex;align-items:center;justify-content:center;font-size:18px;flex:0 0 auto}
  .hitem .nm{font-weight:700;font-size:14px}
  .hitem .dt{color:var(--mut);font-size:12px;margin-top:2px;text-transform:capitalize}
  .empty{color:var(--mut);text-align:center;font-size:14px;padding:36px 10px;line-height:1.6}

  .field{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;margin-bottom:12px}
  .field .fl{font-weight:800;font-size:14px;margin-bottom:3px}
  .field .fh{color:var(--mut);font-size:12.5px;line-height:1.5}
  .switch{display:flex;align-items:center;gap:10px}
  .toggle{width:48px;height:28px;border-radius:20px;background:#33465a;position:relative;cursor:pointer;flex:0 0 auto;transition:.2s}
  .toggle.on{background:var(--go2)}
  .toggle i{position:absolute;top:3px;left:3px;width:22px;height:22px;background:#fff;border-radius:50%;transition:.2s}
  .toggle.on i{left:23px}
  .timelist{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}
  .timepill{background:var(--card2);border:1px solid var(--line);border-radius:20px;padding:7px 12px;
    font-size:14px;font-weight:700;display:flex;align-items:center;gap:8px}
  .timepill span.x{color:var(--mut);cursor:pointer;font-weight:800}
  .addrow{display:flex;gap:8px;margin-top:12px}
  .addrow input{flex:1;background:#0e1a28;border:1px solid var(--line);color:var(--tx);border-radius:11px;
    padding:11px;font-size:15px}
  .addrow button{background:var(--sky);color:#04121d;border:none;border-radius:11px;padding:0 16px;font-weight:800;cursor:pointer}
  .minibtn{background:var(--card2);border:1px solid var(--line);color:var(--tx);border-radius:10px;
    padding:9px 12px;font-size:13px;font-weight:700;cursor:pointer;margin-top:10px}
  .danger{color:#fca5a5;border-color:#7f1d1d;background:#2a1414}

  /* bottom nav */
  .nav{position:fixed;bottom:0;left:0;right:0;max-width:600px;margin:0 auto;
    background:rgba(11,18,32,.92);backdrop-filter:blur(12px);border-top:1px solid var(--line);
    display:flex;padding:8px 0 calc(8px + env(safe-area-inset-bottom));z-index:30}
  .nav.hide{display:none}
  .nav a{flex:1;text-align:center;color:var(--mut);font-size:11px;font-weight:700;cursor:pointer;padding:4px}
  .nav a .i{font-size:20px;display:block;margin-bottom:2px}
  .nav a.on{color:var(--go)}

  /* video overlay */
  #ov{position:fixed;inset:0;background:rgba(4,8,12,.9);display:none;z-index:60;align-items:center;justify-content:center;padding:16px}
  #ov.show{display:flex}
  .ovcard{background:var(--card);border:1px solid var(--line);border-radius:16px;width:100%;max-width:540px;overflow:hidden}
  .ovhead{display:flex;align-items:center;gap:10px;padding:12px 14px;border-bottom:1px solid var(--line)}
  .ovhead .t{font-weight:700;font-size:14px;flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .ovhead .x{cursor:pointer;font-size:20px;color:var(--mut);width:30px;height:30px;display:flex;align-items:center;justify-content:center}
  .ovfoot{padding:10px 14px;font-size:12.5px;color:var(--mut)}
  .ovfoot a{color:var(--sky)}

  /* ============ Rediseño v4 — overrides de tema (planos, tokenizados) ============ */
  html,body{background:radial-gradient(1100px 460px at 50% -12%, var(--page-grad) 0%, var(--bg) 60%) fixed;color:var(--tx)}
  .stat,.stat.b2,.stat.b3{background:var(--card);border:1px solid var(--line);box-shadow:var(--sh-card)}
  .stat .v{color:var(--tx)} .stat .l{color:var(--mut)}
  .stat .v,.timer,#tv,.ring .val b,.gcount,.done .big,.exname,.target{font-variant-numeric:tabular-nums}
  .install{background:var(--accent-tint);border:1px solid var(--line)}
  .install button{background:var(--primary);color:var(--on-primary)}
  .rcard{box-shadow:var(--sh-card)}
  .rcard .em{background:var(--primary-tint);color:var(--primary)}
  .rcard .em.p{background:var(--primary-tint)}
  .rcard .em.n{background:var(--accent-tint);color:var(--accent-ink)}
  .rcard .go{color:var(--line2)}
  .diag,.gdiag{background:var(--diagram-bg)}
  .steps li{border-top:1px solid var(--line);color:var(--tx2)}
  .glist li{color:var(--tx2)}
  .b-diario{background:var(--accent-tint);color:var(--accent-ink)}
  .b-carga{background:var(--load-tint);color:var(--load-ink)}
  .b-calent{background:var(--sunk);color:var(--mut)}
  .b-opcional{background:var(--rest-tint);color:var(--rest)}
  .btn{background:var(--primary);color:var(--on-primary);box-shadow:var(--sh-raised)}
  .btn.sec{background:var(--card);color:var(--tx);border:1px solid var(--line);box-shadow:none}
  .steps li:before,.glist li:before{background:var(--primary);color:var(--on-primary)}
  .pbar>i{background:var(--primary)}
  .gbtn.go{background:var(--primary);color:var(--on-primary)}
  .gbtn.rest{background:var(--rest);color:#241400}
  .gbtn.sec{background:var(--card);color:var(--tx);border:1px solid var(--line)}
  .caveatbox{background:var(--rest-tint);border:1px solid var(--rest);color:var(--rest)}
  .hitem{box-shadow:var(--sh-card)}
  .hitem .dot{background:var(--primary-tint);color:var(--primary)}
  .field{box-shadow:var(--sh-card)}
  .toggle{background:var(--line2)} .toggle.on{background:var(--primary)}
  .addrow input{background:var(--sunk);color:var(--tx)}
  .addrow button{background:var(--primary);color:var(--on-primary)}
  .minibtn.danger,.danger{color:var(--danger);border-color:var(--danger);background:var(--danger-tint)}
  .nav{background:var(--nav-bg)}
  .nav a.on{color:var(--primary)}
  .icbtn{color:var(--tx2)}
  .nav a .i svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round;display:block;margin:0 auto 2px}
  /* control de tema compacto (fila de ajustes) */
  .themeseg{display:inline-flex;flex:0 0 auto;margin-left:auto;background:var(--sunk);border:1px solid var(--line);border-radius:var(--r-pill);padding:3px;gap:2px}
  .themeseg button{border:none;background:transparent;color:var(--mut);border-radius:var(--r-pill);padding:6px 11px;font-size:12px;font-weight:800;cursor:pointer;display:flex;align-items:center;gap:5px;min-height:34px}
  .themeseg button svg{width:16px;height:16px;stroke:currentColor;fill:none;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
  .themeseg button.on{background:var(--card);color:var(--primary);box-shadow:var(--sh-card)}
  /* tarjeta "Hoy" */
  .today{margin:14px 16px 4px;background:var(--card);border:1px solid var(--line);box-shadow:var(--sh-card);border-radius:var(--r-lg);padding:16px}
  .today .kick{font-size:11px;font-weight:800;letter-spacing:1px;color:var(--primary);text-transform:uppercase}
  .today .tt{font-size:21px;font-weight:800;margin-top:6px;letter-spacing:-.3px;line-height:1.15}
  .today .mt{font-size:12.5px;color:var(--mut);margin-top:4px;line-height:1.4}
  .today-go{margin-top:13px;width:100%;border:none;border-radius:var(--r-md);padding:14px;font-size:15px;font-weight:800;color:var(--on-primary);background:var(--primary);box-shadow:var(--sh-raised);cursor:pointer}
  .today-go:active{transform:translateY(1px)}
  .today-go.sec{background:var(--sunk);color:var(--tx);box-shadow:none;border:1px solid var(--line)}
  /* calendario */
  .cal{background:var(--card);border:1px solid var(--line);box-shadow:var(--sh-card);border-radius:16px;padding:12px 12px 14px;margin-bottom:14px}
  .calhead{display:flex;align-items:center;gap:8px;margin-bottom:8px}
  .calhead .m{flex:1;text-align:center;font-weight:800;font-size:15px;text-transform:capitalize}
  .calnav{width:36px;height:36px;border-radius:10px;border:1px solid var(--line);background:var(--sunk);color:var(--tx2);font-size:17px;display:flex;align-items:center;justify-content:center;cursor:pointer}
  .calgrid{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:3px}
  .calgrid .wd{text-align:center;font-size:10.5px;font-weight:800;color:var(--mut);padding:2px 0 4px}
  .calcell{min-width:0;min-height:44px;padding:3px 0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;cursor:pointer}
  .calcell.empty{visibility:hidden}
  .calcell .dnum{width:32px;height:32px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:700;color:var(--tx2)}
  .calcell.has .dnum{color:var(--tx)}
  .calcell .dots{display:flex;gap:3px;height:6px;align-items:center}
  .calcell .cdot{width:6px;height:6px;border-radius:50%;flex:0 0 auto}
  .cdot.p{background:var(--primary)} .cdot.n{background:var(--accent)} .cdot.g{background:var(--load)}
  .callegend{display:flex;gap:14px;justify-content:center;margin:10px 0 2px;font-size:11px;font-weight:700;color:var(--mut)}
  .callegend span{display:flex;align-items:center;gap:5px}
  .callegend .cdot{display:inline-block;width:8px;height:8px;border-radius:50%}
  .calcell.today .dnum{border:2px solid var(--primary);color:var(--primary)}
  .calcell.sel .dnum{background:var(--primary-tint);color:var(--primary2)}
  /* detalle de rutina: checklist + empezar aquí */
  .routprog{margin:0 18px 6px;font-size:12.5px;font-weight:800;color:var(--primary)}
  .ex .top{gap:10px;align-items:center}
  .exck{width:26px;height:26px;border-radius:50%;border:2px solid var(--line2);background:transparent;color:var(--on-primary);font-size:13px;font-weight:800;display:flex;align-items:center;justify-content:center;flex:0 0 auto;cursor:pointer}
  .ex.checked .exck{background:var(--primary);border-color:var(--primary)}
  .ex.checked .nm{color:var(--mut);text-decoration:line-through}
  .exstart{width:36px;height:36px;border-radius:10px;background:var(--primary-tint);color:var(--primary);font-size:13px;display:flex;align-items:center;justify-content:center;flex:0 0 auto;cursor:pointer}
  /* figuras multi-paso (paso 1/2/3) */
  .frames{display:flex;gap:8px;margin:4px 0 10px}
  .frame{flex:1;min-width:0;background:var(--diagram-bg);border:1px solid var(--line);border-radius:12px;padding:8px 6px 7px;display:flex;flex-direction:column;align-items:center;gap:5px}
  .frame .fnum{width:20px;height:20px;border-radius:50%;background:var(--primary);color:var(--on-primary);font-size:11px;font-weight:800;display:flex;align-items:center;justify-content:center;font-variant-numeric:tabular-nums}
  .frame .fdiag{width:100%;height:74px}
  .frame .fdiag svg{width:100%;height:100%;display:block}
  .frame .fcap{font-size:10px;color:var(--tx2);text-align:center;font-weight:700;line-height:1.15}
  .gframes{margin:2px 0}
  #guided .frame .fdiag{height:94px}
  /* semana / planificador */
  .wkhead{display:flex;align-items:baseline;justify-content:space-between;padding:4px 18px 0}
  .wkhead .t{font-size:11.5px;font-weight:800;color:var(--mut);text-transform:uppercase;letter-spacing:.8px}
  .week{display:flex;gap:5px;padding:8px 16px 4px}
  .week .day{min-width:0}
  .day{flex:1;background:var(--card);border:1px solid var(--line);box-shadow:var(--sh-card);border-radius:12px;padding:8px 2px;text-align:center;cursor:pointer;min-width:0}
  .day .d{font-size:10.5px;font-weight:800;color:var(--mut)}
  .day .tag{font-size:8.5px;font-weight:800;margin-top:4px;color:var(--line2);line-height:1.1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .day.on{border-color:var(--primary)} .day.on .d{color:var(--primary)}
  .day.d-p .tag{color:var(--primary)} .day.d-n .tag{color:var(--accent)} .day.d-g .tag{color:var(--load)} .day.rest .tag{color:var(--mut)}
  /* registro de peso */
  .logrow{display:flex;gap:10px;margin-top:4px}
  .stepper{flex:1;background:var(--card);border:1px solid var(--line);box-shadow:var(--sh-card);border-radius:14px;padding:10px}
  .stepper .lab{font-size:10.5px;font-weight:800;color:var(--mut);text-transform:uppercase;letter-spacing:.6px;text-align:center}
  .stepper .row{display:flex;align-items:center;justify-content:space-between;margin-top:6px}
  .stepper .row b{font-size:26px;font-weight:800;font-variant-numeric:tabular-nums}
  .stepper .row b small{font-size:12px;font-weight:700;color:var(--mut)}
  .sq{width:38px;height:38px;border-radius:10px;background:var(--sunk);border:1px solid var(--line);color:var(--primary);font-size:20px;font-weight:800;display:flex;align-items:center;justify-content:center;cursor:pointer}
  .last{margin:11px 0 4px;background:var(--load-tint);border:1px solid var(--load);border-radius:11px;padding:9px 12px;font-size:12px;color:var(--load-ink);font-weight:600}
  .sets{margin:11px 0 0;display:flex;flex-direction:column;gap:6px}
  .setline{display:flex;align-items:center;gap:9px;font-size:12.5px;background:var(--card);border:1px solid var(--line);border-radius:10px;padding:8px 11px}
  .setline .n{color:var(--mut);font-weight:800;width:52px} .setline .v{font-weight:700} .setline .ck{margin-left:auto;color:var(--primary);font-weight:800}
  .restadj{display:flex;gap:8px;margin-top:8px}
  /* registro rapido desde la lista de la rutina */
  .qbox{margin:12px 0 2px;background:var(--sunk);border:1px solid var(--line);border-radius:13px;padding:10px}
  .qhead{display:flex;align-items:center;gap:8px;font-size:10.5px;font-weight:800;color:var(--mut);text-transform:uppercase;letter-spacing:.7px;margin-bottom:8px}
  .qhead .qc{margin-left:auto;text-transform:none;letter-spacing:0;font-size:11.5px;color:var(--primary);font-weight:800}
  .qbox .stepper{padding:8px}
  .qbox .stepper .row b{font-size:22px}
  .qbox .sets{margin-top:10px}
  .qwhy{font-size:11.5px;color:var(--load-ink);background:var(--load-tint);border:1px solid var(--load);border-radius:9px;padding:7px 10px;margin-top:8px;font-weight:600;line-height:1.4}
  .qadd{width:100%;margin-top:9px;border:none;border-radius:12px;padding:12px;font-size:14px;font-weight:800;
    color:var(--on-primary);background:linear-gradient(135deg,var(--go),var(--go2));cursor:pointer}
  .qadd:active{transform:translateY(1px)}
  .setline .del{margin-left:auto;color:var(--mut);font-size:14px;font-weight:800;cursor:pointer;padding:2px 4px;line-height:1}
  .setline .ck~.del{margin-left:8px}
  .rcard .em.g{background:var(--load-tint);color:var(--load-ink)}
  /* progreso */
  .chartcard{margin:0 16px 10px;background:var(--card);border:1px solid var(--line);box-shadow:var(--sh-card);border-radius:15px;padding:13px 12px 8px}
  .chartcard .ct{font-size:14px;font-weight:800;margin:0 2px 2px}
  .chartcard .cs{font-size:11.5px;color:var(--mut);font-weight:600;margin:0 2px 8px}
  /* overlay planificador */
  #planov{position:fixed;inset:0;background:rgba(4,8,12,.55);display:none;z-index:60;align-items:flex-end;justify-content:center}
  #planov.show{display:flex}
  #planov .ovcard{border-radius:18px 18px 0 0;max-width:600px;width:100%;max-height:80vh;overflow:auto}
  .planbody{padding:10px 12px calc(16px + env(safe-area-inset-bottom));display:flex;flex-direction:column;gap:7px}
  .planopt{display:flex;align-items:center;gap:11px;padding:12px;border:1px solid var(--line);border-radius:12px;background:var(--card2);cursor:pointer;font-weight:700;font-size:14px;color:var(--tx)}
  .planopt .em{width:34px;height:34px;border-radius:9px;display:flex;align-items:center;justify-content:center;background:var(--primary-tint);flex:0 0 auto}
  .optbox{background:var(--load-tint);border:1px solid var(--load);color:var(--load-ink);font-size:12.5px;border-radius:11px;padding:10px 12px;margin:10px 0;line-height:1.5}
  .zonatag{display:inline-block;font-size:11px;font-weight:800;color:var(--accent);letter-spacing:.3px;margin:0 0 10px}
  .coachtip{background:var(--accent-tint);border:1px solid var(--line);color:var(--tx2);font-size:12px;border-radius:10px;padding:9px 11px;margin:4px 0 10px;line-height:1.45}
  .gbtn.fin{background:var(--card);color:var(--tx2);border:1px solid var(--line);font-size:14px;padding:13px;margin-top:4px}
  .cthead{display:flex;align-items:center;gap:8px}
  .cthead .ct{flex:1;min-width:0}
  .delta{font-size:11.5px;font-weight:800;padding:3px 8px;border-radius:999px;flex:0 0 auto}
  .delta.up{background:var(--primary-tint);color:var(--primary2)}
  .delta.down{background:var(--rest-tint);color:var(--rest)}
  .blockt{margin:16px 4px 8px;font-size:11.5px;font-weight:800;color:var(--mut);text-transform:uppercase;letter-spacing:.8px}
  .chip{font-size:10px;font-weight:800;padding:3px 9px;border-radius:999px;background:var(--sunk);color:var(--tx2);border:1px solid var(--line);cursor:pointer}
  .exadd{width:36px;height:36px;border-radius:10px;background:var(--sunk);color:var(--mut);font-size:17px;font-weight:800;display:flex;align-items:center;justify-content:center;flex:0 0 auto;cursor:pointer;border:1px solid var(--line)}
  .exadd.on{background:var(--primary-tint);color:var(--primary);border-color:var(--primary)}
  .ex.off{opacity:.62}
  .optsub{font-size:11px;color:var(--mut);font-weight:600;margin-top:2px}
  .optbox.warm{background:var(--rest-tint);border-color:var(--rest);color:var(--rest)}
  .icbtn.fin{background:var(--primary-tint);border-color:var(--primary);font-size:16px}
  .numin{width:104px;font-size:24px;font-weight:800;text-align:center;border:2px solid var(--primary);border-radius:10px;
    background:var(--card);color:var(--tx);padding:2px 4px;font-variant-numeric:tabular-nums;-moz-appearance:textfield}
  .numin::-webkit-outer-spin-button,.numin::-webkit-inner-spin-button{-webkit-appearance:none;margin:0}
  .stepper .row b{cursor:pointer}
  .exprog{background:var(--sunk);border:1px solid var(--line);border-radius:12px;padding:11px 12px 6px;margin:2px 0 10px}
  .exprog .ct{font-size:12.5px;font-weight:800}
  .exprog .cs{font-size:11.5px;color:var(--mut);font-weight:600;margin:2px 0 6px}
  .mchips{display:flex;flex-wrap:wrap;gap:5px;margin:2px 0 8px}
  .mchip{font-size:10.5px;font-weight:800;padding:5px 10px;border-radius:999px;background:var(--sunk);color:var(--mut);border:1px solid var(--line);cursor:pointer}
  .mchip.on{background:var(--primary-tint);color:var(--primary);border-color:var(--primary)}
  .exempty{font-size:12px;color:var(--mut);font-weight:600;line-height:1.5}
  .spk{display:inline-block;vertical-align:middle;margin-left:8px}
  .gchart{margin:9px 0 0;display:none}
  .gchart.show{display:block}
  .last.tap{cursor:pointer}
  .hitem .dt2{font-size:11px;color:var(--mut);font-weight:700;margin-top:3px}
  .daydet{display:none;margin:0 0 10px;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:4px 12px 8px}
  .daydet.open{display:block}
  .ddrow{display:flex;gap:10px;font-size:12.5px;padding:8px 0;border-top:1px solid var(--line)}
  .ddrow:first-child{border-top:none}
  .ddrow .dn{flex:1;font-weight:700;min-width:0}
  .ddrow .dv{color:var(--mut);font-weight:700;text-align:right;font-variant-numeric:tabular-nums}
  .planopt.sel{border-color:var(--primary);background:var(--primary-tint)}
  #swapov{position:fixed;inset:0;background:rgba(4,8,12,.55);display:none;z-index:60;align-items:flex-end;justify-content:center}
  #swapov.show{display:flex}
  #swapov .ovcard{border-radius:18px 18px 0 0;max-width:600px;width:100%;max-height:80vh;overflow:auto}
  /* hoja de resumen / finalizar */
  #finov{position:fixed;inset:0;background:rgba(4,8,12,.55);display:none;z-index:65;align-items:flex-end;justify-content:center}
  #finov.show{display:flex}
  #finov .ovcard{border-radius:18px 18px 0 0;max-width:600px;width:100%;max-height:88vh;overflow:auto}
  .finsum{display:flex;gap:8px;margin:0 0 12px}
  .finsum .fs{flex:1;background:var(--sunk);border:1px solid var(--line);border-radius:12px;padding:9px 4px;text-align:center}
  .finsum .fs b{display:block;font-size:19px;font-weight:800;font-variant-numeric:tabular-nums;line-height:1.2}
  .finsum .fs span{font-size:9.5px;font-weight:800;color:var(--mut);text-transform:uppercase;letter-spacing:.5px}
  .finlist{display:flex;flex-direction:column;gap:6px;margin:0 0 14px}
  .setline.fin .n{width:auto;flex:1;color:var(--tx);font-weight:700}
  .setline.fin .v{color:var(--mut);font-weight:700;font-size:12px;text-align:right}
  .finempty{background:var(--sunk);border:1px solid var(--line);border-radius:12px;padding:16px 14px;text-align:center;font-size:13px;color:var(--mut);font-weight:600;margin:0 0 14px;line-height:1.5}
  .finhint{font-size:11.5px;color:var(--mut);font-weight:600;text-align:center;margin-top:2px}
  /* foco visible (accesibilidad) */
  button:focus-visible,a:focus-visible,input:focus-visible,.toggle:focus-visible,.rcard:focus-visible,.ex .top:focus-visible{outline:none;box-shadow:var(--sh-focus)}
  /* recolor de diagramas y anillo del timer: atributos inline -> tokens de tema */
  [stroke="#cfeede"]{stroke:var(--diagram-ink)} [fill="#cfeede"]{fill:var(--diagram-ink)}
  [stroke="#5fe39a"]{stroke:var(--diagram-hi)} [fill="#5fe39a"]{fill:var(--diagram-hi)}
  [fill="#0c1524"]{fill:var(--diagram-eye)}
  [stroke="#3a5069"],[stroke="#46596f"]{stroke:var(--diagram-line)}
  [stroke="#22303c"]{stroke:var(--ring-track)} [stroke="#34d399"]{stroke:var(--primary)}
  /* ================= Refresh visual v16 ================= */
  :root{
    --sh-card:0 1px 2px rgba(16,28,24,.05), 0 10px 24px -16px rgba(16,28,24,.28);
    --sh-raised:0 8px 20px -6px rgba(15,157,118,.45);
    --hero:#15241f; --hero-tx:#ffffff; --hero-mut:#a8c6ba;
  }
  :root[data-theme="dark"]{ --hero:#16232f; --hero-tx:#f2f6fb; --hero-mut:#9db2c4;
    --sh-card:0 1px 2px rgba(0,0,0,.35), 0 10px 24px -16px rgba(0,0,0,.6); }
  @media (prefers-color-scheme:dark){ :root:not([data-theme="light"]){ --hero:#16232f; --hero-tx:#f2f6fb; --hero-mut:#9db2c4;
    --sh-card:0 1px 2px rgba(0,0,0,.35), 0 10px 24px -16px rgba(0,0,0,.6); } }

  body{letter-spacing:-.01em}
  h1{font-size:27px;letter-spacing:-.7px;font-weight:800}
  .head{padding:20px 18px 2px;gap:13px}
  .head img{width:42px;height:42px;border-radius:13px}
  .head .sub{font-size:12.5px;margin-top:2px}
  .bar{padding:18px 16px 6px}
  .bar .ttl{font-size:22px;letter-spacing:-.6px}

  /* superficies: sin borde en claro, sombra suave */
  .rcard,.stat,.hitem,.field,.cal,.chartcard,.ex,.today,.day,.stepper{border:none;box-shadow:var(--sh-card)}
  :root[data-theme="dark"] .rcard,:root[data-theme="dark"] .stat,:root[data-theme="dark"] .hitem,
  :root[data-theme="dark"] .field,:root[data-theme="dark"] .cal,:root[data-theme="dark"] .chartcard,
  :root[data-theme="dark"] .ex,:root[data-theme="dark"] .day,:root[data-theme="dark"] .stepper{border:1px solid var(--line)}
  @media (prefers-color-scheme:dark){ :root:not([data-theme="light"]) .rcard,:root:not([data-theme="light"]) .stat,
    :root:not([data-theme="light"]) .hitem,:root:not([data-theme="light"]) .field,:root:not([data-theme="light"]) .cal,
    :root:not([data-theme="light"]) .chartcard,:root:not([data-theme="light"]) .ex,:root:not([data-theme="light"]) .day,
    :root:not([data-theme="light"]) .stepper{border:1px solid var(--line)} }

  /* tarjeta HOY: invertida, ancla visual de la pantalla */
  .today{background:var(--hero);border-radius:22px;padding:18px 18px 16px;margin:16px 16px 6px}
  .today .kick{color:var(--primary);font-size:10.5px;letter-spacing:1.4px}
  .today .tt{color:var(--hero-tx);font-size:24px;letter-spacing:-.7px;margin-top:8px}
  .today .mt{color:var(--hero-mut);font-size:12.5px;margin-top:5px}
  .today-go{height:52px;padding:0;border-radius:14px;font-size:15.5px;margin-top:15px}
  .today-go.sec{background:rgba(255,255,255,.10);color:var(--hero-tx);border:none}
  .today .alt{color:var(--hero-mut);margin-top:11px}

  /* titulos de seccion */
  .grouptitle{margin:24px 18px 10px;font-size:11px;letter-spacing:1.4px;color:var(--mut)}
  .blockt{margin:20px 6px 10px;font-size:11px;letter-spacing:1.4px}

  /* tarjetas de rutina */
  .rcard{border-radius:18px;padding:14px;gap:13px;margin:0 16px 10px}
  .rcard .em{width:48px;height:48px;border-radius:15px;font-size:22px}
  .rcard .nm{font-size:15.5px;letter-spacing:-.2px}
  .rcard .ds{font-size:12px;margin-top:3px;line-height:1.35}

  /* estadisticas */
  .stats{gap:9px;margin:14px 16px 2px}
  .stat{border-radius:16px;padding:13px 14px}
  .stat .v{font-size:23px;letter-spacing:-.5px}
  .stat .l{font-size:10.5px;margin-top:4px}

  /* ejercicios */
  .ex{border-radius:18px;margin-bottom:10px}
  .ex .top{padding:13px;gap:11px}
  .diag{width:58px;height:58px;border-radius:14px;padding:5px}
  .ex .nm{font-size:15px;letter-spacing:-.2px}
  .ex .meta{font-size:12px;margin-top:3px}
  .badge{font-size:10.5px;padding:3px 10px}
  .exck{width:28px;height:28px}
  .exstart,.exadd{width:38px;height:38px;border-radius:12px}

  /* botones */
  .btn{height:56px;padding:0;border-radius:16px;font-size:16.5px}
  .gbtn{height:54px;padding:0;border-radius:15px;font-size:15.5px}
  .vbtn{border-radius:12px;padding:10px 14px}

  /* guiado */
  .exname{font-size:27px;letter-spacing:-.8px;margin:4px 0 12px}
  .setlab{font-size:12.5px;letter-spacing:.2px}
  .gtop{padding:14px 16px 6px;gap:10px}
  .icbtn{width:40px;height:40px;border-radius:13px}
  .pbar{height:9px}
  .stepper{border-radius:16px;padding:12px 10px}
  .stepper .row b{font-size:28px;letter-spacing:-1px}
  .sq{width:40px;height:40px;border-radius:12px;font-size:22px}

  /* nav con pastilla activa */
  .nav{padding:7px 6px calc(7px + env(safe-area-inset-bottom))}
  .nav a{font-size:10.5px;padding:6px 2px;border-radius:14px;margin:0 3px;transition:background .15s}
  .nav a.on{background:var(--primary-tint)}
  .nav a .i svg{width:23px;height:23px}

  /* calendario y listas */
  .cal{border-radius:18px;padding:14px 12px 16px}
  .hitem{border-radius:16px;padding:13px 14px}
  .field{border-radius:18px;padding:16px}
  .field .fl{font-size:14.5px}
  .empty{font-size:13.5px;line-height:1.65}

  /* ===== dashboard de progreso ===== */
  .heroP{background:var(--hero);border-radius:22px;padding:20px 18px;margin:14px 16px 4px;text-align:center}
  .heroP .hkick{color:var(--primary);font-size:10.5px;font-weight:800;letter-spacing:1.4px;text-transform:uppercase}
  .heroP .hbig{color:var(--hero-tx);font-size:56px;font-weight:800;letter-spacing:-2px;line-height:1.05;margin:6px 0 4px;font-variant-numeric:tabular-nums}
  .heroP .hsub{color:var(--hero-mut);font-size:12px;margin-top:6px;line-height:1.4}
  .heroP .hverd{color:var(--hero-tx);font-size:13px;line-height:1.5;margin-top:12px;font-weight:600}
  .heroP .delta{display:inline-block;margin-top:2px}
  .heroP svg{margin-top:10px}
  .callout{margin:0 16px 10px;background:var(--rest-tint);color:var(--rest);border-radius:12px;padding:11px 13px;font-size:12.5px;font-weight:600;line-height:1.45}
  .bwrow{display:flex;gap:8px;margin-top:10px}
  .bwrow input{flex:1;min-width:0;background:var(--sunk);border:1px solid var(--line);color:var(--tx);border-radius:11px;padding:11px;font-size:15px}
  .bwrow .minibtn{margin-top:0;flex:0 0 auto}
  .mbars{display:flex;flex-direction:column;gap:9px}
  .mrow{display:flex;align-items:center;gap:9px}
  .mrow .mn{flex:0 0 84px;font-size:11.5px;font-weight:700;color:var(--tx2);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .mrow .mtrack{flex:1;height:10px;background:var(--sunk);border-radius:999px;position:relative;overflow:hidden;min-width:0}
  .mrow .mfill{position:absolute;left:0;top:0;bottom:0;border-radius:999px;background:var(--primary)}
  .mrow .mfill.mid{background:var(--rest)} .mrow .mfill.low{background:var(--danger)}
  .mrow .mgoal{position:absolute;top:-2px;bottom:-2px;width:2px;background:var(--line2);z-index:2}
  .mrow .mv{flex:0 0 26px;text-align:right;font-size:11.5px;font-weight:800;font-variant-numeric:tabular-nums}
  .prrow{display:flex;align-items:baseline;gap:8px;padding:8px 0;border-top:1px solid var(--line)}
  .prrow .prn{flex:1;min-width:0;font-size:13px;font-weight:700;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .prrow .prv{font-size:12px;font-weight:800;color:var(--primary)}
  .prrow .prd{font-size:11px;color:var(--mut);flex:0 0 auto}
  .heat{display:grid;grid-template-columns:repeat(12,minmax(0,1fr));gap:3px;margin-top:10px;direction:ltr}
  .heat i{display:block;width:100%;aspect-ratio:1/1;border-radius:3px;background:var(--sunk)}
  .heat i.h-g{background:var(--primary)} .heat i.h-c{background:var(--primary-tint)}
  .heat i.h-b{background:var(--primary);box-shadow:inset 0 0 0 2px var(--accent)}
  .hleg{display:inline-block;width:9px;height:9px;border-radius:2px;vertical-align:-1px;margin:0 2px 0 6px}
  .hleg.h-g{background:var(--primary)} .hleg.h-c{background:var(--primary-tint)}

/* audio + haptics */
function beep(){try{actx=actx||new (window.AudioContext||window.webkitAudioContext)();if(actx.state==="suspended")actx.resume();
  const t=actx.currentTime;[[880,t],[1175,t+.42]].forEach(([f,st])=>{const o=actx.createOscillator(),g=actx.createGain();
  o.connect(g);g.connect(actx.destination);o.type="sine";o.frequency.value=f;g.gain.setValueAtTime(.0001,st);
  g.gain.exponentialRampToValueAtTime(.3,st+.02);g.gain.exponentialRampToValueAtTime(.0001,st+.34);o.start(st);o.stop(st+.36);});}catch(e){}
  try{if(navigator.vibrate)navigator.vibrate([120,60,120]);}catch(e){}}

/* theme */
function loadTheme(){return jget("rp_theme","auto");}
function applyTheme(pref){const root=document.documentElement;
  if(pref==="light"||pref==="dark")root.setAttribute("data-theme",pref);else root.removeAttribute("data-theme");
  let dark=false;try{dark=(pref==="dark")||(pref==="auto"&&matchMedia("(prefers-color-scheme:dark)").matches);}catch(e){}
  const mc=document.querySelector('meta[name="theme-color"]');if(mc)mc.setAttribute("content",dark?"#0b1220":"#f4f6f5");}
function setTheme(pref){jset("rp_theme",pref);applyTheme(pref);markThemeSeg();}
function markThemeSeg(){const p=loadTheme();document.querySelectorAll("#themeSeg button").forEach(b=>b.classList.toggle("on",b.dataset.th===p));}
try{matchMedia("(prefers-color-scheme:dark)").addEventListener("change",()=>{if(loadTheme()==="auto")applyTheme("auto");});}catch(e){}

/* storage */
function jget(k,d){try{return JSON.parse(localStorage.getItem(k))??d;}catch(e){return d;}}
function jset(k,v){try{localStorage.setItem(k,JSON.stringify(v));return true;}catch(e){return false;}}
function ds(d){return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0");}
function today(){return ds(new Date());}
function yesterday(){const d=new Date();d.setDate(d.getDate()-1);return ds(d);}
function loadStreak(){return jget("rp_streak",{count:0,best:0,last:null,total:0});}
function completeDay(){const s=loadStreak(),t=today();if(s.last!==t){s.count=(s.last===yesterday())?s.count+1:1;s.last=t;s.total=(s.total||0)+1;}s.best=Math.max(s.best||0,s.count);jset("rp_streak",s);return s;}
function loadHist(){return jget("rp_history",[]);}
function recordSession(key,name,sum,when){const h=loadHist(),d=when?new Date(when):new Date();
  const e={key,name,iso:d.toISOString(),day:DAYS[d.getDay()],
    date:String(d.getDate()).padStart(2,"0")+"/"+String(d.getMonth()+1).padStart(2,"0")+"/"+d.getFullYear(),

  e.type==="reps_side"?`${e.sets} × ${e.reps} / lado`:`${e.sets} × ${e.reps}`;}
/* ---- opcionales: sustitutos (swap) y extras ---- */

function swapOf(k,id){const s=loadSwaps()[k]||{};return s[id]||null;}
function setSwap(k,id,alt){const all=loadSwaps();all[k]=all[k]||{};if(alt)all[k][id]=alt;else delete all[k][id];jset("rp_swaps",all);}
function loadExtras(){return jget("rp_extras",{});}

function toggleExtra(k,id){const all=loadExtras(),a=(all[k]||[]).slice(),i=a.indexOf(id);

  const base=(r.list||[]).map(id=>swapOf(k,id)||id).filter(id=>EX[id]);

function openSwap(k,origin){pushHist({ov:"swap"});const alts=[origin].concat(((ROUTINES[k].swaps||{})[origin])||[]),cur=swapOf(k,origin)||origin;

function openRoutine(k,noPush){curRoutine=k;if(!noPush)pushHist({v:"routine",k:k});const r=ROUTINES[k],chk=checksFor(k);
  qState={};const LOGS=loadLogs();

  const swaps=r.swaps||{},extras=r.extras||[],on=extrasOn(k);

          <div class="badges"><span class="badge ${tg[1]}">${tg[0]}</span>${isExtra?'<span class="badge b-opcional">Opcional · extra</span>':''}${(alts&&alts.length)?`<span class="chip" onclick="event.stopPropagation();openSwap('${k}','${origin}')">🔁 ${swapped?('Cambiado · original: '+shortName(origin)):(alts.length===1?('Cambiar por '+shortName(alts[0])):('Cambiar ('+alts.length+' opciones)'))}</span>`:''}</div></div>
        ${isExtra?`<div class="exadd ${added?'on':''}" onclick="event.stopPropagation();toggleExtra('${k}','${id}')" role="button" aria-label="Añadir a la rutina">${added?'✓':'＋'}</div>`
                 :`<div class="exstart" onclick="event.stopPropagation();startRoutine('${id}')" role="button" aria-label="Empezar por este ejercicio" title="Empezar aquí">▶</div>`}
      </div>

        ${(e.coach)?`<div class="coachtip">💡 ${esc(e.coach)}</div>`:''}
        ${quickBox(k,id,n)}
        ${exChart(id,LOGS)}
        <div class="vbtn" onclick="openVideo('${id}')">▶ Ver video</div>
      </div></div>`;};
  const warm=r.warm||[];
  r.list.forEach(origin=>{const id=swapOf(k,origin)||origin,e=EX[id];if(!e)return;
    const isW=warm.indexOf(origin)>=0||e.tag==="calent";
    if(isW&&!shownWarm){h+=`<div class="blockt">🔥 Calentamiento</div>`;shownWarm=true;}
    if(!isW&&!shownMain&&shownWarm){h+=`<div class="blockt">💪 Entrenamiento</div>`;shownMain=true;}
    h+=card(id,origin,false,isW);});
  if(extras.length){h+=`<div class="blockt">➕ Opcionales · si tienes tiempo</div>`;
    extras.forEach(id=>{h+=card(id,null,true);});}
  h+=`</div>`+routineCTA(k);
  $("routine").innerHTML=h;show("routine");
}
/* barra inferior de la rutina: empezar/continuar + finalizar (siempre visibles) */
function routineCTA(k){const r=ROUTINES[k];if(!r)return "";
  const st=sessStats(k),live=st.exDone>0;

  let note="";
  if(ult){note=`<div class="ctanote">✓ Registrada hoy${ult.time?" a las "+ult.time:""}`
    +(ult.sets?" · "+ult.sets+" "+plural(ult.sets,"serie","series"):"")+`</div>`;}
  const prim=live?`▶  Continuar · ${Math.min(st.exDone+1,st.exTotal)} de ${st.exTotal}`
                 :`▶  Empezar ${esc(r.name)}`;
  return `<div class="cta cta2" id="routCta">${note}
    <button class="btn" onclick="startRoutine()">${prim}</button>
    <button class="btn sec" onclick="openFinish()">🏁 Finalizar rutina</button></div>`;}
function updateRoutineCTA(){const el=$("routCta");if(el)el.outerHTML=routineCTA(curRoutine);}

function updateRoutineProgress(){const el=$("routProg");if(el)el.textContent=routineProgressText(curRoutine);}
function shortName(id){var e=EX[id];if(!e)return id;var n=e.name.replace(/\s*\(.*?\)\s*/g,"").trim();

/* ==== [S3] CURVA DE EVOLUCION POR EJERCICIO =============================== */
const METRICS=[{k:"w",n:"Peso máx"},{k:"e1rm",n:"Fuerza est."},{k:"vol",n:"Volumen"},{k:"reps",n:"Reps"}];
function loadPrefs(){return jget("rp_prefs",{});}
function prefGet(k,d){const p=loadPrefs();return (p&&p[k]!=null)?p[k]:d;}
function prefSet(k,v){const p=loadPrefs();p[k]=v;jset("rp_prefs",p);}
function exSeries(id,metric,LOGS){const e=EX[id]||{},u=e.unit||"kg";
  const recs=(((LOGS||loadLogs())[id])||[]).filter(r=>r.sets&&r.sets.length);
  let unit=u;const out=[];
  recs.forEach(r=>{let v=0;
    if(metric==="vol"){r.sets.forEach(s=>{v+=(s.w||0)*(s.reps||0);});unit="kg";}
    else if(metric==="e1rm"){r.sets.forEach(s=>{if((s.w||0)>0&&(s.reps||0)<=12){const x=e1rm(s.w,s.reps);if(x>v)v=x;}});v=Math.round(v*10)/10;unit=u;}
    else if(metric==="reps"){r.sets.forEach(s=>{if((s.reps||0)>v)v=s.reps;});unit="reps";}
    else{const b=bestSet(r.sets);v=b?(b.w||0):0;unit=u;}
    out.push({date:r.date,v:v});});
  return {data:out,unit:unit};}
function exMetric(id,LOGS){const recs=(((LOGS||loadLogs())[id])||[]).filter(r=>r.sets&&r.sets.length);
  const loaded=recs.some(r=>r.sets.some(x=>(x.w||0)>0));
  return loaded?prefGet("chartMetric","w"):"reps";}
function exChart(id,LOGS){const e=EX[id]||{},all=(((LOGS||loadLogs())[id])||[]);
  const recs=all.filter(r=>r.sets&&r.sets.length);
  const head=`<div class="cthead"><div class="ct">Tu progreso</div>`;
  if(!recs.length){
    const hechas=all.length;
    return `<div class="exprog" id="exprog_${id}">${head}</div>
      <div class="exempty">${hechas?("Lo has hecho "+hechas+" "+plural(hechas,"vez","veces")+" sin anotar series. "):""}Registra tus series y aquí verás cómo evolucionas.</div></div>`;}
  const loaded=recs.some(r=>r.sets.some(x=>(x.w||0)>0)),metric=exMetric(id,LOGS);
  const s=exSeries(id,metric,LOGS),vals=s.data.map(d=>d.v);
  const best=Math.max.apply(null,vals),last=vals[vals.length-1],first=vals[0];
  const delta=Math.round((last-first)*10)/10;
  const bs=bestSet(recs[recs.length-1].sets);
  const chips=loaded?`<div class="mchips">`+METRICS.map(m=>`<span class="mchip ${m.k===metric?"on":""}" onclick="setMetric('${id}','${m.k}')" role="button">${m.n}</span>`).join("")+`</div>`:"";
  return `<div class="exprog" id="exprog_${id}">${head}${(vals.length>1&&delta!==0)?`<span class="delta ${delta>0?"up":"down"}">${delta>0?"↑ +":"↓ "}${fmtW(Math.abs(delta))}</span>`:""}</div>
    <div class="cs">Récord ${fmtW(best)} ${s.unit}${(bs&&loaded)?" · última "+fmtW(bs.w||0)+" "+(e.unit||"kg")+" × "+bs.reps:""} · ${recs.length} ${plural(recs.length,"sesión","sesiones")}</div>
    ${chips}
    ${vals.length>1?chart(s.data,s.unit):'<div class="exempty">Registra otra sesión y aparecerá la curva.</div>'}</div>`;}
function setMetric(id,m){prefSet("chartMetric",m);
  document.querySelectorAll(".exprog").forEach(el=>{const k=el.id.replace("exprog_","");
    if(k&&EX[k])el.outerHTML=exChart(k);});
  const g=$("gchart");if(g&&g.classList.contains("show"))g.innerHTML=exChart(id,null);}
/* mini curva para el flujo guiado */
function spark(id){const m=exMetric(id),s=exSeries(id,m),v=s.data.slice(-8).map(d=>d.v);
  if(v.length<2)return "";
  const w=64,h=18,min=Math.min.apply(null,v),max=Math.max.apply(null,v),rng=(max-min)||1;
  const px=v.map((x,i)=>[2+(w-4)*i/(v.length-1),2+(h-4)*(1-(x-min)/rng)]);
  const pts=px.map(p=>p[0].toFixed(1)+","+p[1].toFixed(1)).join(" ");
  const l=px[px.length-1];
  return `<svg class="spk" viewBox="0 0 ${w} ${h}" width="${w}" height="${h}" aria-hidden="true"><polyline points="${pts}" fill="none" stroke="var(--primary)" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/><circle cx="${l[0].toFixed(1)}" cy="${l[1].toFixed(1)}" r="2.2" fill="var(--primary)"/></svg>`;}
function toggleGChart(id){const g=$("gchart");if(!g)return;
  if(g.classList.contains("show")){g.classList.remove("show");g.innerHTML="";}
  else{g.innerHTML=exChart(id,null);g.classList.add("show");}}
/* ==== fin [S3] ============================================================ */
function framesStrip(id){const f=(typeof FRAMES!=="undefined")?FRAMES[id]:null;if(!f||!f.frames||f.frames.length<2)return "";
  return `<div class="frames">`+f.frames.map((sv,i)=>`<div class="frame"><div class="fnum">${i+1}</div><div class="fdiag">${sv}</div><div class="fcap">${esc((f.captions&&f.captions[i])||"")}</div></div>`).join("")+`</div>`;}

/* ===== GIMNASIO: registro de peso, planificador semanal, progreso ===== */
let sessionLog={}, curW=null, curReps=null, restR=0, planDay=0;

/* ==== [S1] SESION PERSISTIDA =================================================
   rp_session = {v,key,date,startedAt,lastAt,stepi,src,log:{exId:[{w,reps,t}]}}
   Su ausencia significa "sin sesion activa": los datos antiguos migran solos.
   rp_logged  = {fecha:{rutina:{exId:1}}} ejercicios ya volcados a rp_logs hoy,
   para que cerrar dos veces el mismo dia no duplique los marcados con visto. */
let sessCommitted=0, sessionLogKey=null;
/* sessionLog vive en memoria; sessionLogKey dice de que rutina es, para que
   cambiar de rutina no arrastre series de la anterior */
function useSessionLog(k){if(sessionLogKey!==k){sessionLog={};sessionLogKey=k;}return sessionLog;}
function loadSess(){try{const s=jget("rp_session",null);
  if(!s||typeof s!=="object"||s.v!==1||!s.key||!ROUTINES[s.key]||!s.date)return null;
  if(!s.log||typeof s.log!=="object")s.log={};
  return s;}catch(e){return null;}}
function saveSess(s){if(!s)return null;s.lastAt=Date.now();jset("rp_session",s);return s;}
function clearSess(){try{localStorage.removeItem("rp_session");}catch(e){}}
function sessActive(k){const s=loadSess();return !!(s&&s.key===k&&s.date===today());}
function startSess(key,src){let s=loadSess();
  if(s&&s.key===key&&s.date===today())return s;
  if(s){try{if(sessStats(s.key,s.date).exDone)finishSession(s.key,"auto");}catch(e){}clearSess();}
  s={v:1,key:key,date:today(),startedAt:Date.now(),lastAt:Date.now(),stepi:0,src:src||"check",log:{}};
  jset("rp_session",s);return s;}
function touchSess(st){if(!curRoutine||!ROUTINES[curRoutine])return null;
  let s=loadSess();
  if(!s||s.key!==curRoutine||s.date!==today())s=startSess(curRoutine,st==null?"check":"guided");
  if(!s)return null;
  if(sessionLogKey===curRoutine)s.log=sessionLog;
  if(st!=null)s.stepi=st;return saveSess(s);}
/* vista combinada memoria + disco: la memoria manda en el ejercicio que toca */
function sessLog(k){const s=loadSess(),out={};
  const base=(s&&s.key===k)?(s.log||{}):{};
  Object.keys(base).forEach(id=>{if(base[id]&&base[id].length)out[id]=base[id];});
  if(sessionLogKey===k)Object.keys(sessionLog).forEach(id=>{if(sessionLog[id]&&sessionLog[id].length)out[id]=sessionLog[id];});
  return out;}
function loadLogged(){return jget("rp_logged",{});}
function loggedOn(t,k){const d=loadLogged()[t]||{};return d[k]||{};}
function markLogged(t,k,ids){const all=loadLogged();all[t]=all[t]||{};all[t][k]=all[t][k]||{};
  ids.forEach(id=>{all[t][k][id]=1;});
  const keep={};Object.keys(all).sort().slice(-14).forEach(d=>{keep[d]=all[d];});
  jset("rp_logged",keep);}
/* resumen de lo que hay SIN registrar todavia */
function sessStats(k,date){const t=date||today(),s=loadSess();
  const log=sessLog(k),ck=checksOn(t,k),done=loggedOn(t,k),list=effList(k);
  let sets=0,vol=0;const ids={};
  Object.keys(log).forEach(id=>{const a=log[id]||[];if(a.length){ids[id]=1;sets+=a.length;
    a.forEach(x=>{vol+=(x.w||0)*(x.reps||0);});}});
  list.forEach(id=>{if(ck[id]&&!done[id])ids[id]=1;});
  const st=(s&&s.key===k)?s.startedAt:0;
  return {sets:sets,vol:Math.round(vol),exDone:Object.keys(ids).length,exTotal:list.length,
    dur:durSince(st),ids:Object.keys(ids),startedAt:st};}
/* unico punto de escritura de una sesion terminada */
function finishSession(k,from){
  if(!k||!ROUTINES[k])return null;
  const s=loadSess(),mine=(s&&s.key===k)?s:null,startedAt=mine?mine.startedAt:0;
  if(sessCommitted&&startedAt&&sessCommitted===startedAt)return null;
  const dOver=(mine&&mine.date&&mine.date!==today())?mine.date:null;
  const st=sessStats(k,dOver||today());
  if(!st.exDone)return null;
  clearTimer();
  const sum=persistSession(k,dOver,startedAt);
  const streak=dOver?loadStreak():completeDay();
  recordSession(k,ROUTINES[k].name,sum,startedAt||null);
  sessCommitted=startedAt||Date.now();
  clearSess();
  return {streak:streak,summary:sum,rescued:!!dOver};}
/* ==== fin [S1] ============================================================ */
const DOW=["L","M","X","J","V","S","D"], DOWLONG=["lunes","martes","miércoles","jueves","viernes","sábado","domingo"];
function todayDow(){return (new Date().getDay()+6)%7;}
function loadLogs(){return jget("rp_logs",{});}
function logsWrite(fn){const logs=loadLogs();fn(logs);jset("rp_logs",logs);return logs;}
/* ultima sesion CON series: los registros de solo visto no traen pesos */
function lastLog(exId){const a=loadLogs()[exId];if(!a)return null;
  for(let i=a.length-1;i>=0;i--){const r=a[i];if(r&&r.sets&&r.sets.length)return r;}return null;}

/* ==== [S2] REGISTRO RAPIDO + PESO SUGERIDO ================================ */
let qState={};
function incFor(id){return 2.5;}
/* salto de progresion proporcional al peso: subir 2,5 kg en un ejercicio de
   10 kg es un 25% mas, demasiado para una sola semana */
function progStep(w){return w<10?1:(w<20?2:2.5);}
/* que peso y cuantas reps proponer: nunca la serie mas cansada de la vez
   pasada, sino la primera, y si completaste todo el objetivo, un poco mas */
function suggestLoad(id){const e=EX[id]||{},tgt=e.reps||10,loaded=e.load===true,u=e.unit||"kg";
  const ds=sessLog(curRoutine)[id]||[];
  if(ds.length){const l=ds[ds.length-1];return {w:l.w,reps:l.reps,why:""};}
  const ll=lastLog(id);
  if(!ll)return {w:loaded?10:0,reps:tgt,why:"Objetivo del programa: "+tgt+" repeticiones"};
  const first=ll.sets[0],sets=e.sets||ll.sets.length;
  const todas=ll.sets.length>=sets&&ll.sets.every(x=>(x.reps||0)>=tgt);
  if(loaded&&todas){const w=Math.round((first.w+progStep(first.w))*10)/10;
    return {w:w,reps:tgt,why:"Completaste las "+sets+" series: toca subir a "+fmtW(w)+" "+u};}
  if(loaded)return {w:first.w,reps:first.reps,why:"Mismo peso que la vez pasada · apunta a "+tgt+" reps"};
  const r=(first.reps>=tgt)?first.reps+1:tgt;
  return {w:0,reps:r,why:(first.reps>=tgt)?("La vez pasada llegaste a "+first.reps+": prueba con "+r):("Apunta a "+tgt+" repeticiones")};}
function qGet(id){if(!qState[id])qState[id]=suggestLoad(id);return qState[id];}

function persistSession(k,dateOverride,startedAt){

  const ck=checksOn(t,k),done=loggedOn(t,k),stamp=startedAt||Date.now();
  let sets=0,vol=0;const ids={},push=(id,rec)=>{logs[id]=logs[id]||[];logs[id].push(rec);
    if(logs[id].length>150)logs[id]=logs[id].slice(-150);};
  Object.keys(merged).forEach(id=>{const st=merged[id];if(st&&st.length){
    push(id,{date:t,sets:st,k:k,t:stamp});
    sets+=st.length;st.forEach(x=>{vol+=(x.w||0)*(x.reps||0);});ids[id]=1;}});
  /* los ejercicios hechos solo con visto tambien cuentan: sin esto la curva de
     evolucion nunca tendria datos para quien entrena marcando la lista */
  list.forEach(id=>{if(ck[id]&&!ids[id]&&!done[id]){push(id,{date:t,sets:[],k:k,t:stamp,checked:true});ids[id]=1;}});
  const all=Object.keys(ids);
  if(all.length){jset("rp_logs",logs);markLogged(t,k,all);}
  if(sessionLogKey===k){sessionLog={};sessionLogKey=null;}
  return {sets:sets,vol:Math.round(vol),exDone:all.length,exTotal:list.length,
    dur:dateOverride?0:durSince(startedAt),ids:all};}

/* acepta [numero,...] (espaciado uniforme, como antes) o [{date,v},...],

function dmLabel(d){const p=String(d).split("-");return p.length>2?(+p[2])+"/"+(+p[1]):String(d);}
function chart(data,unit,opt){opt=opt||{};
  if(!data||!data.length)return "";
  const dated=(typeof data[0]==="object"&&data[0]!==null);
  const vals=dated?data.map(d=>+d.v||0):data.map(v=>+v||0);
  const n=vals.length,w=300,h=opt.h||(dated?118:104),padL=6,padR=6,padT=14,padB=dated?26:16;
  const min=Math.min.apply(null,vals),max=Math.max.apply(null,vals),rng=(max-min)||1;

  const line=(n>1)?`<polyline points="${pts.join(" ")}" fill="none" stroke="var(--primary)" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>`:"";
  const base=(opt.baseline!==false&&n>1&&max!==min)?`<line x1="${padL}" y1="${Y(vals[0]).toFixed(1)}" x2="${w-padR}" y2="${Y(vals[0]).toFixed(1)}" stroke="var(--line2)" stroke-width="1" stroke-dasharray="3 4"/>`:"";

  const lab=(v,y)=>`<text x="${w-padR}" y="${y}" text-anchor="end" font-size="10" font-weight="700" fill="var(--mut)">${fmtW(v)} ${unit}</text>`;

  return `<svg viewBox="0 0 ${w} ${h}" width="100%" height="${h}" role="img" aria-label="Curva de evolución">${grid}${area}${base}${line}${rec}${dots}

/* ---------- BUILD STEPS ---------- */
function buildSteps(k){const out=[],list=effList(k),total=list.length;
  list.forEach((id,idx)=>{const e=EX[id],base={id,name:e.name,steps:e.steps,tag:e.tag,caveat:!!e.caveat,exI:idx+1,exN:total,load:e.load,unit:e.unit||"kg"};
    if(e.type==="reps"||e.type==="reps_side"){for(let s=1;s<=e.sets;s++)out.push(Object.assign({},base,{kind:"count",reps:e.reps,perSide:e.type==="reps_side",
      label:`Serie ${s} de ${e.sets}`+(e.type==="reps_side"?" · cada lado":""),restAfter:s<e.sets?e.rest:0,first:s===1}));}
    else if(e.type==="hold"){for(let s=1;s<=e.sets;s++)out.push(Object.assign({},base,{kind:"timer",seconds:e.holdSec,
      label:`Mantén ${s} de ${e.sets}`,restAfter:s<e.sets?(e.rest||15):0,first:s===1}));}
    else if(e.type==="hold_side"){for(let s=1;s<=e.sets;s++){
      out.push(Object.assign({},base,{kind:"timer",seconds:e.holdSec,label:`Serie ${s}/${e.sets} · Izquierdo`,restAfter:0,first:s===1}));
      out.push(Object.assign({},base,{kind:"timer",seconds:e.holdSec,label:`Serie ${s}/${e.sets} · Derecho`,restAfter:s<e.sets?(e.rest||10):0,first:false}));}}
  });return out;}

/* ---------- GUIDED ---------- */
function startRoutine(from){prime();pushHist({v:"guided",k:curRoutine});
  const s=startSess(curRoutine,"guided");
  sessionLog=(s&&s.log)?s.log:{};sessionLogKey=curRoutine;
  curW=null;curReps=null;steps=buildSteps(curRoutine);stepi=0;
  if(from){const i=steps.findIndex(x=>x.id===from);if(i>=0)stepi=i;}
  else if(s&&s.stepi>0&&s.stepi<steps.length)stepi=s.stepi;
  show("guided");renderStep();}
/* salir ya no destruye nada: la sesion vive en localStorage y se cierra
   desde el boton "Finalizar rutina" de la pantalla de la rutina */
function guidedExit(){clearTimer();touchSess(stepi);history.back();}
function guidedBack(){clearTimer();if(stepi>0){stepi--;renderStep();}else{guidedExit();}}
function guidedSkipExercise(){clearTimer();const cur=steps[stepi].id;let i=stepi;while(i<steps.length&&steps[i].id===cur)i++;
  if(i>=steps.length)finish();else{stepi=i;renderStep();}}

function frame(inner){const s=steps[stepi],prog=Math.round(stepi/steps.length*100);
  return `<div class="gtop"><div class="icbtn" onclick="guidedBack()">‹</div>
    <div class="pbar"><i style="width:${prog}%"></i></div>
    <div class="gcount">${s.exI}/${s.exN}</div><div class="icbtn" onclick="guidedExit()" role="button" aria-label="Salir" title="Salir (se guarda solo)">✕</div></div>
    <div class="stage"><div class="setlab">${s.label}</div><div class="exname">${s.name}</div>${(typeof ZONA!=="undefined"&&ZONA[s.id])?'<div class="zonatag">'+ZONA[s.id]+'</div>':''}
    ${(typeof FRAMES!=="undefined"&&FRAMES[s.id])?`<div class="gframes">${framesStrip(s.id)}</div>`:`<div class="gdiag">${DIAG[s.id]||""}</div>`}
    ${s.caveat?'<div class="caveatbox">⚠️ Evidencia floja: los ejercicios faciales muestran, en el mejor caso, mejoras modestas tras meses. Hazlo sin grandes expectativas.</div>':''}
    ${(ROUTINES[curRoutine]&&(ROUTINES[curRoutine].extras||[]).indexOf(s.id)>=0)?'<div class="optbox">➕ Opcional — hazlo solo si te queda tiempo y energía.</div>':((ROUTINES[curRoutine]&&(ROUTINES[curRoutine].warm||[]).indexOf(s.id)>=0)?'<div class="optbox warm">🔥 Calentamiento — peso ligero, sin llegar al fallo.</div>':'')}
    <ul class="glist">${s.steps.map(t=>`<li>${esc(t)}</li>`).join("")}</ul>
    <div class="vbtn" onclick="toggleGVid()">▶ Ver video</div>
    <div id="gvid" class="videobox"><div class="ratio"><iframe id="gvframe" allow="accelerometer; encrypted-media; gyroscope; picture-in-picture; fullscreen" allowfullscreen referrerpolicy="strict-origin-when-cross-origin"></iframe></div></div>
    <div><a class="ytlink" target="_blank" rel="noopener" href="${watch(VID[s.id])}">Abrir en YouTube ↗</a></div>
    ${inner}
    <button class="skip" onclick="guidedSkipExercise()">Saltar ejercicio ⏭</button></div>`;}

function renderStep(){clearTimer();const s=steps[stepi];let inner;if(s.first){curW=null;curReps=null;}
  if(s.kind==="count"){
    if(s.load===false){const ll=lastLog(s.id),ds=sessionLog[s.id]||[],sg=suggestLoad(s.id);
      if(curReps==null)curReps=sg.reps;
      const lastTxt=ll?('La última vez: '+ll.sets.map(x=>x.reps+' reps').join(', ')):'Primera vez — registra tus repeticiones';
      const setsTxt=ds.map((x,i)=>`<div class="setline"><span class="n">Serie ${i+1}</span><span class="v">${x.reps} reps</span><span class="del" onclick="delSet('${s.id}','s',-1,${i},-1)" role="button" aria-label="Borrar serie">✕</span></div>`).join("");
      inner=`<div class="logrow"><div class="stepper" style="max-width:220px;margin:0 auto"><div class="lab">Repeticiones</div>
        <div class="row"><button class="sq" onclick="adjR(-1)" aria-label="Menos reps">−</button><b id="lr" onclick="editNum('r')" title="Toca para escribir las repeticiones">${curReps}</b><button class="sq" onclick="adjR(1)" aria-label="Más reps">+</button></div></div></div>
      <div class="last tap" onclick="toggleGChart('${s.id}')">${lastTxt}${spark(s.id)}</div>
      <div id="gchart" class="gchart"></div>
      ${sg.why?`<div class="qwhy">💡 ${esc(sg.why)}</div>`:''}
      ${setsTxt?`<div class="sets">${setsTxt}</div>`:''}
      <button class="gbtn go" onclick="logSet()">Registrar serie ✓</button>`;
    }
    else if(s.load===true){const ll=lastLog(s.id),ds=sessionLog[s.id]||[],sg=suggestLoad(s.id);
      if(curW==null)curW=sg.w;
      if(curReps==null)curReps=sg.reps;
      const lastTxt=ll?('La última vez: '+ll.sets.map(x=>fmtW(x.w)+'×'+x.reps).join(', ')):'Primera vez — registra tu peso';
      const setsTxt=ds.map((x,i)=>`<div class="setline"><span class="n">Serie ${i+1}</span><span class="v">${fmtW(x.w)} ${s.unit} × ${x.reps}</span><span class="del" onclick="delSet('${s.id}','s',-1,${i},-1)" role="button" aria-label="Borrar serie">✕</span></div>`).join("");
      inner=`<div class="logrow">
        <div class="stepper"><div class="lab">Peso</div><div class="row"><button class="sq" onclick="adjW(-2.5)" aria-label="Bajar peso">−</button><b id="lw" onclick="editNum('w')" title="Toca para escribir el peso exacto">${fmtW(curW)} <small>${s.unit}</small></b><button class="sq" onclick="adjW(2.5)" aria-label="Subir peso">+</button></div></div>
        <div class="stepper"><div class="lab">Reps</div><div class="row"><button class="sq" onclick="adjR(-1)" aria-label="Menos reps">−</button><b id="lr" onclick="editNum('r')" title="Toca para escribir las repeticiones">${curReps}</b><button class="sq" onclick="adjR(1)" aria-label="Más reps">+</button></div></div>
      </div>
      <div class="last tap" onclick="toggleGChart('${s.id}')">${lastTxt}${spark(s.id)}</div>
      <div id="gchart" class="gchart"></div>
      ${sg.why?`<div class="qwhy">💡 ${esc(sg.why)}</div>`:''}
      ${setsTxt?`<div class="sets">${setsTxt}</div>`:''}
      <button class="gbtn go" onclick="logSet()">Registrar serie ✓</button>`;
    }else{inner=`<div class="target">Haz ${s.reps} repeticiones${s.perSide?' <small>por cada lado</small>':''}</div>
    <button class="gbtn go" onclick="afterAction()">Serie completada ✓</button>`;}
  }
  else{const C=(2*Math.PI*90).toFixed(1);
    inner=`<div class="ring"><svg width="200" height="200" viewBox="0 0 200 200"><g transform="rotate(-90 100 100)">
      <circle cx="100" cy="100" r="90" stroke="#22303c" stroke-width="13" fill="none"/>
      <circle id="arc" cx="100" cy="100" r="90" stroke="#34d399" stroke-width="13" fill="none" stroke-linecap="round" stroke-dasharray="${C}" stroke-dashoffset="0"/></g></svg>
      <div class="val"><b id="tv">${s.seconds}</b><span>segundos</span></div></div>
      <button class="gbtn go" id="startT" onclick="startTimer()">▶ Iniciar (${s.seconds}s)</button>`;}
  $("guided").innerHTML=frame(inner);}

let gVidOn=false;
function toggleGVid(){gVidOn=!gVidOn;const b=$("gvid");if(gVidOn){$("gvframe").src=embed(VID[steps[stepi].id]);b.classList.add("show");}else{$("gvframe").src="";b.classList.remove("show");}}
function startTimer(){const s=steps[stepi],C=2*Math.PI*90;let r=s.seconds;const btn=$("startT");if(btn)btn.style.display="none";
  const arc=$("arc");const upd=()=>{$("tv").textContent=r;if(arc)arc.style.strokeDashoffset=(C*(1-r/s.seconds)).toFixed(1);};upd();
  tId=setInterval(()=>{r--;if(r<=0){clearTimer();$("tv").textContent=0;if(arc)arc.style.strokeDashoffset=C;beep();afterAction();}else upd();},1000);}
function afterAction(){const s=steps[stepi];if(s.restAfter>0)renderRest(s.restAfter);else advance();}
function renderRest(sec){clearTimer();restR=sec;
  $("guided").innerHTML=frame(`<div class="phaselab">Descanso</div><div class="timer rest" id="rv">${restR}</div>
    <div class="restadj"><button class="gbtn sec" onclick="adjRest(-30)">−30 s</button><button class="gbtn sec" onclick="adjRest(30)">+30 s</button></div>
    <button class="gbtn rest" onclick="skipRest()">Saltar descanso →</button>`);
  tId=setInterval(()=>{restR--;const el=$("rv");if(restR<=0){clearTimer();beep();advance();}else if(el)el.textContent=restR;},1000);}
function skipRest(){clearTimer();advance();}
function advance(){clearTimer();const prev=steps[stepi];stepi++;
  if(prev&&(stepi>=steps.length||steps[stepi].id!==prev.id))markCheck(curRoutine,prev.id,true);
  touchSess(Math.min(stepi,steps.length-1));
  if(stepi>=steps.length)finish();else renderStep();}
function finish(){clearTimer();const res=finishSession(curRoutine,"guided");
  const s=(res&&res.streak)||loadStreak(),sum=res&&res.summary;
  $("guided").innerHTML=`<div class="done"><div class="em">🎉</div><h2>¡Rutina completada!</h2>
    <p class="mut">${esc(ROUTINES[curRoutine].name)}${sum&&sum.dur?" · "+sum.dur+" min":""}</p><div class="big">🔥 ${s.count}</div>
    <p class="mut">${plural(s.count,"día seguido","días seguidos")} · mejor: ${s.best} · ${s.total} ${plural(s.total,"sesión","sesiones")}</p>
    ${sum?`<p class="mut" style="margin-top:10px;font-size:13px">${sum.exDone} de ${sum.exTotal} ${plural(sum.exTotal,"ejercicio","ejercicios")} · ${sum.sets} ${plural(sum.sets,"serie","series")}${sum.vol>0?" · "+fmtW(sum.vol)+" kg movidos":""}</p>`:""}
    <p class="mut" style="margin-top:16px;font-size:13px">El progreso está en la constancia. ¡Bien hecho!</p>
    <button class="gbtn go" style="margin-top:22px" onclick="exitToHome()">Volver al inicio</button></div>`;beep();}
function exitToHome(){sessionLog={};sessionLogKey=null;stepi=0;history.back();}

/* ---------- CALENDARIO ---------- */
const MONTHS=["enero","febrero","marzo","abril","mayo","junio","julio","agosto","septiembre","octubre","noviembre","diciembre"];
let calY=null,calM=null,calSel=null;
function histIndex(){const h=loadHist(),idx={};h.forEach(x=>{let k=null;
  if(x.date&&x.date.indexOf("/")>0){const p=x.date.split("/");k=p[2]+"-"+p[1].padStart(2,"0")+"-"+p[0].padStart(2,"0");}
  else if(x.iso){k=ds(new Date(x.iso));}
  if(k){(idx[k]=idx[k]||[]).push(x);}});return idx;}
function routColor(key){const r=ROUTINES[key];if(!r)return "g";return r.cls==="n"?"n":r.cls==="p"?"p":"g";}
function emojiFor(key){return (ROUTINES[key]&&ROUTINES[key].emoji)||"🧍";}
function calShift(d){calM+=d;if(calM<0){calM=11;calY--;}if(calM>11){calM=0;calY++;}renderHistory();}
function calPick(k){calSel=k;renderHistory();}
function renderHistory(){const s=loadStreak(),idx=histIndex(),now=new Date();
  if(calY==null){calY=now.getFullYear();calM=now.getMonth();}
  if(calSel==null)calSel=today();
  let b=`<div class="stats" style="margin:0 0 14px">
    <div class="stat"><div class="v">${s.count||0}</div><div class="l">🔥 días seguidos</div></div>
    <div class="stat b2"><div class="v">${s.best||0}</div><div class="l">🏆 mejor</div></div>
    <div class="stat b3"><div class="v">${s.total||0}</div><div class="l">✅ sesiones</div></div></div>`;
  b+=`<div class="cal"><div class="calhead"><div class="calnav" onclick="calShift(-1)" role="button" aria-label="Mes anterior">‹</div>
    <div class="m">${MONTHS[calM]} ${calY}</div>
    <div class="calnav" onclick="calShift(1)" role="button" aria-label="Mes siguiente">›</div></div><div class="calgrid">`;
  ["L","M","X","J","V","S","D"].forEach(w=>b+=`<div class="wd">${w}</div>`);
  const first=new Date(calY,calM,1),lead=(first.getDay()+6)%7,dim=new Date(calY,calM+1,0).getDate();
  for(let i=0;i<lead;i++)b+=`<div class="calcell empty"></div>`;
  for(let d=1;d<=dim;d++){const key=calY+"-"+String(calM+1).padStart(2,"0")+"-"+String(d).padStart(2,"0");
    const sess=idx[key]||[],cls=["calcell"];if(sess.length)cls.push("has");if(key===today())cls.push("today");if(key===calSel)cls.push("sel");
    const cols=[];sess.forEach(x=>{const c=routColor(x.key);if(cols.indexOf(c)<0)cols.push(c);});
    const dots=cols.slice(0,3).map(c=>`<span class="cdot ${c}"></span>`).join("");
    b+=`<div class="${cls.join(" ")}" onclick="calPick('${key}')"><span class="dnum">${d}</span><span class="dots">${dots}</span></div>`;}
  b+=`</div></div>`;
  b+=`<div class="callegend"><span><i class="cdot p"></i>Postura</span><span><i class="cdot n"></i>Cuello</span><span><i class="cdot g"></i>Gimnasio</span></div>`;
  const sel=idx[calSel]||[],p=calSel.split("-");
  b+=`<div class="grouptitle" style="margin:2px 2px 8px">${p[2]}/${p[1]}/${p[0]}</div>`;
  if(!sel.length)b+=`<div class="empty" style="padding:16px 10px">Sin actividad este día.<br>Completa una rutina y quedará registrada aquí.</div>`;
  else b+=sel.map((x,i)=>{const rows=dayRows(calSel,x.key,x.iso?Date.parse(x.iso):0),tot=dayTotals(x,rows);
    return `<div class="hitem" onclick="toggleDay(${i})" role="button" aria-label="Ver detalle">
      <div class="dot">${emojiFor(x.key)}</div>
      <div style="flex:1"><div class="nm">${esc(x.name)}</div><div class="dt">${x.day||""} · ${x.time||""}</div>
      ${tot?`<div class="dt2">${tot}</div>`:""}</div>
      <div class="go">${rows.length?"›":""}</div></div>
      <div class="daydet" id="dd_${i}">${rows.length?rows.map(r=>`<div class="ddrow"><span class="dn">${esc(shortName(r.id))}</span><span class="dv">${r.txt}</span></div>`).join(""):`<div class="ddrow"><span class="dn">Sin series anotadas ese día.</span></div>`}</div>`;}).join("");
  $("histBody").innerHTML=b;}
/* que se hizo un dia concreto: se cruza rp_logs por fecha y rutina, y si la
   sesion trae marca de tiempo se filtra por ella para no mezclar dos sesiones
   de la misma rutina el mismo dia */
function dayRows(dateKey,routineKey,stamp){const logs=loadLogs(),order=effList(routineKey);
  const pick=(useStamp)=>{const out=[];
    Object.keys(logs).forEach(id=>{(logs[id]||[]).forEach(r=>{
      if(r.date!==dateKey)return;
      if(useStamp){if(r.t!==stamp)return;}
      else{if(r.k){if(r.k!==routineKey)return;}else if(order.indexOf(id)<0)return;}
      const sets=r.sets||[];
      out.push({id:id,sets:sets,pos:order.indexOf(id),
        txt:sets.length?sets.map(s=>((s.w||0)>0?fmtW(s.w)+"×":"")+s.reps).join("  ·  "):"✓ hecho"});});});
    return out;};
  let rows=stamp?pick(true):[];
  if(!rows.length)rows=pick(false);
  rows.sort((a,b)=>(a.pos<0?99:a.pos)-(b.pos<0?99:b.pos));
  return rows;}
function dayTotals(x,rows){if(x.sets!=null){const ne=x.exDone||rows.length;
    return `${ne} ${plural(ne,"ejercicio","ejercicios")} · ${x.sets} ${plural(x.sets,"serie","series")}`
      +((x.vol>0)?" · "+fmtW(x.vol)+" kg":"")+((x.dur>0)?" · "+x.dur+" min":"");}
  if(!rows.length)return "";
  let ns=0,vol=0;rows.forEach(r=>{ns+=r.sets.length;r.sets.forEach(s=>{vol+=(s.w||0)*(s.reps||0);});});
  return `${rows.length} ${plural(rows.length,"ejercicio","ejercicios")}`+(ns?` · ${ns} ${plural(ns,"serie","series")}`:"")+((vol>0)?" · "+fmtW(Math.round(vol))+" kg":"");}
function toggleDay(i){const el=$("dd_"+i);if(el)el.classList.toggle("open");}

Object.assign(EX,{"pec_deck":{"name":"Contractora de pecho (pec deck / mariposa)","tag":"carga","type":"reps","sets":3,"reps":10,"rest":90,"load":true,"unit":"kg","steps":["Ajusta el asiento para que las manijas queden a la altura del pecho y apoya bien la espalda en el respaldo.","Junta los brazos al frente con los codos ligeramente flexionados y aprieta el pecho 1 segundo.","Abre lento hasta sentir el estiramiento, sin llevar los codos más atrás de la línea de los hombros."]},"hack_squat":{"name":"Sentadilla en máquina inclinada (hack squat)","tag":"carga","type":"reps","sets":3,"reps":10,"rest":90,"load":true,"unit":"kg","steps":["Apoya espalda y hombros en la máquina, pies al ancho de hombros en el centro de la plataforma.","Baja controlado en 2-3 segundos hasta pasar la paralela, con las rodillas siguiendo la punta del pie.","Empuja con todo el pie hasta arriba sin bloquear las rodillas ni despegar la cadera del respaldo."]},"sentadilla_smith":{"name":"Sentadilla en barra guiada (Smith)","tag":"carga","type":"reps","sets":3,"reps":10,"rest":90,"load":true,"unit":"kg","steps":["Coloca la barra guiada sobre los trapecios y adelanta los pies un paso respecto a la cadera.","Baja controlado hasta que el muslo quede paralelo al suelo, con el pecho alto y el abdomen firme.","Empuja con el medio del pie para subir, sin bloquear del todo las rodillas."]},"rotacion_externa_db":{"name":"Rotación externa de hombro con mancuerna","tag":"carga","type":"reps_side","sets":3,"reps":10,"rest":90,"load":true,"unit":"kg","steps":["De pie, codo pegado al costado y flexionado a 90° con una mancuerna muy ligera.","Gira el antebrazo hacia afuera sin separar el codo del cuerpo.","Vuelve lento al centro; es activación del manguito rotador, no busques peso."]},"colgado_escapular":{"name":"Colgado con retracción escapular","tag":"carga","type":"reps","sets":3,"reps":10,"rest":90,"load":false,"unit":"kg","steps":["Cuélgate de la barra con agarre prono al ancho de hombros y los brazos exten ,"reps":10,"rest":30},"mewing_lengua":{"name":"Postura de lengua (mewing)","tag":"diario","type":"hold","sets":2,"steps":["Labios cerrados y dientes juntos sin apretar; cabeza neutra con la barbilla ligeramente metida.","Apoya TODA la lengua contra el paladar (punta, centro y base) y traga una vez para fijar la posición.","Mantén respirando solo por la nariz. Esto es un hábito de todo el día, la serie solo te enseña la posición."],"load":false,"unit":"kg","holdSec":30,"rest":30},"mandibula_platisma":{"name":"Tensión de platisma y mandíbula","tag":"diario","type":"reps","sets":2,"steps":["Sentado erguido, mirada al frente, hombros bajos y relajados.","Baja las comisuras de los labios enseñando los dientes de abajo hasta marcar los cordones del cuello (platisma).","Sostén la tensión 5–8 s y relaja del todo. No subas los hombros ni eches la cabeza hacia atrás."],"load":false,"unit":"kg","reps":10,"rest":30}});
